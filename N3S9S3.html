<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rituel &mdash; Semaine 9 S&eacute;ance 3 &mdash; Vitesse, distance, temps</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#fffdf7;font-family:Arial,Helvetica,sans-serif;color:#243238;line-height:1.6;padding:14px;overflow-x:hidden}
.bulle{position:fixed;border-radius:50%;background:#3ba5b8;opacity:.12;pointer-events:none;z-index:0}
.b1{width:190px;height:190px;top:-70px;left:-70px}
.b2{width:130px;height:130px;top:-45px;right:-45px}
.b3{width:160px;height:160px;bottom:-60px;left:-55px}
.b4{width:110px;height:110px;bottom:-40px;right:-35px}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto}
.tete{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.etq{display:inline-block;padding:7px 16px;border-radius:8px;color:#fff;font-weight:700;font-size:.95rem}
.etq-sem{background:#8fd3e8;color:#123f4a}
.etq-sea{background:#3ba5b8}
.etq-rit{background:#1f7a8c;font-family:Georgia,"Times New Roman",serif;margin-left:auto}
h1{font-size:clamp(1.3rem,4.5vw,2rem);font-weight:900;color:#1f7a8c;margin:6px 0 18px;line-height:1.3}
.bloc{position:relative;border:2px solid #3ba5b8;border-radius:12px;background:#fff;padding:28px 18px 20px;margin-bottom:18px}
.onglet{position:absolute;top:-17px;left:18px;background:#8fd3e8;color:#123f4a;font-weight:700;font-size:.95rem;padding:5px 18px;border-radius:8px}
.enonce{background:#fdf6f6;border-left:5px solid #7a3e3e;border-radius:6px;padding:14px 16px;margin-bottom:18px;color:#7a3e3e;font-weight:700;font-size:clamp(.92rem,2.5vw,1rem);line-height:1.85;overflow-wrap:break-word}
.tete-ex{display:flex;align-items:flex-start;gap:12px;margin:0 0 14px;min-width:0}
.pastille{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:#1f7a8c;color:#fff;font-weight:700;font-size:1rem;display:flex;align-items:center;justify-content:center}
.consigne{margin:4px 0 0;font-weight:700;text-decoration:underline;color:#1f7a8c;font-size:clamp(.95rem,2.6vw,1.05rem);min-width:0;overflow-wrap:break-word}
.item{padding:12px 0;border-bottom:1px dashed #dceff3}
.item:last-of-type{border-bottom:0}
.q{font-size:clamp(1rem,3vw,1.15rem);font-weight:700;margin:0 0 8px;color:#243238;overflow-wrap:break-word}
.ligne{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-width:0}
.champ{flex:0 1 auto;min-width:0}
input[type="text"]{width:clamp(110px,30vw,170px);min-width:0;padding:9px 8px;font-family:Arial,Helvetica,sans-serif;font-size:1rem;font-weight:700;text-align:center;color:#1f7a8c;background:#f7fcfd;border:1px solid #b9dfe8;border-bottom:2px dotted #3ba5b8;border-radius:6px}
input[type="text"]:focus{outline:2px solid #3ba5b8;outline-offset:1px}
input.correct{border-color:#2e8b57;background:#effaf3;color:#2e8b57}
input.incorrect{border-color:#c0392b;background:#fdefee;color:#c0392b}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
button{font-family:inherit;font-size:.92rem;font-weight:700;min-height:44px;padding:10px 16px;border:0;border-radius:8px;cursor:pointer;background:#3ba5b8;color:#fff;line-height:1.2}
button:hover{background:#1f7a8c}
button.sec{background:#fff;color:#1f7a8c;border:2px solid #3ba5b8}
button.sec:hover{background:#eaf7fa;color:#1f7a8c}
.feedback{margin:10px 0 0;padding:12px 14px;border-left:5px solid #3ba5b8;border-radius:6px;background:#f4fafb;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.75;overflow-wrap:break-word}
.feedback.ok{border-left-color:#2e8b57;background:#effaf3;color:#1e6b40}
.feedback.ko{border-left-color:#c0392b;background:#fdefee;color:#96291d}
.feedback.warn{border-left-color:#c9820a;background:#fff8ea;color:#8a5b04}
.aide{margin:10px 0 0;padding:12px 14px;border-left:5px solid #8fd3e8;background:#f2fafd;border-radius:6px;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.75}
.barre{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.barre button{flex:1 1 190px}
.correction{border:2px dashed #3ba5b8;border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:18px;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.8}
.correction h2{margin:0 0 10px;font-size:1.05rem;color:#1f7a8c}
.correction p{margin:6px 0}
.bilan{border:2px solid #1f7a8c;border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:18px;font-size:.92rem;line-height:1.8}
.bilan .score{font-size:clamp(1.05rem,3.2vw,1.25rem);font-weight:900;color:#1f7a8c}
.bilan .palier{font-weight:700;margin-top:4px}
.recap{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.recap span{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;background:#f4fafb;font-weight:700;font-size:.9rem;border:1px solid #dceff3}
.recap .r-ok{color:#2e8b57}
.recap .r-ko{color:#c0392b}
.legende{margin-top:10px;font-size:.85rem;color:#4d6169}
@media (max-width:768px){.actions{margin-left:0;width:100%}.actions button{flex:1 1 auto}}
@media (max-width:480px){body{padding:10px}.bloc{padding:26px 12px 16px}.etq{font-size:.85rem;padding:6px 12px}.etq-rit{margin-left:0}input[type="text"]{width:100%;max-width:180px}.recap span{font-size:.85rem}}
</style>
</head>
<body>
<div class="bulle b1"></div><div class="bulle b2"></div><div class="bulle b3"></div><div class="bulle b4"></div>

<main class="wrap">

  <div class="tete">
    <span class="etq etq-sem">Semaine 9</span>
    <span class="etq etq-sea">S&eacute;ance 3</span>
    <span class="etq etq-rit">Rituel</span>
  </div>

  <h1>Vitesse, distance, temps</h1>

  <section class="bloc">
    <span class="onglet">Grandeurs et mesures</span>

    <p class="enonce">Je cours &agrave; une vitesse constante de 14&nbsp;km/h. Combien de temps est-ce que je mettrai pour parcourir chaque distance&nbsp;? (Arrondis &agrave; la minute pr&egrave;s.)</p>

    <div class="item">
      <p class="q">a. 7 km ?</p>
      <div class="ligne">
        <span class="champ"><input type="text" id="in-a" inputmode="text" autocomplete="off" placeholder="en min" aria-label="Temps pour parcourir 7 km"></span>
        <span class="actions"><button type="button" data-ok="a">OK</button><button type="button" class="sec" data-aide="a">Indice</button></span>
      </div>
      <div class="feedback" id="fb-a" hidden></div>
      <div class="aide" id="ai-a" hidden></div>
    </div>

    <div class="item">
      <p class="q">b. 10 km ?</p>
      <div class="ligne">
        <span class="champ"><input type="text" id="in-b" inputmode="text" autocomplete="off" placeholder="en min" aria-label="Temps pour parcourir 10 km"></span>
        <span class="actions"><button type="button" data-ok="b">OK</button><button type="button" class="sec" data-aide="b">Indice</button></span>
      </div>
      <div class="feedback" id="fb-b" hidden></div>
      <div class="aide" id="ai-b" hidden></div>
    </div>

    <div class="item">
      <p class="q">c. 400 m ?</p>
      <div class="ligne">
        <span class="champ"><input type="text" id="in-c" inputmode="text" autocomplete="off" placeholder="en min" aria-label="Temps pour parcourir 400 m"></span>
        <span class="actions"><button type="button" data-ok="c">OK</button><button type="button" class="sec" data-aide="c">Indice</button></span>
      </div>
      <div class="feedback" id="fb-c" hidden></div>
      <div class="aide" id="ai-c" hidden></div>
    </div>

  </section>

  <div class="barre">
    <button type="button" id="btn-tout">V&eacute;rifier tout</button>
    <button type="button" class="sec" id="btn-corr">Voir la correction</button>
    <button type="button" class="sec" id="btn-reset">R&eacute;initialiser</button>
  </div>

  <div class="correction" id="correction" hidden></div>
  <div class="bilan" id="bilan" hidden></div>

</main>

<script>
(function(){
  "use strict";

  var VITESSE = 14; // km/h

  // Cle de reponse isolee (section 12 / decision #8 du cadre).
  // Le corrige source donnait les temps non arrondis (30 ; 42.86 ; 1.71 minutes)
  // alors que la consigne demande explicitement d'arrondir a la minute pres.
  // Valeurs correctement arrondies utilisees ici, ecart signale a Umm Idriss.
  var ITEMS = [
    { id:"a", distanceKm:7,
      aide:"Divise la distance par la vitesse pour obtenir un temps en heures, puis convertis en minutes (&times;60).",
      etapes:"Temps = 7 / 14 = 0,5 heure = 0,5 &times; 60 = 30 minutes." },
    { id:"b", distanceKm:10,
      aide:"Divise la distance par la vitesse pour obtenir un temps en heures, puis convertis en minutes (&times;60).",
      etapes:"Temps = 10 / 14 \u2248 0,7143 heure \u2248 0,7143 &times; 60 \u2248 42,86 minutes, soit environ 43 minutes." },
    { id:"c", distanceKm:0.4,
      aide:"N\u2019oublie pas de convertir 400 m en kilom\u00e8tres avant de diviser par la vitesse.",
      etapes:"400 m = 0,4 km. Temps = 0,4 / 14 \u2248 0,0286 heure \u2248 0,0286 &times; 60 \u2248 1,71 minute, soit environ 2 minutes." }
  ];

  var etats = {};
  var occupe = false;

  function trouver(id){
    for (var i = 0; i < ITEMS.length; i++){ if (ITEMS[i].id === id) return ITEMS[i]; }
    return null;
  }

  function esc(txt){
    var d = document.createElement("div");
    d.textContent = String(txt);
    return d.innerHTML;
  }

  function lireValeur(brut){
    var s = String(brut).toLowerCase();
    s = s.replace(/[\u00a0\u202f\u2009]/g, " ").replace(/\s+/g, " ").trim();
    s = s.replace(/[\u2212\u2013\u2014]/g, "-").replace(/,/g, ".");
    var m = /(-?\d+(?:\.\d+)?)\s*(minutes|minute|min)?/.exec(s);
    if (!m) return null;
    if (!/^-?\d+(\.\d+)?$/.test(m[1])) return null;
    return { val:Number(m[1]), dec: (m[1].split(".")[1] || "").length };
  }

  function afficher(id, type, html){
    var fb = document.getElementById("fb-" + id);
    fb.className = "feedback " + type;
    fb.innerHTML = html;
    fb.hidden = false;
  }

  function marquer(input, etat){
    input.classList.remove("correct","incorrect");
    if (etat) input.classList.add(etat);
  }

  function verifier(id){
    var it = trouver(id);
    if (!it) return;
    var input = document.getElementById("in-" + id);
    var brut = input.value;
    marquer(input, "");

    if (brut.replace(/[\s\u00a0]/g,"") === ""){
      etats[id] = "vide";
      afficher(id,"warn","\u26a0\ufe0f Aucune r\u00e9ponse saisie. \u00c9cris un temps en minutes, puis clique sur <strong>OK</strong>.");
      return;
    }

    var lu = lireValeur(brut);
    if (lu === null){
      etats[id] = "incorrect"; marquer(input,"incorrect");
      afficher(id,"warn","\u26a0\ufe0f Saisie non reconnue&nbsp;: &laquo;&nbsp;" + esc(brut) + "&nbsp;&raquo;. \u00c9cris un nombre, par exemple <strong>30</strong>.");
      return;
    }

    var exact = (it.distanceKm / VITESSE) * 60;
    var arrondi = Math.round(exact);
    var cible = arrondi + " minute" + (arrondi > 1 ? "s" : "");

    if (lu.val === arrondi){
      etats[id] = "correct"; marquer(input,"correct");
      afficher(id,"ok","\u2705 Bravo&nbsp;! Il faut environ <strong><u>" + cible + "</u></strong>.");
      return;
    }

    var ecart = Math.abs(lu.val - exact);
    if (ecart <= 0.05){
      etats[id] = "correct"; marquer(input,"correct");
      afficher(id,"ok","\u2705 Bravo&nbsp;! La valeur trouv\u00e9e est exacte. <strong><u>Plus pr\u00e9cis</u></strong>&nbsp;: la consigne demande d\u2019arrondir \u00e0 la minute pr\u00e8s, soit <strong>" + cible + "</strong>.");
      return;
    }

    etats[id] = "incorrect"; marquer(input,"incorrect");
    afficher(id,"ko","\u274c Ce r\u00e9sultat n\u2019est pas correct. Le temps se calcule en divisant la distance par la vitesse (en heures), puis en convertissant en minutes. R\u00e9ponse attendue&nbsp;: <strong><u>" + cible + "</u></strong>.");
  }

  function basculerAide(id){
    var it = trouver(id);
    var box = document.getElementById("ai-" + id);
    if (!it || !box) return;
    if (box.hidden){
      box.innerHTML = "\ud83d\udca1 <strong>Indice&nbsp;:</strong> " + it.aide;
      box.hidden = false;
    } else {
      box.hidden = true;
    }
  }

  function palier(pct){
    if (pct >= 90) return "\ud83d\udfe2 Excellent";
    if (pct >= 75) return "\ud83d\udfe2 Tr\u00e8s bien";
    if (pct >= 60) return "\ud83d\udfe1 Ma\u00eetrise satisfaisante";
    if (pct >= 40) return "\ud83d\udfe0 Ma\u00eetrise fragile";
    return "\ud83d\udd34 Ma\u00eetrise insuffisante";
  }

  function verifierTout(){
    if (occupe) return;
    occupe = true;
    window.setTimeout(function(){ occupe = false; }, 350);

    var total = ITEMS.length, score = 0, recap = "";
    for (var i = 0; i < ITEMS.length; i++){
      var id = ITEMS[i].id;
      verifier(id);
      if (etats[id] === "correct"){ score++; recap += '<span class="r-ok">\u2714 ' + id + '</span>'; }
      else { recap += '<span class="r-ko">\u2718 ' + id + '</span>'; }
    }
    if (score < 0) score = 0;
    if (score > total) score = total;
    var pct = Math.round((score/total)*100);

    var bilan = document.getElementById("bilan");
    bilan.innerHTML =
      '<div class="score">Score&nbsp;: ' + score + '\u2009/\u2009' + total + ' (' + pct + '&nbsp;%)</div>' +
      '<div class="palier">' + palier(pct) + '</div>' +
      '<div class="recap">' + recap + '</div>' +
      '<div class="legende">\u2714 correct &nbsp;\u2022&nbsp; \u2718 incorrect ou non r\u00e9pondu.</div>';
    bilan.hidden = false;
  }

  function basculerCorrection(){
    var box = document.getElementById("correction");
    var btn = document.getElementById("btn-corr");
    if (box.hidden){
      var lignes = "";
      for (var i = 0; i < ITEMS.length; i++){
        lignes += "<p><strong>" + ITEMS[i].id + ".</strong> " + ITEMS[i].etapes + "</p>";
      }
      box.innerHTML = "<h2>Correction</h2>" + lignes;
      box.hidden = false;
      btn.textContent = "Masquer la correction";
    } else {
      box.hidden = true;
      btn.textContent = "Voir la correction";
    }
  }

  function reinitialiser(){
    for (var i = 0; i < ITEMS.length; i++){
      var id = ITEMS[i].id;
      var input = document.getElementById("in-" + id);
      input.value = ""; input.disabled = false; input.readOnly = false;
      input.classList.remove("correct","incorrect");
      var fb = document.getElementById("fb-" + id);
      fb.hidden = true; fb.innerHTML = ""; fb.className = "feedback";
      var ai = document.getElementById("ai-" + id);
      ai.hidden = true; ai.innerHTML = "";
      etats[id] = "vide";
    }
    var bilan = document.getElementById("bilan");
    bilan.hidden = true; bilan.innerHTML = "";
    var corr = document.getElementById("correction");
    corr.hidden = true; corr.innerHTML = "";
    document.getElementById("btn-corr").textContent = "Voir la correction";
    occupe = false;
  }

  function init(){
    for (var i = 0; i < ITEMS.length; i++){ etats[ITEMS[i].id] = "vide"; }

    var bOk = document.querySelectorAll("[data-ok]");
    for (var a = 0; a < bOk.length; a++){
      bOk[a].addEventListener("click", function(){ verifier(this.getAttribute("data-ok")); });
    }
    var bAide = document.querySelectorAll("[data-aide]");
    for (var b = 0; b < bAide.length; b++){
      bAide[b].addEventListener("click", function(){ basculerAide(this.getAttribute("data-aide")); });
    }
    var champs = document.querySelectorAll('input[type="text"]');
    for (var c = 0; c < champs.length; c++){
      champs[c].addEventListener("keydown", function(ev){
        if (ev.key === "Enter"){ ev.preventDefault(); verifier(this.id.replace("in-","")); }
      });
    }
    document.getElementById("btn-tout").addEventListener("click", verifierTout);
    document.getElementById("btn-corr").addEventListener("click", basculerCorrection);
    document.getElementById("btn-reset").addEventListener("click", reinitialiser);
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
