<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rituel &mdash; Semaine 8 S&eacute;ance 3 &mdash; Th&eacute;or&egrave;me de Thal&egrave;s</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#fffdf7;font-family:Arial,Helvetica,sans-serif;color:#243238;line-height:1.6;padding:14px;overflow-x:hidden}
.bulle{position:fixed;border-radius:50%;background:#3ba5b8;opacity:.12;pointer-events:none;z-index:0}
.b1{width:190px;height:190px;top:-70px;left:-70px}
.b2{width:130px;height:130px;top:-45px;right:-45px}
.b3{width:160px;height:160px;bottom:-60px;left:-55px}
.b4{width:110px;height:110px;bottom:-40px;right:-35px}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto}
.tete{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.etq{display:inline-block;padding:7px 16px;border-radius:8px;color:#fff;font-weight:700;font-size:.95rem}
.etq-sem{background:#8fd3e8;color:#123f4a}
.etq-sea{background:#3ba5b8}
.etq-rit{background:#1f7a8c;font-family:Georgia,"Times New Roman",serif;margin-left:auto}
h1{font-size:clamp(1.3rem,4.5vw,2rem);font-weight:900;color:#1f7a8c;margin:6px 0 18px;line-height:1.3}
.bloc{position:relative;border:2px solid #3ba5b8;border-radius:12px;background:#fff;padding:28px 18px 20px;margin-bottom:18px}
.onglet{position:absolute;top:-17px;left:18px;background:#8fd3e8;color:#123f4a;font-weight:700;font-size:.95rem;padding:5px 18px;border-radius:8px}
.enonce{background:#fdf6f6;border-left:5px solid #7a3e3e;border-radius:6px;padding:14px 16px;margin-bottom:18px;color:#7a3e3e;font-weight:700;font-size:clamp(.92rem,2.5vw,1rem);line-height:1.85;overflow-wrap:break-word}
.figure{max-width:300px;width:100%;margin:0 auto 20px;display:block}
.figure img{width:100%;height:auto;display:block}
.tete-ex{display:flex;align-items:flex-start;gap:12px;margin:0 0 14px;min-width:0}
.pastille{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:#1f7a8c;color:#fff;font-weight:700;font-size:1rem;display:flex;align-items:center;justify-content:center}
.consigne{margin:4px 0 0;font-weight:700;text-decoration:underline;color:#1f7a8c;font-size:clamp(.95rem,2.6vw,1.05rem);min-width:0;overflow-wrap:break-word}
.qcm{display:flex;flex-direction:column;gap:10px;margin:8px 0}
.opt{text-align:left;background:#f7fcfd;color:#243238;border:2px solid #dceff3;font-weight:400;font-size:clamp(.92rem,2.5vw,1.05rem);line-height:1.6;padding:14px 16px;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.opt:hover{background:#eaf7fa;color:#243238}
.opt .lettre{font-weight:700;color:#1f7a8c;margin-right:4px}
.opt.sel{border-color:#3ba5b8;background:#eaf7fa}
.opt.bonne{border-color:#2e8b57;background:#effaf3;color:#1e6b40;font-weight:700}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;font-weight:700}
.frac .num,.frac .den{display:block;padding:0 4px}
.frac .num{border-bottom:2px solid currentColor;padding-bottom:1px}
.frac .den{padding-top:1px}
.eg{font-weight:700;margin:0 2px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
button{font-family:inherit;font-size:.92rem;font-weight:700;min-height:44px;padding:10px 16px;border:0;border-radius:8px;cursor:pointer;background:#3ba5b8;color:#fff;line-height:1.2}
button:hover{background:#1f7a8c}
button.sec{background:#fff;color:#1f7a8c;border:2px solid #3ba5b8}
button.sec:hover{background:#eaf7fa;color:#1f7a8c}
.feedback{margin:10px 0 0;padding:12px 14px;border-left:5px solid #3ba5b8;border-radius:6px;background:#f4fafb;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.75;overflow-wrap:break-word}
.feedback.info{border-left-color:#3ba5b8;background:#f4fafb;color:#17505c}
.feedback.warn{border-left-color:#c9820a;background:#fff8ea;color:#8a5b04}
.aide{margin:10px 0 0;padding:12px 14px;border-left:5px solid #8fd3e8;background:#f2fafd;border-radius:6px;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.75}
.barre{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.barre button{flex:1 1 190px}
.correction{border:2px dashed #3ba5b8;border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:18px;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.8}
.correction h2{margin:0 0 10px;font-size:1.05rem;color:#1f7a8c}
.correction p{margin:6px 0}
.bilan{border:2px solid #1f7a8c;border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:18px;font-size:.92rem;line-height:1.8}
.bilan .score{font-size:clamp(1.05rem,3.2vw,1.25rem);font-weight:900;color:#1f7a8c}
.bilan .palier{font-weight:700;margin-top:4px}
.recap{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.recap span{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;background:#f4fafb;font-weight:700;font-size:.9rem;border:1px solid #dceff3}
.recap .r-ok{color:#2e8b57}
.recap .r-ko{color:#c0392b}
.legende{margin-top:10px;font-size:.85rem;color:#4d6169}
@media (max-width:768px){.actions{width:100%}.actions button{flex:1 1 auto}}
@media (max-width:480px){body{padding:10px}.bloc{padding:26px 12px 16px}.etq{font-size:.85rem;padding:6px 12px}.etq-rit{margin-left:0}.recap span{font-size:.85rem}}
</style>
</head>

        <span class="frac"><span class="num">AM</span><span class="den">AB</span></span>
        <span class="eg">=</span>
        <span class="frac"><span class="num">AN</span><span class="den">AC</span></span>
        <span class="eg">=</span>
        <span class="frac"><span class="num">BC</span><span class="den">MN</span></span>
      </button>

        <span class="frac"><span class="num">AM</span><span class="den">AB</span></span>

        <span class="frac"><span class="num">AN</span><span class="den">AC</span></span>

<script>
(function(){
  "use strict";

  var BONNE = 2; // option C (index 0-based), position conforme au corrigé fourni
  var EXPL = "D’après le théorème de Thalès, puisque (MN) et (BC) sont parallèles, les côtés du petit triangle AMN et du grand triangle ABC sont proportionnels, dans le même ordre&nbsp;: AM/AB = AN/AC = MN/BC.";
  var AIDE = "Associe, dans le même ordre, chaque côté du petit triangle (formé par le sommet commun A) au côté correspondant du grand triangle.";

  var choix = null;
  var etat = "vide";
  var occupe = false;

  function afficher(id, type, html){
    var fb = document.getElementById("fb-" + id);
    fb.className = "feedback " + type;
    fb.innerHTML = html;
    fb.hidden = false;
  }

  function choisir(idx){
    choix = idx;
    var opts = document.querySelectorAll('[data-qcm="a"]');
    for (var i = 0; i < opts.length; i++){
      opts[i].classList.remove("sel");
      if (Number(opts[i].getAttribute("data-i")) === idx) opts[i].classList.add("sel");
    }
  }

  function verifier(){
    var opts = document.querySelectorAll('[data-qcm="a"]');
    for (var i = 0; i < opts.length; i++){
      opts[i].classList.remove("bonne");
      if (Number(opts[i].getAttribute("data-i")) === BONNE) opts[i].classList.add("bonne");
    }
    if (choix === null){
      etat = "incorrect";
      afficher("qa", "warn", "\u26a0\ufe0f Aucune proposition n\u2019a \u00e9t\u00e9 choisie. " + EXPL);
      return;
    }
    etat = (choix === BONNE) ? "correct" : "incorrect";
    afficher("qa", "info", "\ud83d\udc40 " + EXPL);
  }

  function basculerAide(){
    var box = document.getElementById("ai-a");
    if (box.hidden){
      box.innerHTML = "\ud83d\udca1 <strong>Indice&nbsp;:</strong> " + AIDE;
      box.hidden = false;
    } else {
      box.hidden = true;
    }
  }

  function palier(pct){
    if (pct >= 90) return "\ud83d\udfe2 Excellent";
    if (pct >= 75) return "\ud83d\udfe2 Tr\u00e8s bien";
    if (pct >= 60) return "\ud83d\udfe1 Ma\u00eetrise satisfaisante";
    if (pct >= 40) return "\ud83d\udfe0 Ma\u00eetrise fragile";
    return "\ud83d\udd34 Ma\u00eetrise insuffisante";
  }

  function verifierTout(){
    if (occupe) return;
    occupe = true;
    window.setTimeout(function(){ occupe = false; }, 350);

    verifier();
    var total = 1, score = etat === "correct" ? 1 : 0;
    var recap = etat === "correct" ? '<span class="r-ok">\u2714 a</span>' : '<span class="r-ko">\u2718 a</span>';
    var pct = Math.round((score/total)*100);

    var bilan = document.getElementById("bilan");
    bilan.innerHTML =
      '<div class="score">Score&nbsp;: ' + score + '\u2009/\u2009' + total + ' (' + pct + '&nbsp;%)</div>' +
      '<div class="palier">' + palier(pct) + '</div>' +
      '<div class="recap">' + recap + '</div>' +
      '<div class="legende">\u2714 correct &nbsp;\u2022&nbsp; \u2718 incorrect ou non r\u00e9pondu. Le choix n\u2019est jamais signal\u00e9 en rouge&nbsp;: seule la bonne r\u00e9ponse est indiqu\u00e9e en vert.</div>';
    bilan.hidden = false;
  }

  function basculerCorrection(){
    var box = document.getElementById("correction");
    var btn = document.getElementById("btn-corr");
    if (box.hidden){
      box.innerHTML =
        "<h2>Correction</h2>" +
        "<p>La bonne r\u00e9ponse est la proposition <strong>C</strong>&nbsp;:</p>" +
        "<p><strong>AM/AB = AN/AC = MN/BC</strong>.</p>" +
        "<p>" + EXPL + "</p>" +
        "<p>Les propositions A et B inversent l\u2019ordre de l\u2019un des rapports (num\u00e9rateur et d\u00e9nominateur \u00e9chang\u00e9s), ce qui rompt la correspondance entre les deux triangles.</p>";
      box.hidden = false;
      btn.textContent = "Masquer la correction";
    } else {
      box.hidden = true;
      btn.textContent = "Voir la correction";
    }
  }

  function reinitialiser(){
    choix = null;
    etat = "vide";
    var opts = document.querySelectorAll('[data-qcm="a"]');
    for (var i = 0; i < opts.length; i++){ opts[i].classList.remove("sel","bonne"); }
    var fb = document.getElementById("fb-qa");
    fb.hidden = true; fb.innerHTML = ""; fb.className = "feedback";
    var ai = document.getElementById("ai-a");
    ai.hidden = true; ai.innerHTML = "";
    var bilan = document.getElementById("bilan");
    bilan.hidden = true; bilan.innerHTML = "";
    var corr = document.getElementById("correction");
    corr.hidden = true; corr.innerHTML = "";
    document.getElementById("btn-corr").textContent = "Voir la correction";
    occupe = false;
  }

  function init(){
    var opts = document.querySelectorAll('[data-qcm="a"]');
    for (var i = 0; i < opts.length; i++){
      opts[i].addEventListener("click", function(){ choisir(Number(this.getAttribute("data-i"))); });
    }
    document.querySelector('[data-qcmok="a"]').addEventListener("click", verifier);
    document.querySelector('[data-aide="a"]').addEventListener("click", basculerAide);
    document.getElementById("btn-tout").addEventListener("click", verifierTout);
    document.getElementById("btn-corr").addEventListener("click", basculerCorrection);
    document.getElementById("btn-reset").addEventListener("click", reinitialiser);
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
