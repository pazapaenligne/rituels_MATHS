<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rituel &mdash; Semaine 2 S&eacute;ance 1 &mdash; Soustraire des nombres d&eacute;cimaux</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#fffdf7;
  font-family:Arial,Helvetica,sans-serif;
  color:#243238;
  line-height:1.6;
  padding:14px;
  overflow-x:hidden;
}
.bulle{position:fixed;border-radius:50%;background:#3ba5b8;opacity:.12;pointer-events:none;z-index:0}
.b1{width:190px;height:190px;top:-70px;left:-70px}
.b2{width:130px;height:130px;top:-45px;right:-45px}
.b3{width:160px;height:160px;bottom:-60px;left:-55px}
.b4{width:110px;height:110px;bottom:-40px;right:-35px}

.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto}

.tete{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.etq{display:inline-block;padding:7px 16px;border-radius:8px;color:#fff;font-weight:700;font-size:.95rem;letter-spacing:.02em}
.etq-sem{background:#8fd3e8;color:#123f4a}
.etq-sea{background:#3ba5b8}
.etq-rit{background:#1f7a8c;font-family:Georgia,"Times New Roman",serif;font-style:normal;margin-left:auto}

h1{
  font-size:clamp(1.3rem,4.5vw,2rem);
  font-weight:900;
  color:#1f7a8c;
  margin:6px 0 18px;
  line-height:1.3;
}

.bloc{
  position:relative;
  border:2px solid #3ba5b8;
  border-radius:12px;
  background:#fff;
  padding:26px 18px 20px;
  margin-bottom:18px;
}
.onglet{
  position:absolute;top:-17px;left:18px;
  background:#8fd3e8;color:#123f4a;
  font-weight:700;font-size:.95rem;
  padding:5px 18px;border-radius:8px;
}
.tete-ex{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;min-width:0}
.pastille{
  flex:0 0 auto;
  width:34px;height:34px;border-radius:50%;
  background:#1f7a8c;color:#fff;
  font-weight:700;font-size:1rem;
  display:flex;align-items:center;justify-content:center;
}
.consigne{
  margin:4px 0 0;
  font-weight:700;text-decoration:underline;
  color:#1f7a8c;
  font-size:clamp(.95rem,2.6vw,1.05rem);
  min-width:0;overflow-wrap:break-word;
}

.item{padding:10px 0;border-bottom:1px dashed #dceff3}
.item:last-of-type{border-bottom:0}
.ligne{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-width:0}
.lettre{flex:0 0 auto;font-weight:700;color:#1f7a8c;width:22px}
.expr{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  min-width:0;
  font-size:clamp(1rem,3vw,1.15rem);font-weight:700;
}
.signe{color:#243238;font-weight:700}
input[type="text"]{
  width:clamp(96px,28vw,150px);
  min-width:0;
  padding:9px 8px;
  font-family:Arial,Helvetica,sans-serif;
  font-size:1rem;font-weight:700;
  text-align:center;
  color:#1f7a8c;
  background:#f7fcfd;
  border:1px solid #b9dfe8;
  border-bottom:2px dotted #3ba5b8;
  border-radius:6px;
}
input[type="text"]:focus{outline:2px solid #3ba5b8;outline-offset:1px}
input.correct{border-color:#2e8b57;background:#effaf3;color:#2e8b57}
input.incorrect{border-color:#c0392b;background:#fdefee;color:#c0392b}

.actions{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
button{
  font-family:inherit;font-size:.92rem;font-weight:700;
  min-height:44px;padding:10px 16px;
  border:0;border-radius:8px;cursor:pointer;
  background:#3ba5b8;color:#fff;
  line-height:1.2;
}
button:hover{background:#1f7a8c}
button.sec{background:#fff;color:#1f7a8c;border:2px solid #3ba5b8}
button.sec:hover{background:#eaf7fa;color:#1f7a8c}

.feedback{
  margin:10px 0 0;
  padding:12px 14px;
  border-left:5px solid #3ba5b8;
  border-radius:6px;
  background:#f4fafb;
  font-size:clamp(.9rem,2.5vw,1rem);
  line-height:1.75;
  font-style:normal;
  overflow-wrap:break-word;
}
.feedback.ok{border-left-color:#2e8b57;background:#effaf3;color:#1e6b40}
.feedback.ko{border-left-color:#c0392b;background:#fdefee;color:#96291d}
.feedback.warn{border-left-color:#c9820a;background:#fff8ea;color:#8a5b04}
.aide{
  margin:10px 0 0;padding:12px 14px;
  border-left:5px solid #8fd3e8;background:#f2fafd;border-radius:6px;
  font-size:clamp(.9rem,2.5vw,1rem);line-height:1.75;
}

.barre{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.barre button{flex:1 1 190px}

.correction{
  border:2px dashed #3ba5b8;border-radius:12px;background:#fff;
  padding:16px 18px;margin-bottom:18px;
  font-size:clamp(.9rem,2.5vw,1rem);line-height:1.8;
}
.correction h2{margin:0 0 8px;font-size:1.05rem;color:#1f7a8c}
.correction h3{margin:14px 0 6px;font-size:.95rem;color:#1f7a8c}
.correction ul{margin:6px 0 0;padding-left:20px}
.correction li{margin-bottom:8px}

.bilan{
  border:2px solid #1f7a8c;border-radius:12px;background:#fff;
  padding:16px 18px;margin-bottom:18px;
  font-size:.92rem;line-height:1.8;
}
.bilan .score{font-size:clamp(1.05rem,3.2vw,1.25rem);font-weight:900;color:#1f7a8c}
.bilan .palier{font-weight:700;margin-top:4px}
.recap{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.recap span{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:8px;background:#f4fafb;
  font-weight:700;font-size:.9rem;border:1px solid #dceff3;
}
.recap .r-ok{color:#2e8b57}
.recap .r-ko{color:#c0392b}
.legende{margin-top:10px;font-size:.85rem;color:#4d6169}

@media (max-width:768px){
  .actions{margin-left:0;width:100%}
  .actions button{flex:1 1 auto}
}
@media (max-width:480px){
  body{padding:10px}
  .bloc{padding:24px 12px 16px}
  .etq{font-size:.85rem;padding:6px 12px}
  .etq-rit{margin-left:0}
  .expr{width:100%}
  input[type="text"]{width:100%;max-width:180px}
  .recap span{font-size:.85rem}
}
</style>
</head>
<body>
<div class="bulle b1"></div>
<div class="bulle b2"></div>
<div class="bulle b3"></div>
<div class="bulle b4"></div>

<main class="wrap">

  <div class="tete">
    <span class="etq etq-sem">Semaine 2</span>
    <span class="etq etq-sea">S&eacute;ance 1</span>
    <span class="etq etq-rit">Rituel</span>
  </div>

  <h1>Poser et calculer une soustraction de nombres d&eacute;cimaux</h1>

  <section class="bloc">
    <span class="onglet">Calcul</span>

    <div class="tete-ex">
      <span class="pastille">1</span>
      <p class="consigne">Pose l&rsquo;op&eacute;ration sur ton cahier, puis &eacute;cris le r&eacute;sultat&nbsp;:</p>
    </div>

    <div class="item">
      <div class="ligne">
        <span class="lettre">a.</span>
        <span class="expr">
          <span>89,3</span><span class="signe">&minus;</span><span>58,2</span><span class="signe">=</span>
          <input type="text" id="in-a" inputmode="decimal" autocomplete="off" aria-label="Résultat de 89,3 moins 58,2">
        </span>
        <span class="actions">
          <button type="button" data-ok="a">OK</button>
          <button type="button" class="sec" data-aide="a">Indice</button>
        </span>
      </div>
      <div class="feedback" id="fb-a" hidden></div>
      <div class="aide" id="ai-a" hidden></div>
    </div>
    <div class="item">
      <div class="ligne">
        <span class="lettre">b.</span>
        <span class="expr">
          <span>19,5</span><span class="signe">&minus;</span><span>13,4</span><span class="signe">=</span>
          <input type="text" id="in-b" inputmode="decimal" autocomplete="off" aria-label="Résultat de 19,5 moins 13,4">
        </span>
        <span class="actions">
          <button type="button" data-ok="b">OK</button>
          <button type="button" class="sec" data-aide="b">Indice</button>
        </span>
      </div>
      <div class="feedback" id="fb-b" hidden></div>
      <div class="aide" id="ai-b" hidden></div>
    </div>
    <div class="item">
      <div class="ligne">
        <span class="lettre">c.</span>
        <span class="expr">
          <span>78,2</span><span class="signe">&minus;</span><span>12</span><span class="signe">=</span>
          <input type="text" id="in-c" inputmode="decimal" autocomplete="off" aria-label="Résultat de 78,2 moins 12">
        </span>
        <span class="actions">
          <button type="button" data-ok="c">OK</button>
          <button type="button" class="sec" data-aide="c">Indice</button>
        </span>
      </div>
      <div class="feedback" id="fb-c" hidden></div>
      <div class="aide" id="ai-c" hidden></div>
    </div>
    <div class="item">
      <div class="ligne">
        <span class="lettre">d.</span>
        <span class="expr">
          <span>150,2</span><span class="signe">&minus;</span><span>95,1</span><span class="signe">=</span>
          <input type="text" id="in-d" inputmode="decimal" autocomplete="off" aria-label="Résultat de 150,2 moins 95,1">
        </span>
        <span class="actions">
          <button type="button" data-ok="d">OK</button>
          <button type="button" class="sec" data-aide="d">Indice</button>
        </span>
      </div>
      <div class="feedback" id="fb-d" hidden></div>
      <div class="aide" id="ai-d" hidden></div>
    </div>

  </section>

  <div class="barre">
    <button type="button" id="btn-tout">V&eacute;rifier tout</button>
    <button type="button" class="sec" id="btn-corr">Voir la correction</button>
    <button type="button" class="sec" id="btn-reset">R&eacute;initialiser</button>
  </div>

  <div class="correction" id="correction" hidden></div>

  <div class="bilan" id="bilan" hidden></div>

</main>

<script>
(function(){
  "use strict";

  var ITEMS = [
    { id:"a", a:"89,3", b:"58,2", res:"31,1",
      aide:"Aligne bien les virgules l\u2019une sous l\u2019autre avant de soustraire, chiffre par chiffre, en partant de la droite." },
    { id:"b", a:"19,5", b:"13,4", res:"6,1",
      aide:"Aligne les virgules, puis soustrais les dixi\u00e8mes, puis les unit\u00e9s, puis les dizaines." },
    { id:"c", a:"78,2", b:"12", res:"66,2",
      aide:"12 s\u2019\u00e9crit 12,0 : ajoute un z\u00e9ro apr\u00e8s la virgule pour aligner les deux nombres avant de soustraire." },
    { id:"d", a:"150,2", b:"95,1", res:"55,1",
      aide:"Pense \u00e0 la retenue si besoin : aligne d\u2019abord les virgules, puis soustrais rang par rang." }
  ];

  var etats = {};
  var occupe = false;

  function trouver(id){
    for (var i = 0; i < ITEMS.length; i++){ if (ITEMS[i].id === id) return ITEMS[i]; }
    return null;
  }

  function esc(txt){
    var d = document.createElement("div");
    d.textContent = String(txt);
    return d.innerHTML;
  }

  function normalise(brut){
    var s = String(brut);
    s = s.replace(/[\s\u00a0\u202f\u2009]/g, "");
    s = s.replace(/[\u2212\u2013\u2014]/g, "-");
    s = s.replace(/,/g, ".");
    if (s === "") return null;
    if (!/^-?(\d+(\.\d*)?|\.\d+)$/.test(s)) return null;
    return s;
  }

  function decompose(s){
    var neg = false;
    if (s.charAt(0) === "-"){ neg = true; s = s.slice(1); }
    var parts = s.split(".");
    var ent = parts[0] === "" ? "0" : parts[0];
    var dec = parts.length > 1 ? parts[1] : "";
    ent = ent.replace(/^0+(?=\d)/, "");
    dec = dec.replace(/0+$/, "");
    if (ent === "0" && dec === "") neg = false;
    return { neg:neg, ent:ent, dec:dec };
  }

  function cmpAbs(a, b){
    if (a.ent.length !== b.ent.length) return a.ent.length > b.ent.length ? 1 : -1;
    if (a.ent !== b.ent) return a.ent > b.ent ? 1 : -1;
    var n = Math.max(a.dec.length, b.dec.length);
    var da = a.dec + new Array(n - a.dec.length + 1).join("0");
    var db = b.dec + new Array(n - b.dec.length + 1).join("0");
    if (da === db) return 0;
    return da > db ? 1 : -1;
  }

  function comparer(x, y){
    var A = decompose(x), B = decompose(y);
    if (A.neg !== B.neg) return A.neg ? -1 : 1;
    var r = cmpAbs(A, B);
    return A.neg ? -r : r;
  }

  function afficher(id, type, html){
    var fb = document.getElementById("fb-" + id);
    fb.className = "feedback " + type;
    fb.innerHTML = html;
    fb.hidden = false;
  }

  function verifier(id){
    var it = trouver(id);
    if (!it) return;
    var input = document.getElementById("in-" + id);
    var brut = input.value;
    input.classList.remove("correct", "incorrect");

    if (brut.replace(/[\s\u00a0]/g, "") === ""){
      etats[id] = "vide";
      afficher(id, "warn", "\u26a0\ufe0f Aucune r\u00e9ponse saisie. Pose l\u2019op\u00e9ration sur ton cahier, puis \u00e9cris le r\u00e9sultat, avant de cliquer sur <strong>OK</strong>.");
      return;
    }

    var val = normalise(brut);
    if (val === null){
      etats[id] = "incorrect";
      input.classList.add("incorrect");
      afficher(id, "warn", "\u26a0\ufe0f Saisie non reconnue&nbsp;: &laquo;&nbsp;" + esc(brut) + "&nbsp;&raquo;. Attendu&nbsp;: un <strong>nombre d\u00e9cimal</strong> seul, avec une virgule (ou un point).");
      return;
    }

    if (comparer(val, normalise(it.res)) === 0){
      etats[id] = "correct";
      input.classList.add("correct");
      afficher(id, "ok", "\u2705 Bravo&nbsp;! <strong>" + esc(it.a) + " \u2212 " + esc(it.b) + " = " + esc(it.res) + "</strong>.");
      return;
    }

    etats[id] = "incorrect";
    input.classList.add("incorrect");
    afficher(id, "ko", "\u274c Ce n\u2019est pas le r\u00e9sultat attendu. V\u00e9rifie l\u2019alignement des virgules et le sens de la soustraction.<br>R\u00e9ponse attendue&nbsp;: <strong><u>" + esc(it.res) + "</u></strong>.");
  }

  function basculerAide(id){
    var it = trouver(id);
    var box = document.getElementById("ai-" + id);
    if (!it || !box) return;
    if (box.hidden){
      box.innerHTML = "\ud83d\udca1 <strong>Indice&nbsp;:</strong> " + esc(it.aide);
      box.hidden = false;
    } else {
      box.hidden = true;
    }
  }

  function palier(pct){
    if (pct >= 90) return "\ud83d\udfe2 Excellent";
    if (pct >= 75) return "\ud83d\udfe2 Tr\u00e8s bien";
    if (pct >= 60) return "\ud83d\udfe1 Ma\u00eetrise satisfaisante";
    if (pct >= 40) return "\ud83d\udfe0 Ma\u00eetrise fragile";
    return "\ud83d\udd34 Ma\u00eetrise insuffisante";
  }

  function verifierTout(){
    if (occupe) return;
    occupe = true;
    window.setTimeout(function(){ occupe = false; }, 350);

    var total = ITEMS.length;
    var score = 0;
    var recap = "";

    for (var i = 0; i < ITEMS.length; i++){
      var id = ITEMS[i].id;
      verifier(id);
      var e = etats[id];
      if (e === "correct"){
        score++;
        recap += '<span class="r-ok">\u2714 ' + id + '</span>';
      } else {
        recap += '<span class="r-ko">\u2718 ' + id + '</span>';
      }
    }

    if (score < 0) score = 0;
    if (score > total) score = total;
    var pct = Math.round((score / total) * 100);

    var bilan = document.getElementById("bilan");
    bilan.innerHTML =
      '<div class="score">Score&nbsp;: ' + score + '\u2009/\u2009' + total + ' (' + pct + '&nbsp;%)</div>' +
      '<div class="palier">' + palier(pct) + '</div>' +
      '<div class="recap">' + recap + '</div>' +
      '<div class="legende">\u2714 correct &nbsp;\u2022&nbsp; \u2718 incorrect ou non r\u00e9pondu.</div>';
    bilan.hidden = false;
  }

  function basculerCorrection(){
    var box = document.getElementById("correction");
    var btn = document.getElementById("btn-corr");
    if (box.hidden){
        "<h2>Correction</h2>" +
        "<ul>" +
          "<li><strong>a.</strong> 89,3 \u2212 58,2 = <strong><u>31,1</u></strong>.</li>" +
          "<li><strong>b.</strong> 19,5 \u2212 13,4 = <strong><u>6,1</u></strong>.</li>" +
          "<li><strong>c.</strong> 78,2 \u2212 12,0 = <strong><u>66,2</u></strong> (12 s\u2019\u00e9crit 12,0 pour aligner les virgules).</li>" +
          "<li><strong>d.</strong> 150,2 \u2212 95,1 = <strong><u>55,1</u></strong>.</li>" +
        "</ul>" +
        "<p><strong>M\u00e9thode&nbsp;:</strong> on aligne toujours les virgules avant de soustraire, en compl\u00e9tant si besoin par des z\u00e9ros, puis on soustrait rang par rang en partant de la droite (retenue si n\u00e9cessaire).</p>";
      box.hidden = false;
      btn.textContent = "Masquer la correction";
    } else {
      box.hidden = true;
      btn.textContent = "Voir la correction";
    }
  }

  function reinitialiser(){
    for (var i = 0; i < ITEMS.length; i++){
      var id = ITEMS[i].id;
      var input = document.getElementById("in-" + id);
      input.value = "";
      input.disabled = false;
      input.readOnly = false;
      input.classList.remove("correct", "incorrect");
      var fb = document.getElementById("fb-" + id);
      fb.hidden = true;
      fb.innerHTML = "";
      fb.className = "feedback";
      var ai = document.getElementById("ai-" + id);
      ai.hidden = true;
      ai.innerHTML = "";
      etats[id] = "vide";
    }
    var bilan = document.getElementById("bilan");
    bilan.hidden = true;
    bilan.innerHTML = "";
    var corr = document.getElementById("correction");
    corr.hidden = true;
    corr.innerHTML = "";
    document.getElementById("btn-corr").textContent = "Voir la correction";
    occupe = false;
  }

  function init(){
    for (var i = 0; i < ITEMS.length; i++){ etats[ITEMS[i].id] = "vide"; }

    var boutonsOk = document.querySelectorAll("[data-ok]");
    for (var j = 0; j < boutonsOk.length; j++){
      boutonsOk[j].addEventListener("click", function(){
        verifier(this.getAttribute("data-ok"));
      });
    }

    var boutonsAide = document.querySelectorAll("[data-aide]");
    for (var k = 0; k < boutonsAide.length; k++){
      boutonsAide[k].addEventListener("click", function(){
        basculerAide(this.getAttribute("data-aide"));
      });
    }

    var champs = document.querySelectorAll('input[type="text"]');
    for (var m = 0; m < champs.length; m++){
      champs[m].addEventListener("keydown", function(ev){
        if (ev.key === "Enter"){
          ev.preventDefault();
          verifier(this.id.replace("in-", ""));
        }
      });
    }

    document.getElementById("btn-tout").addEventListener("click", verifierTout);
    document.getElementById("btn-corr").addEventListener("click", basculerCorrection);
    document.getElementById("btn-reset").addEventListener("click", reinitialiser);
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
