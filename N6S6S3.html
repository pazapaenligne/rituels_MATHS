<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rituel &mdash; Semaine 6 S&eacute;ance 3 &mdash; Classer des triangles</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#fffdf7;font-family:Arial,Helvetica,sans-serif;color:#243238;line-height:1.6;padding:14px;overflow-x:hidden}
.bulle{position:fixed;border-radius:50%;background:#3ba5b8;opacity:.12;pointer-events:none;z-index:0}
.b1{width:190px;height:190px;top:-70px;left:-70px}
.b2{width:130px;height:130px;top:-45px;right:-45px}
.b3{width:160px;height:160px;bottom:-60px;left:-55px}
.b4{width:110px;height:110px;bottom:-40px;right:-35px}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto}
.tete{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.etq{display:inline-block;padding:7px 16px;border-radius:8px;color:#fff;font-weight:700;font-size:.95rem}
.etq-sem{background:#8fd3e8;color:#123f4a}
.etq-sea{background:#3ba5b8}
.etq-rit{background:#1f7a8c;font-family:Georgia,"Times New Roman",serif;margin-left:auto}
h1{font-size:clamp(1.3rem,4.5vw,2rem);font-weight:900;color:#1f7a8c;margin:6px 0 18px;line-height:1.3}
.bloc{position:relative;border:2px solid #3ba5b8;border-radius:12px;background:#fff;padding:28px 18px 20px;margin-bottom:18px}
.onglet{position:absolute;top:-17px;left:18px;background:#8fd3e8;color:#123f4a;font-weight:700;font-size:.95rem;padding:5px 18px;border-radius:8px}
.tete-ex{display:flex;align-items:flex-start;gap:12px;margin:22px 0 14px;min-width:0}
.pastille{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:#1f7a8c;color:#fff;font-weight:700;font-size:1rem;display:flex;align-items:center;justify-content:center}
.consigne{margin:4px 0 0;font-weight:700;text-decoration:underline;color:#1f7a8c;font-size:clamp(.95rem,2.6vw,1.05rem);min-width:0;overflow-wrap:break-word}
.cadre{border:1px solid #dceff3;border-radius:8px;background:#fbfeff;padding:12px;margin-bottom:14px;text-align:center}
.cadre img{width:100%;height:auto;max-width:820px;border-radius:6px}
.tableau-scroll{overflow-x:auto;margin-bottom:8px}
.tableau-tri{border-collapse:collapse;width:100%;min-width:520px}
.tableau-tri th{background:#8fd3e8;color:#123f4a;font-weight:700;padding:8px 6px;border:1px solid #b9dfe8;font-size:.85rem}
.tableau-tri td.lib{border:1px solid #dceff3;background:#fbfeff;padding:8px 6px;text-align:center;font-weight:700;color:#1f7a8c;width:70px}
.tableau-tri td.cell-clic{border:1px solid #dceff3;background:#f7fcfd;cursor:pointer;text-align:center;width:80px;height:46px;font-size:1.2rem;font-weight:900;color:#1f7a8c;-webkit-user-select:none;user-select:none}
.tableau-tri td.cell-clic:hover{background:#eaf7fa}
.tableau-tri td.cell-clic.sel::after{content:"\2715"}
.tableau-tri td.cell-clic.bonne{background:#effaf3;color:#2e8b57}
.tableau-tri td.cell-clic.bonne::after{content:"\2715"}
.tableau-tri td.cell-clic.incorrect{background:#fdefee;color:#c0392b}
.actions{display:flex;flex-wrap:wrap;gap:8px}
button{font-family:inherit;font-size:.92rem;font-weight:700;min-height:44px;padding:10px 16px;border:0;border-radius:8px;cursor:pointer;background:#3ba5b8;color:#fff;line-height:1.2}
button:hover{background:#1f7a8c}
button.sec{background:#fff;color:#1f7a8c;border:2px solid #3ba5b8}
button.sec:hover{background:#eaf7fa}
.feedback{margin:10px 0 0;padding:12px 14px;border-left:5px solid #3ba5b8;border-radius:6px;background:#f4fafb;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.75;overflow-wrap:break-word}
.feedback.ok{border-left-color:#2e8b57;background:#effaf3;color:#1e6b40}
.feedback.ko{border-left-color:#c0392b;background:#fdefee;color:#96291d}
.feedback.warn{border-left-color:#c9820a;background:#fff8ea;color:#8a5b04}
.barre{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.barre button{flex:1 1 190px}
.correction{border:2px dashed #3ba5b8;border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:18px;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.8}
.correction h2{margin:0 0 10px;font-size:1.05rem;color:#1f7a8c}
.correction table{border-collapse:collapse;width:100%;margin:10px 0;font-size:.9rem}
.correction table th,.correction table td{border:1px solid #dceff3;padding:6px 10px;text-align:center}
.correction table th{background:#f4fafb;color:#1f7a8c}
.bilan{border:2px solid #1f7a8c;border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:18px;font-size:.92rem;line-height:1.8}
.bilan .score{font-size:clamp(1.05rem,3.2vw,1.25rem);font-weight:900;color:#1f7a8c}
.bilan .palier{font-weight:700;margin-top:4px}
.legende{margin-top:10px;font-size:.85rem;color:#4d6169}
@media (max-width:480px){
  body{padding:10px}
  .bloc{padding:26px 12px 16px}
  .etq{font-size:.85rem;padding:6px 12px}
  .etq-rit{margin-left:0}
  .tableau-tri td.cell-clic{width:60px;height:40px}
}
</style>
</head>

    { id:"t9", nom:"Fig. 9", bonne:3 }
  ];
  var LIB_TRI = ["isoc\u00e8le","rectangle","\u00e9quilat\u00e9ral","quelconque"];

  var etats = {};
  var choixTri = {};
  var occupe = false;

  function afficher(type, html){
    var fb = document.getElementById("fb-tri");
    fb.className = "feedback " + type;
    fb.innerHTML = html;
    fb.hidden = false;
  }

  function choisirTri(id, idx){
    choixTri[id] = idx;
    var opts = document.querySelectorAll('[data-tri="' + id + '"]');
    for (var i = 0; i < opts.length; i++){
      opts[i].classList.remove("sel");
      if (Number(opts[i].getAttribute("data-i")) === idx) opts[i].classList.add("sel");
    }
  }

  function verifierTri(tri){
    var opts = document.querySelectorAll('[data-tri="' + tri.id + '"]');
    for (var i = 0; i < opts.length; i++){
      opts[i].classList.remove("bonne","incorrect");
      var idx = Number(opts[i].getAttribute("data-i"));
      if (idx === tri.bonne){ opts[i].classList.add("bonne"); }
      else if (idx === choixTri[tri.id]){ opts[i].classList.add("incorrect"); }
    }
    var choix = choixTri[tri.id];
    etats[tri.id] = (choix === tri.bonne) ? "correct" : (choix === undefined || choix === null ? "vide" : "incorrect");
  }

  function verifierTriangles(){
    TRIANGLES.forEach(function(tri){ verifierTri(tri); });
    var nb = TRIANGLES.filter(function(t){ return etats[t.id] === "correct"; }).length;
    if (nb === TRIANGLES.length){
      afficher("ok", "\u2705 Bravo&nbsp;! Les 9 triangles sont bien class\u00e9s.");
    } else if (nb === 0) {
      afficher("warn", "\u26a0\ufe0f Aucune r\u00e9ponse correcte pour l\u2019instant. Regarde bien les longueurs des c\u00f4t\u00e9s et les angles de chaque figure.");
    } else {
      afficher("warn", "\u26a0\ufe0f " + nb + "&nbsp;/&nbsp;9 triangles bien class\u00e9s. La case verte indique la bonne r\u00e9ponse&nbsp;; repasse sur les cases rouges ou vides.");
    }
  }

  function palier(pct){
    if (pct >= 90) return "\ud83d\udfe2 Excellent";
    if (pct >= 75) return "\ud83d\udfe2 Tr\u00e8s bien";
    if (pct >= 60) return "\ud83d\udfe1 Ma\u00eetrise satisfaisante";
    if (pct >= 40) return "\ud83d\udfe0 Ma\u00eetrise fragile";
    return "\ud83d\udd34 Ma\u00eetrise insuffisante";
  }

  function verifierTout(){
    if (occupe) return;
    occupe = true;
    window.setTimeout(function(){ occupe = false; }, 350);

    verifierTriangles();
    var total = TRIANGLES.length;
    var score = TRIANGLES.filter(function(t){ return etats[t.id] === "correct"; }).length;
    var pct = Math.round((score/total)*100);
    var bilan = document.getElementById("bilan");
    bilan.innerHTML =
      '<div class="score">Score&nbsp;: ' + score + '\u2009/\u2009' + total + ' (' + pct + '&nbsp;%)</div>' +
      '<div class="palier">' + palier(pct) + '</div>' +
      '<div class="legende">La case verte indique toujours la bonne cat\u00e9gorie apr\u00e8s v\u00e9rification.</div>';
    bilan.hidden = false;
  }

  function basculerCorrection(){
    var box = document.getElementById("correction");
    var btn = document.getElementById("btn-corr");
    if (box.hidden){
      var lignes = "";
      TRIANGLES.forEach(function(t){
        lignes += "<tr><td>" + t.nom + "</td><td>" + LIB_TRI[t.bonne].charAt(0).toUpperCase() + LIB_TRI[t.bonne].slice(1) + "</td></tr>";
      });
      box.innerHTML =
        "<h2>Correction</h2>" +
        "<table><tr><th>Figure</th><th>Nature</th></tr>" + lignes + "</table>" +
        "<p><strong>Rappel&nbsp;:</strong> un triangle <strong>isoc\u00e8le</strong> a deux c\u00f4t\u00e9s de m\u00eame longueur ; un triangle <strong>rectangle</strong> a un angle droit ; un triangle <strong>\u00e9quilat\u00e9ral</strong> a ses trois c\u00f4t\u00e9s \u00e9gaux ; un triangle <strong>quelconque</strong> n\u2019a aucune de ces propri\u00e9t\u00e9s.</p>";
      box.hidden = false;
      btn.textContent = "Masquer la correction";
    } else {
      box.hidden = true;
      btn.textContent = "Voir la correction";
    }
  }

  function reinitialiser(){
    TRIANGLES.forEach(function(tri){
      choixTri[tri.id] = null;
      var opts = document.querySelectorAll('[data-tri="' + tri.id + '"]');
      for (var i = 0; i < opts.length; i++){ opts[i].classList.remove("sel","bonne","incorrect"); }
      etats[tri.id] = "vide";
    });
    var fb = document.getElementById("fb-tri");
    fb.hidden = true; fb.innerHTML = ""; fb.className = "feedback";
    var bilan = document.getElementById("bilan");
    bilan.hidden = true; bilan.innerHTML = "";
    var corr = document.getElementById("correction");
    corr.hidden = true; corr.innerHTML = "";
    document.getElementById("btn-corr").textContent = "Voir la correction";
    occupe = false;
  }

  function init(){
    TRIANGLES.forEach(function(t){ etats[t.id] = "vide"; choixTri[t.id] = null; });

    var bTri = document.querySelectorAll("[data-tri]");
    for (var i = 0; i < bTri.length; i++){
      bTri[i].addEventListener("click", function(){
        choisirTri(this.getAttribute("data-tri"), Number(this.getAttribute("data-i")));
      });
      bTri[i].addEventListener("keydown", function(ev){
        if (ev.key === "Enter" || ev.key === " "){
          ev.preventDefault();
          choisirTri(this.getAttribute("data-tri"), Number(this.getAttribute("data-i")));
        }
      });
    }
    document.getElementById("btn-verif-tri").addEventListener("click", verifierTriangles);
    document.getElementById("btn-tout").addEventListener("click", verifierTout);
    document.getElementById("btn-corr").addEventListener("click", basculerCorrection);
    document.getElementById("btn-reset").addEventListener("click", reinitialiser);
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
