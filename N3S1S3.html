<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rituel &mdash; Semaine 1 S&eacute;ance 3 &mdash; Conversions de dur&eacute;es</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#fffdf7;font-family:Arial,Helvetica,sans-serif;color:#243238;line-height:1.6;padding:14px;overflow-x:hidden}
.bulle{position:fixed;border-radius:50%;background:#3ba5b8;opacity:.12;pointer-events:none;z-index:0}
.b1{width:190px;height:190px;top:-70px;left:-70px}
.b2{width:130px;height:130px;top:-45px;right:-45px}
.b3{width:160px;height:160px;bottom:-60px;left:-55px}
.b4{width:110px;height:110px;bottom:-40px;right:-35px}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto}
.tete{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.etq{display:inline-block;padding:7px 16px;border-radius:8px;color:#fff;font-weight:700;font-size:.95rem}
.etq-sem{background:#8fd3e8;color:#123f4a}
.etq-sea{background:#3ba5b8}
.etq-rit{background:#1f7a8c;font-family:Georgia,"Times New Roman",serif;margin-left:auto}
h1{font-size:clamp(1.3rem,4.5vw,2rem);font-weight:900;color:#1f7a8c;margin:6px 0 18px;line-height:1.3}
.bloc{position:relative;border:2px solid #3ba5b8;border-radius:12px;background:#fff;padding:26px 18px 20px;margin-bottom:18px}
.onglet{position:absolute;top:-17px;left:18px;background:#8fd3e8;color:#123f4a;font-weight:700;font-size:.95rem;padding:5px 18px;border-radius:8px}
.consigne-intro{margin:4px 0 18px;font-weight:700;text-decoration:underline;color:#1f7a8c;font-size:clamp(.95rem,2.6vw,1.05rem);line-height:1.75}
.item{padding:12px 0 14px;border-bottom:1px dashed #dceff3}
.item:last-of-type{border-bottom:0}
.q{font-size:clamp(1rem,3vw,1.15rem);font-weight:700;margin:0 0 8px;color:#243238;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ligne{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}
.champ{flex:0 0 auto}
input[type="text"]{
  width:90px;padding:9px 6px;font-family:Arial,Helvetica,sans-serif;font-size:1rem;font-weight:700;
  color:#1f7a8c;background:#f7fcfd;border:1px solid #b9dfe8;border-bottom:2px dotted #3ba5b8;
  border-radius:6px;text-align:center;min-height:44px;
}
input[type="text"]:focus{outline:2px solid #3ba5b8;outline-offset:1px}
.correct{border-color:#2e8b57;background:#effaf3;color:#1e6b40}
.partiel{border-color:#c9820a;background:#fff8ea;color:#a86c06}
.incorrect{border-color:#c0392b;background:#fdefee;color:#96291d}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{font-family:inherit;font-size:.92rem;font-weight:700;min-height:44px;padding:10px 16px;border:0;border-radius:8px;cursor:pointer;background:#3ba5b8;color:#fff;line-height:1.2}
button:hover{background:#1f7a8c}
button.sec{background:#fff;color:#1f7a8c;border:2px solid #3ba5b8}
button.sec:hover{background:#eaf7fa}
.feedback{margin:10px 0 0;padding:12px 14px;border-left:5px solid #3ba5b8;border-radius:6px;background:#f4fafb;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.75;overflow-wrap:break-word}
.feedback.ok{border-left-color:#2e8b57;background:#effaf3;color:#1e6b40}
.feedback.ko{border-left-color:#c0392b;background:#fdefee;color:#96291d}
.feedback.warn{border-left-color:#c9820a;background:#fff8ea;color:#8a5b04}
.aide{margin:10px 0 0;padding:12px 14px;border-left:5px solid #8fd3e8;background:#f2fafd;border-radius:6px;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.75}
.barre{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.barre button{flex:1 1 190px}
.correction{border:2px dashed #3ba5b8;border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:18px;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.8}
.correction h2{margin:0 0 8px;font-size:1.05rem;color:#1f7a8c}
.correction ul{margin:6px 0;padding-left:20px}
.correction li{margin-bottom:6px}
.bilan{border:2px solid #1f7a8c;border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:18px;font-size:.92rem;line-height:1.8}
.bilan .score{font-size:clamp(1.05rem,3.2vw,1.25rem);font-weight:900;color:#1f7a8c}
.bilan .palier{font-weight:700;margin-top:4px}
.recap{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.recap span{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;background:#f4fafb;font-weight:700;font-size:.9rem;border:1px solid #dceff3}
.recap .r-ok{color:#2e8b57}
.recap .r-mid{color:#c9820a}
.recap .r-ko{color:#c0392b}
.legende{margin-top:10px;font-size:.85rem;color:#4d6169}
@media (max-width:480px){body{padding:10px}.bloc{padding:24px 12px 16px}.etq{font-size:.85rem;padding:6px 12px}.etq-rit{margin-left:0}.recap span{font-size:.85rem}}
</style>
</head>
<body>
<div class="bulle b1"></div>
<div class="bulle b2"></div>
<div class="bulle b3"></div>
<div class="bulle b4"></div>

<main class="wrap">

  <div class="tete">
    <span class="etq etq-sem">Semaine 1</span>
    <span class="etq etq-sea">S&eacute;ance 3</span>
    <span class="etq etq-rit">Rituel</span>
  </div>

  <h1>Conversions de dur&eacute;es</h1>

  <section class="bloc">
    <span class="onglet">Grandeurs et mesures</span>

    <p class="consigne-intro">Compl&egrave;te les conversions suivantes&nbsp;:</p>

    <div class="item">
      <p class="q">a.&nbsp;3&nbsp;h&nbsp;45&nbsp;min&nbsp;=
        <span class="champ"><input type="text" id="in-a" inputmode="decimal" autocomplete="off" aria-label="Nombre de minutes"></span>
        min</p>
      <div class="actions">
        <button type="button" data-ok="a">OK</button>
        <button type="button" class="sec" data-aide="a">Indice</button>
      </div>
      <div class="feedback" id="fb-a" hidden></div>
      <div class="aide" id="ai-a" hidden></div>
    </div>

    <div class="item">
      <p class="q">b.&nbsp;2500&nbsp;sec&nbsp;=
        <span class="champ"><input type="text" id="in-b1" inputmode="decimal" autocomplete="off" aria-label="Nombre de minutes"></span>
        min
        <span class="champ"><input type="text" id="in-b2" inputmode="decimal" autocomplete="off" aria-label="Nombre de secondes"></span>
        sec</p>
      <div class="actions">
        <button type="button" data-ok="b">OK</button>
        <button type="button" class="sec" data-aide="b">Indice</button>
      </div>
      <div class="feedback" id="fb-b" hidden></div>
      <div class="aide" id="ai-b" hidden></div>
    </div>

  </section>

  <div class="barre">
    <button type="button" id="btn-tout">V&eacute;rifier tout</button>
    <button type="button" class="sec" id="btn-corr">Voir la correction</button>
    <button type="button" class="sec" id="btn-reset">R&eacute;initialiser</button>
  </div>

  <div class="correction" id="correction" hidden></div>
  <div class="bilan" id="bilan" hidden></div>

</main>

<script>
(function(){
  "use strict";

  function esc(txt){
    var d = document.createElement("div");
    d.textContent = String(txt);
    return d.innerHTML;
  }
  function normalise(brut){
    var s = String(brut).replace(/[\s\u00a0\u202f\u2009]/g, "");
    s = s.replace(/[\u2212\u2013\u2014]/g, "-").replace(/,/g, ".");
    if (s === "") return null;
    if (!/^-?(\d+(\.\d*)?|\.\d+)$/.test(s)) return null;
    return s;
  }

  var etats = {};
  var occupe = false;

  function afficher(id, type, html){
    var fb = document.getElementById("fb-" + id);
    fb.className = "feedback " + type;
    fb.innerHTML = html;
    fb.hidden = false;
  }
  function marquer(input, etat){
    if (!input) return;
    input.classList.remove("correct","partiel","incorrect");
    if (etat === "correct" || etat === "partiel" || etat === "incorrect") input.classList.add(etat);
  }

  // ---------- a : 3h45min = 225 min ----------
  function verifierA(){
    var input = document.getElementById("in-a");
    var brut = input.value;
    if (String(brut).replace(/[\s\u00a0]/g,"") === ""){
      etats.a = "vide"; marquer(input, "");
      afficher("a", "warn", "\u26a0\ufe0f Aucune r\u00e9ponse saisie. Convertis les heures en minutes, puis ajoute les 45&nbsp;min.");
      return;
    }
    var norm = normalise(brut);
    if (norm === null){
      etats.a = "incorrect"; marquer(input, "incorrect");
      afficher("a", "warn", "\u26a0\ufe0f Saisie non reconnue&nbsp;: &laquo;&nbsp;" + esc(brut) + "&nbsp;&raquo;.");
      return;
    }
    var val = Number(norm);
    if (val === 225){
      etats.a = "correct"; marquer(input, "correct");
      afficher("a", "ok", "\u2705 Bravo&nbsp;! 3&nbsp;h&nbsp;=&nbsp;180&nbsp;min, donc 3&nbsp;h&nbsp;45&nbsp;min&nbsp;=&nbsp;180&nbsp;+&nbsp;45&nbsp;=&nbsp;<strong>225&nbsp;min</strong>.");
      return;
    }
    etats.a = "incorrect"; marquer(input, "incorrect");
    afficher("a", "ko", "\u274c Ce n\u2019est pas la bonne valeur.<br>R\u00e9ponse attendue&nbsp;: 3&nbsp;h&nbsp;=&nbsp;180&nbsp;min, donc 3&nbsp;h&nbsp;45&nbsp;min&nbsp;=&nbsp;<strong>225&nbsp;min</strong>.");
  }

  // ---------- b : 2500 sec = 41 min 40 sec ----------
  function verifierB(){
    var input1 = document.getElementById("in-b1");
    var input2 = document.getElementById("in-b2");
    var brut1 = input1.value, brut2 = input2.value;

    if (String(brut1).replace(/[\s\u00a0]/g,"") === "" && String(brut2).replace(/[\s\u00a0]/g,"") === ""){
      etats.b = "vide"; marquer(input1, ""); marquer(input2, "");
      afficher("b", "warn", "\u26a0\ufe0f Aucune r\u00e9ponse saisie. Combien de fois 60&nbsp;sec (1&nbsp;min) tiennent dans 2500&nbsp;sec&nbsp;? Que reste-t-il&nbsp;?");
      return;
    }

    var norm1 = normalise(brut1);
    var norm2 = normalise(brut2);
    var minOk = (norm1 !== null && Number(norm1) === 41);
    var secOk = (norm2 !== null && Number(norm2) === 40);

    marquer(input1, minOk ? "correct" : (norm1 === null ? "" : "incorrect"));
    marquer(input2, secOk ? "correct" : (norm2 === null ? "" : "incorrect"));

    if (minOk && secOk){
      etats.b = "correct";
      afficher("b", "ok", "\u2705 Bravo&nbsp;! 2500&nbsp;/&nbsp;60&nbsp;=&nbsp;41 reste 40, donc 2500&nbsp;sec&nbsp;=&nbsp;<strong>41&nbsp;min&nbsp;40&nbsp;sec</strong>.");
      return;
    }
    if (minOk || secOk){
      etats.b = "partiel";
      afficher("b", "warn", "\u26a0\ufe0f Une des deux valeurs est correcte, mais pas l\u2019autre.<br>R\u00e9ponse attendue&nbsp;: <strong><u>41&nbsp;min&nbsp;40&nbsp;sec</u></strong>.");
      return;
    }
    etats.b = "incorrect";
    afficher("b", "ko", "\u274c Ce n\u2019est pas la bonne r\u00e9ponse.<br>R\u00e9ponse attendue&nbsp;: 2500&nbsp;/&nbsp;60&nbsp;=&nbsp;41 reste 40, donc <strong><u>41&nbsp;min&nbsp;40&nbsp;sec</u></strong>.");
  }

  function basculerAide(id){
    var box = document.getElementById("ai-" + id);
    if (!box) return;
    var texte = (id === "a")
      ? "1&nbsp;h&nbsp;=&nbsp;60&nbsp;min. Convertis d\u2019abord les 3&nbsp;h en minutes, puis ajoute les 45&nbsp;min."
      : "1&nbsp;min&nbsp;=&nbsp;60&nbsp;sec. Cherche combien de fois 60 est contenu dans 2500 (c\u2019est le nombre de minutes), le reste donne les secondes.";
    if (box.hidden){
      box.innerHTML = "\ud83d\udca1 <strong>Indice&nbsp;:</strong> " + texte;
      box.hidden = false;
    } else {
      box.hidden = true;
    }
  }

  function palier(pct){
    if (pct >= 90) return "\ud83d\udfe2 Excellent";
    if (pct >= 75) return "\ud83d\udfe2 Tr\u00e8s bien";
    if (pct >= 60) return "\ud83d\udfe1 Ma\u00eetrise satisfaisante";
    if (pct >= 40) return "\ud83d\udfe0 Ma\u00eetrise fragile";
    return "\ud83d\udd34 Ma\u00eetrise insuffisante";
  }

  function verifierTout(){
    if (occupe) return;
    occupe = true;
    window.setTimeout(function(){ occupe = false; }, 350);

    verifierA();
    verifierB();

    var total = 2;
    var score = 0;
    var recap = "";
    if (etats.a === "correct"){ score++; recap += '<span class="r-ok">\u2714 a</span>'; }
    else { recap += '<span class="r-ko">\u2718 a</span>'; }
    if (etats.b === "correct"){ score++; recap += '<span class="r-ok">\u2714 b</span>'; }
    else if (etats.b === "partiel"){ recap += '<span class="r-mid">\u25d0 b</span>'; }
    else { recap += '<span class="r-ko">\u2718 b</span>'; }

    var pct = Math.round((score / total) * 100);
    var bilan = document.getElementById("bilan");
    bilan.innerHTML =
      '<div class="score">Score&nbsp;: ' + score + '\u2009/\u2009' + total + ' (' + pct + '&nbsp;%)</div>' +
      '<div class="palier">' + palier(pct) + '</div>' +
      '<div class="recap">' + recap + '</div>' +
      '<div class="legende">\u2714 correct &nbsp;\u2022&nbsp; \u25d0 partiel (une des deux valeurs de b correcte) &nbsp;\u2022&nbsp; \u2718 incorrect ou non r\u00e9pondu.</div>';
    bilan.hidden = false;
  }

  function basculerCorrection(){
    var box = document.getElementById("correction");
    var btn = document.getElementById("btn-corr");
    if (box.hidden){
      var html = "<h2>Correction</h2><ul>" +
        "<li><strong>a.</strong> 3&nbsp;h&nbsp;=&nbsp;180&nbsp;min, donc 3&nbsp;h&nbsp;45&nbsp;min&nbsp;=&nbsp;180&nbsp;+&nbsp;45&nbsp;=&nbsp;<strong>225&nbsp;min</strong>.</li>" +
        "<li><strong>b.</strong> 2500&nbsp;/&nbsp;60&nbsp;=&nbsp;41 reste 40, donc 2500&nbsp;sec&nbsp;=&nbsp;<strong>41&nbsp;min&nbsp;40&nbsp;sec</strong>.</li>" +
        "</ul>";
      box.innerHTML = html;
      box.hidden = false;
      btn.textContent = "Masquer la correction";
    } else {
      box.hidden = true;
      btn.textContent = "Voir la correction";
    }
  }

  function reinitialiser(){
    var champsIds = ["a","b1","b2"];
    for (var i=0;i<champsIds.length;i++){
      var input = document.getElementById("in-" + champsIds[i]);
      input.value = ""; input.disabled=false; input.readOnly=false;
      input.classList.remove("correct","partiel","incorrect");
    }
    var fbA = document.getElementById("fb-a");
    fbA.hidden = true; fbA.innerHTML = ""; fbA.className = "feedback";
    var aiA = document.getElementById("ai-a");
    aiA.hidden = true; aiA.innerHTML = "";
    var fbB = document.getElementById("fb-b");
    fbB.hidden = true; fbB.innerHTML = ""; fbB.className = "feedback";
    var aiB = document.getElementById("ai-b");
    aiB.hidden = true; aiB.innerHTML = "";
    etats.a = "vide"; etats.b = "vide";

    var bilan = document.getElementById("bilan");
    bilan.hidden = true; bilan.innerHTML = "";
    var corr = document.getElementById("correction");
    corr.hidden = true; corr.innerHTML = "";
    document.getElementById("btn-corr").textContent = "Voir la correction";
    occupe = false;
  }

  function init(){
    etats.a = "vide"; etats.b = "vide";

    document.querySelector('[data-ok="a"]').addEventListener("click", verifierA);
    document.querySelector('[data-aide="a"]').addEventListener("click", function(){ basculerAide("a"); });
    document.querySelector('[data-ok="b"]').addEventListener("click", verifierB);
    document.querySelector('[data-aide="b"]').addEventListener("click", function(){ basculerAide("b"); });

    var champs = document.querySelectorAll('input[type="text"]');
    for (var c=0;c<champs.length;c++){
      champs[c].addEventListener("keydown", function(ev){
        if (ev.key === "Enter"){
          ev.preventDefault();
          var id = this.id.replace("in-","");
          if (id === "a") verifierA();
          else verifierB();
        }
      });
    }

    document.getElementById("btn-tout").addEventListener("click", verifierTout);
    document.getElementById("btn-corr").addEventListener("click", basculerCorrection);
    document.getElementById("btn-reset").addEventListener("click", reinitialiser);
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
