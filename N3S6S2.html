<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rituel &mdash; Semaine 6 S&eacute;ance 2 &mdash; Multiplier des fractions relatives</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#fffdf7;
  font-family:Arial,Helvetica,sans-serif;
  color:#243238;
  line-height:1.6;
  padding:14px;
  overflow-x:hidden;
}
.bulle{position:fixed;border-radius:50%;background:#3ba5b8;opacity:.12;pointer-events:none;z-index:0}
.b1{width:190px;height:190px;top:-70px;left:-70px}
.b2{width:130px;height:130px;top:-45px;right:-45px}
.b3{width:160px;height:160px;bottom:-60px;left:-55px}
.b4{width:110px;height:110px;bottom:-40px;right:-35px}

.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto}

.tete{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.etq{display:inline-block;padding:7px 16px;border-radius:8px;color:#fff;font-weight:700;font-size:.95rem;letter-spacing:.02em}
.etq-sem{background:#8fd3e8;color:#123f4a}
.etq-sea{background:#3ba5b8}
.etq-rit{background:#1f7a8c;font-family:Georgia,"Times New Roman",serif;font-style:normal;margin-left:auto}

h1{
  font-size:clamp(1.3rem,4.5vw,2rem);
  font-weight:900;
  color:#1f7a8c;
  margin:6px 0 18px;
  line-height:1.3;
}

.bloc{
  position:relative;
  border:2px solid #3ba5b8;
  border-radius:12px;
  background:#fff;
  padding:26px 18px 20px;
  margin-bottom:18px;
}
.onglet{
  position:absolute;top:-17px;left:18px;
  background:#8fd3e8;color:#123f4a;
  font-weight:700;font-size:.95rem;
  padding:5px 18px;border-radius:8px;
}
.tete-ex{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;min-width:0}
.pastille{
  flex:0 0 auto;
  width:34px;height:34px;border-radius:50%;
  background:#1f7a8c;color:#fff;
  font-weight:700;font-size:1rem;
  display:flex;align-items:center;justify-content:center;
}
.consigne{
  margin:4px 0 0;
  font-weight:700;text-decoration:underline;
  color:#1f7a8c;
  font-size:clamp(.95rem,2.6vw,1.05rem);
  min-width:0;overflow-wrap:break-word;
}

.item{padding:12px 0;border-bottom:1px dashed #dceff3}
.item:last-of-type{border-bottom:0}
.ligne{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-width:0}
.lettre{flex:0 0 auto;font-weight:700;color:#1f7a8c;width:22px}
.expr{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  min-width:0;
  font-size:clamp(1rem,3vw,1.15rem);font-weight:700;
}
.frac{
  display:inline-flex;flex-direction:column;align-items:center;
  vertical-align:middle;line-height:1.15;
}
.frac .num,.frac .den{display:block;padding:0 6px}
.frac .num{border-bottom:2px solid #243238;padding-bottom:2px}
.frac .den{padding-top:2px}
.signe{color:#243238;font-weight:700}
input[type="text"]{
  width:clamp(96px,28vw,150px);
  min-width:0;
  padding:9px 8px;
  font-family:Arial,Helvetica,sans-serif;
  font-size:1rem;font-weight:700;
  text-align:center;
  color:#1f7a8c;
  background:#f7fcfd;
  border:1px solid #b9dfe8;
  border-bottom:2px dotted #3ba5b8;
  border-radius:6px;
}
input[type="text"]:focus{outline:2px solid #3ba5b8;outline-offset:1px}
input.correct{border-color:#2e8b57;background:#effaf3;color:#2e8b57}
input.partiel{border-color:#c9820a;background:#fff8ea;color:#a86c06}
input.incorrect{border-color:#c0392b;background:#fdefee;color:#c0392b}

.actions{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
button{
  font-family:inherit;font-size:.92rem;font-weight:700;
  min-height:44px;padding:10px 16px;
  border:0;border-radius:8px;cursor:pointer;
  background:#3ba5b8;color:#fff;
  line-height:1.2;
}
button:hover{background:#1f7a8c}
button.sec{background:#fff;color:#1f7a8c;border:2px solid #3ba5b8}
button.sec:hover{background:#eaf7fa;color:#1f7a8c}

.feedback{
  margin:10px 0 0;
  padding:12px 14px;
  border-left:5px solid #3ba5b8;
  border-radius:6px;
  background:#f4fafb;
  font-size:clamp(.9rem,2.5vw,1rem);
  line-height:1.75;
  font-style:normal;
  overflow-wrap:break-word;
}
.feedback.ok{border-left-color:#2e8b57;background:#effaf3;color:#1e6b40}
.feedback.ko{border-left-color:#c0392b;background:#fdefee;color:#96291d}
.feedback.warn{border-left-color:#c9820a;background:#fff8ea;color:#8a5b04}
.aide{
  margin:10px 0 0;padding:12px 14px;
  border-left:5px solid #8fd3e8;background:#f2fafd;border-radius:6px;
  font-size:clamp(.9rem,2.5vw,1rem);line-height:1.75;
}

.barre{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.barre button{flex:1 1 190px}

.correction{
  border:2px dashed #3ba5b8;border-radius:12px;background:#fff;
  padding:16px 18px;margin-bottom:18px;
  font-size:clamp(.9rem,2.5vw,1rem);line-height:1.8;
}
.correction h2{margin:0 0 8px;font-size:1.05rem;color:#1f7a8c}
.correction h3{margin:14px 0 4px;font-size:.98rem;color:#1f7a8c}
.correction ul{margin:6px 0 0;padding-left:20px}
.correction li{margin-bottom:4px}

.bilan{
  border:2px solid #1f7a8c;border-radius:12px;background:#fff;
  padding:16px 18px;margin-bottom:18px;
  font-size:.92rem;line-height:1.8;
}
.bilan .score{font-size:clamp(1.05rem,3.2vw,1.25rem);font-weight:900;color:#1f7a8c}
.bilan .palier{font-weight:700;margin-top:4px}
.recap{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.recap span{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:8px;background:#f4fafb;
  font-weight:700;font-size:.9rem;border:1px solid #dceff3;
}
.recap .r-ok{color:#2e8b57}
.recap .r-mid{color:#c9820a}
.recap .r-ko{color:#c0392b}
.legende{margin-top:10px;font-size:.85rem;color:#4d6169}

@media (max-width:768px){
  .actions{margin-left:0;width:100%}
  .actions button{flex:1 1 auto}
}
@media (max-width:480px){
  body{padding:10px}
  .bloc{padding:24px 12px 16px}
  .etq{font-size:.85rem;padding:6px 12px}
  .etq-rit{margin-left:0}
  .expr{width:100%}
  input[type="text"]{width:100%;max-width:180px}
  .recap span{font-size:.85rem}
}
</style>
</head>
<body>
<div class="bulle b1"></div>
<div class="bulle b2"></div>
<div class="bulle b3"></div>
<div class="bulle b4"></div>

<main class="wrap">

  <div class="tete">
    <span class="etq etq-sem">Semaine 6</span>
    <span class="etq etq-sea">S&eacute;ance 2</span>
    <span class="etq etq-rit">Rituel</span>
  </div>

  <h1>Multiplier des fractions relatives</h1>

  <section class="bloc">
    <span class="onglet">Alg&egrave;bre</span>

    <div class="tete-ex">
      <span class="pastille">1</span>
      <p class="consigne">Calcule chaque produit et donne le r&eacute;sultat sous la forme d&rsquo;une fraction irr&eacute;ductible&nbsp;:</p>
    </div>

    <div class="item">
      <div class="ligne">
        <span class="lettre">a.</span>
        <span class="expr">
          <span class="frac"><span class="num">5</span><span class="den">&minus;3</span></span>
          <span class="signe">&times;</span>
          <span class="frac"><span class="num">&minus;4</span><span class="den">7</span></span>
          <span class="signe">=</span>
          <input type="text" id="in-a" inputmode="text" autocomplete="off" placeholder="ex&nbsp;: 3/4" aria-label="R&eacute;sultat du produit a, sous la forme d&rsquo;une fraction">
        </span>
        <span class="actions">
          <button type="button" data-ok="a">OK</button>
          <button type="button" class="sec" data-aide="a">Indice</button>
        </span>
      </div>
      <div class="feedback" id="fb-a" hidden></div>
      <div class="aide" id="ai-a" hidden></div>
    </div>

    <div class="item">
      <div class="ligne">
        <span class="lettre">b.</span>
        <span class="expr">
          <span class="frac"><span class="num">12</span><span class="den">&minus;5</span></span>
          <span class="signe">&times;</span>
          <span class="frac"><span class="num">&minus;4</span><span class="den">&minus;3</span></span>
          <span class="signe">=</span>
          <input type="text" id="in-b" inputmode="text" autocomplete="off" placeholder="ex&nbsp;: 3/4" aria-label="R&eacute;sultat du produit b, sous la forme d&rsquo;une fraction">
        </span>
        <span class="actions">
          <button type="button" data-ok="b">OK</button>
          <button type="button" class="sec" data-aide="b">Indice</button>
        </span>
      </div>
      <div class="feedback" id="fb-b" hidden></div>
      <div class="aide" id="ai-b" hidden></div>
    </div>
  </section>

  <div class="barre">
    <button type="button" id="btn-tout">V&eacute;rifier tout</button>
    <button type="button" class="sec" id="btn-corr">Voir la correction</button>
    <button type="button" class="sec" id="btn-reset">R&eacute;initialiser</button>
  </div>

  <div class="correction" id="correction" hidden></div>

  <div class="bilan" id="bilan" hidden></div>

</main>

<script>
(function(){
  "use strict";

  var ITEMS = [
    { id:"a", n1:5, d1:-3, n2:-4, d2:7,
      targetNum:20, targetDen:21,
      aide:"Multiplie les num\u00e9rateurs entre eux, puis les d\u00e9nominateurs entre eux. Compte les signes \u2212 : deux facteurs n\u00e9gatifs donnent un produit positif." },
    { id:"b", n1:12, d1:-5, n2:-4, d2:-3,
      targetNum:-16, targetDen:5,
      aide:"Multiplie les num\u00e9rateurs entre eux, puis les d\u00e9nominateurs entre eux, puis simplifie&nbsp;: cherche un diviseur commun (un multiple de 3)." }
  ];

  var etats = {};
  var occupe = false;

  function trouver(id){
    for (var i = 0; i < ITEMS.length; i++){ if (ITEMS[i].id === id) return ITEMS[i]; }
    return null;
  }

  function esc(txt){
    var d = document.createElement("div");
    d.textContent = String(txt);
    return d.innerHTML;
  }

  function gcd(a, b){
    a = Math.abs(a); b = Math.abs(b);
    while (b){ var t = b; b = a % b; a = t; }
    return a;
  }

  function parseFraction(brut){
    var s = String(brut);
    s = s.replace(/[\s\u00a0\u202f\u2009]/g, "");
    s = s.replace(/[\u2212\u2013\u2014]/g, "-");
    if (s === "") return null;
    var m = s.match(/^(-?\d+)\/(-?\d+)$/);
    if (!m) return null;
    var num = parseInt(m[1], 10);
    var den = parseInt(m[2], 10);
    if (den === 0) return null;
    return { num:num, den:den };
  }

  function afficherFrac(num, den){
    return esc(String(num)) + "/" + esc(String(den));
  }

  function afficher(id, type, html){
    var fb = document.getElementById("fb-" + id);
    fb.className = "feedback " + type;
    fb.innerHTML = html;
    fb.hidden = false;
  }

  function verifier(id){
    var it = trouver(id);
    if (!it) return;
    var input = document.getElementById("in-" + id);
    var brut = input.value;
    input.classList.remove("correct", "partiel", "incorrect");
    var cible = "<strong><u>" + afficherFrac(it.targetNum, it.targetDen) + "</u></strong>";

    if (brut.replace(/[\s\u00a0]/g, "") === ""){
      etats[id] = "vide";
      afficher(id, "warn", "\u26a0\ufe0f Aucune r\u00e9ponse saisie. \u00c9cris le r\u00e9sultat sous la forme d\u2019une fraction, par exemple <strong>3/4</strong>, puis clique sur <strong>OK</strong>.");
      return;
    }

    var f = parseFraction(brut);
    if (f === null){
      etats[id] = "incorrect";
      input.classList.add("incorrect");
      afficher(id, "warn", "\u26a0\ufe0f Saisie non reconnue&nbsp;: &laquo;&nbsp;" + esc(brut) + "&nbsp;&raquo;. \u00c9cris ta r\u00e9ponse sous la forme <strong>num\u00e9rateur/d\u00e9nominateur</strong>, par exemple <strong>3/4</strong> ou <strong>-3/4</strong>.");
      return;
    }

    var egal = (f.num * it.targetDen) === (it.targetNum * f.den);

    if (!egal){
      etats[id] = "incorrect";
      input.classList.add("incorrect");
      afficher(id, "ko", "\u274c <strong><u>" + afficherFrac(f.num, f.den) + "</u></strong> n\u2019est pas le bon r\u00e9sultat. V\u00e9rifie le produit des num\u00e9rateurs, le produit des d\u00e9nominateurs, et la r\u00e8gle des signes. R\u00e9ponse attendue&nbsp;: " + cible + ".");
      return;
    }

    var reduit = gcd(f.num, f.den) === 1;
    if (reduit){
      etats[id] = "correct";
      input.classList.add("correct");
      afficher(id, "ok", "\u2705 Bravo&nbsp;! <strong><u>" + afficherFrac(f.num, f.den) + "</u></strong> est le bon r\u00e9sultat, d\u00e9j\u00e0 sous forme irr\u00e9ductible.");
      return;
    }

    etats[id] = "partiel";
    input.classList.add("partiel");
    afficher(id, "warn", "\u26a0\ufe0f La valeur de <strong><u>" + afficherFrac(f.num, f.den) + "</u></strong> est exacte, mais la fraction n\u2019est <strong>pas simplifi\u00e9e</strong>. Cherche le plus grand diviseur commun du num\u00e9rateur et du d\u00e9nominateur. R\u00e9ponse attendue&nbsp;: " + cible + ".");
  }

  function basculerAide(id){
    var it = trouver(id);
    var box = document.getElementById("ai-" + id);
    if (!it || !box) return;
    if (box.hidden){
      box.innerHTML = "\ud83d\udca1 <strong>Indice&nbsp;:</strong> " + it.aide;
      box.hidden = false;
    } else {
      box.hidden = true;
    }
  }

  function palier(pct){
    if (pct >= 90) return "\ud83d\udfe2 Excellent";
    if (pct >= 75) return "\ud83d\udfe2 Tr\u00e8s bien";
    if (pct >= 60) return "\ud83d\udfe1 Ma\u00eetrise satisfaisante";
    if (pct >= 40) return "\ud83d\udfe0 Ma\u00eetrise fragile";
    return "\ud83d\udd34 Ma\u00eetrise insuffisante";
  }

  function verifierTout(){
    if (occupe) return;
    occupe = true;
    window.setTimeout(function(){ occupe = false; }, 350);

    var total = ITEMS.length;
    var score = 0;
    var recap = "";

    for (var i = 0; i < ITEMS.length; i++){
      var id = ITEMS[i].id;
      verifier(id);
      var e = etats[id];
      if (e === "correct"){
        score++;
        recap += '<span class="r-ok">\u2714 ' + id + '</span>';
      } else if (e === "partiel"){
        recap += '<span class="r-mid">\u25d0 ' + id + '</span>';
      } else {
        recap += '<span class="r-ko">\u2718 ' + id + '</span>';
      }
    }

    if (score < 0) score = 0;
    if (score > total) score = total;
    var pct = Math.round((score / total) * 100);

    var bilan = document.getElementById("bilan");
    bilan.innerHTML =
      '<div class="score">Score&nbsp;: ' + score + '\u2009/\u2009' + total + ' (' + pct + '&nbsp;%)</div>' +
      '<div class="palier">' + palier(pct) + '</div>' +
      '<div class="recap">' + recap + '</div>' +
      '<div class="legende">\u2714 correct &nbsp;\u2022&nbsp; \u25d0 partiel (valeur exacte, fraction non simplifi\u00e9e) &nbsp;\u2022&nbsp; \u2718 incorrect ou non r\u00e9pondu.</div>';
    bilan.hidden = false;
  }

  function basculerCorrection(){
    var box = document.getElementById("correction");
    var btn = document.getElementById("btn-corr");
    if (box.hidden){
      box.innerHTML =
        "<h2>Correction</h2>" +
        "<p><strong>M\u00e9thode&nbsp;:</strong> on multiplie les num\u00e9rateurs entre eux et les d\u00e9nominateurs entre eux, en appliquant la <strong><u>r\u00e8gle des signes</u></strong>, puis on simplifie le r\u00e9sultat en le divisant par son <strong><u>PGCD</u></strong>.</p>" +
        "<h3>a. 5/&minus;3 &times; &minus;4/7</h3>" +
        "<p>Num\u00e9rateurs&nbsp;: 5 &times; (&minus;4) = &minus;20.<br>" +
        "D\u00e9nominateurs&nbsp;: (&minus;3) &times; 7 = &minus;21.<br>" +
        "&minus;20/&minus;21 = <strong><u>20/21</u></strong> (deux signes &minus; donnent un r\u00e9sultat positif).<br>" +
        "PGCD(20, 21) = 1&nbsp;: la fraction est d\u00e9j\u00e0 irr\u00e9ductible.</p>" +
        "<h3>b. 12/&minus;5 &times; &minus;4/&minus;3</h3>" +
        "<p>Num\u00e9rateurs&nbsp;: 12 &times; (&minus;4) = &minus;48.<br>" +
        "D\u00e9nominateurs&nbsp;: (&minus;5) &times; (&minus;3) = 15.<br>" +
        "R\u00e9sultat brut&nbsp;: &minus;48/15.<br>" +
        "PGCD(48, 15) = 3&nbsp;: on divise le num\u00e9rateur et le d\u00e9nominateur par 3, soit <strong><u>&minus;16/5</u></strong>.</p>";
      box.hidden = false;
      btn.textContent = "Masquer la correction";
    } else {
      box.hidden = true;
      btn.textContent = "Voir la correction";
    }
  }

  function reinitialiser(){
    for (var i = 0; i < ITEMS.length; i++){
      var id = ITEMS[i].id;
      var input = document.getElementById("in-" + id);
      input.value = "";
      input.disabled = false;
      input.readOnly = false;
      input.classList.remove("correct", "partiel", "incorrect");
      var fb = document.getElementById("fb-" + id);
      fb.hidden = true;
      fb.innerHTML = "";
      fb.className = "feedback";
      var ai = document.getElementById("ai-" + id);
      ai.hidden = true;
      ai.innerHTML = "";
      etats[id] = "vide";
    }
    var bilan = document.getElementById("bilan");
    bilan.hidden = true;
    bilan.innerHTML = "";
    var corr = document.getElementById("correction");
    corr.hidden = true;
    corr.innerHTML = "";
    document.getElementById("btn-corr").textContent = "Voir la correction";
    occupe = false;
  }

  function init(){
    for (var i = 0; i < ITEMS.length; i++){ etats[ITEMS[i].id] = "vide"; }

    var boutonsOk = document.querySelectorAll("[data-ok]");
    for (var j = 0; j < boutonsOk.length; j++){
      boutonsOk[j].addEventListener("click", function(){
        verifier(this.getAttribute("data-ok"));
      });
    }

    var boutonsAide = document.querySelectorAll("[data-aide]");
    for (var k = 0; k < boutonsAide.length; k++){
      boutonsAide[k].addEventListener("click", function(){
        basculerAide(this.getAttribute("data-aide"));
      });
    }

    var champs = document.querySelectorAll('input[type="text"]');
    for (var m = 0; m < champs.length; m++){
      champs[m].addEventListener("keydown", function(ev){
        if (ev.key === "Enter"){
          ev.preventDefault();
          verifier(this.id.replace("in-", ""));
        }
      });
    }

    document.getElementById("btn-tout").addEventListener("click", verifierTout);
    document.getElementById("btn-corr").addEventListener("click", basculerCorrection);
    document.getElementById("btn-reset").addEventListener("click", reinitialiser);
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
