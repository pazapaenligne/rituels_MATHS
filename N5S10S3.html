<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#fffdf7;font-family:Arial,Helvetica,sans-serif;color:#243238;line-height:1.6;padding:14px;overflow-x:hidden}
.bulle{position:fixed;border-radius:50%;background:#3ba5b8;opacity:.12;pointer-events:none;z-index:0}
.b1{width:190px;height:190px;top:-70px;left:-70px}
.b2{width:130px;height:130px;top:-45px;right:-45px}
.b3{width:160px;height:160px;bottom:-60px;left:-55px}
.b4{width:110px;height:110px;bottom:-40px;right:-35px}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto}
.tete{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.etq{display:inline-block;padding:7px 16px;border-radius:8px;color:#fff;font-weight:700;font-size:.95rem}
.etq-sem{background:#8fd3e8;color:#123f4a}
.etq-sea{background:#3ba5b8}
.etq-rit{background:#1f7a8c;font-family:Georgia,"Times New Roman",serif;margin-left:auto}
h1{font-size:clamp(1.15rem,4vw,1.7rem);font-weight:900;color:#1f7a8c;margin:6px 0 18px;line-height:1.3}
.bloc{position:relative;border:2px solid #3ba5b8;border-radius:12px;background:#fff;padding:28px 18px 20px;margin-bottom:18px}
.onglet{position:absolute;top:-17px;left:18px;background:#8fd3e8;color:#123f4a;font-weight:700;font-size:.95rem;padding:5px 18px;border-radius:8px}
.consigne{margin:4px 0 18px;font-weight:700;text-decoration:underline;color:#1f7a8c;font-size:clamp(.92rem,2.4vw,1rem);min-width:0;overflow-wrap:break-word;line-height:1.7}

.grille{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:16px}
@media (min-width:640px){.grille{grid-template-columns:repeat(4,1fr)}}
.case{
  border:2px solid #dceff3;border-radius:10px;background:#f7fcfd;
  padding:10px;cursor:pointer;text-align:center;
  transition:border-color .15s,background .15s;position:relative;
}
.case:hover{border-color:#3ba5b8;background:#eaf7fa}
.case.sel{border-color:#1f7a8c;background:#eaf7fa}
.case.sel::after{
  content:"\2713";position:absolute;top:6px;right:8px;
  color:#1f7a8c;font-weight:900;font-size:1.2rem;
  background:#fff;border-radius:50%;width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.case.bonne-cochee{border-color:#2e8b57;background:#effaf3}
.case.bonne-cochee::after{content:"\2713";color:#2e8b57}
.case.mauvaise-cochee{border-color:#c0392b;background:#fdefee}
.case.mauvaise-cochee::after{content:"\2717";color:#c0392b}
.case.manquee{border-color:#c9820a;background:#fff8ea}
.case img{width:100%;height:auto;display:block;margin-bottom:6px;border-radius:6px}
.case .nom{font-weight:700;color:#243238;font-size:.92rem}

.actions{display:flex;flex-wrap:wrap;gap:8px}
button{font-family:inherit;font-size:.92rem;font-weight:700;min-height:44px;padding:10px 16px;border:0;border-radius:8px;cursor:pointer;background:#3ba5b8;color:#fff;line-height:1.2}
button:hover{background:#1f7a8c}
button.sec{background:#fff;color:#1f7a8c;border:2px solid #3ba5b8}
button.sec:hover{background:#eaf7fa}
.feedback{margin:14px 0 0;padding:12px 14px;border-left:5px solid #3ba5b8;border-radius:6px;background:#f4fafb;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.75;overflow-wrap:break-word}
.feedback.ok{border-left-color:#2e8b57;background:#effaf3;color:#1e6b40}
.feedback.ko{border-left-color:#c0392b;background:#fdefee;color:#96291d}
.feedback.warn{border-left-color:#c9820a;background:#fff8ea;color:#8a5b04}
.aide{margin:10px 0 0;padding:12px 14px;border-left:5px solid #8fd3e8;background:#f2fafd;border-radius:6px;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.75}

.barre{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.barre button{flex:1 1 190px}
.correction{border:2px dashed #3ba5b8;border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:18px;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.8}
.correction h2{margin:0 0 10px;font-size:1.05rem;color:#1f7a8c}
.bilan{border:2px solid #1f7a8c;border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:18px;font-size:.92rem;line-height:1.8}
.bilan .score{font-size:clamp(1.05rem,3.2vw,1.25rem);font-weight:900;color:#1f7a8c}
.bilan .palier{font-weight:700;margin-top:4px}
.legende{margin-top:10px;font-size:.85rem;color:#4d6169}
@media (max-width:480px){
  body{padding:10px}
  .bloc{padding:26px 12px 16px}
  .etq{font-size:.85rem;padding:6px 12px}
  .etq-rit{margin-left:0}
}
</style>

<script>
(function(){
  "use strict";

  var BONS_NOMS = ["hawa","lea"];
  var TOUS_NOMS = ["mariam","hawa","julie","lea"];

  var selection = {};
  var etatEx = "vide";
  var occupe = false;

  function palier(pct){
    if (pct >= 90) return "\ud83d\udfe2 Excellent";
    if (pct >= 75) return "\ud83d\udfe2 Tr\u00e8s bien";
    if (pct >= 60) return "\ud83d\udfe1 Ma\u00eetrise satisfaisante";
    if (pct >= 40) return "\ud83d\udfe0 Ma\u00eetrise fragile";
    return "\ud83d\udd34 Ma\u00eetrise insuffisante";
  }

  function afficherEx(type, html){
    var fb = document.getElementById("fb-ex");
    fb.className = "feedback " + type;
    fb.innerHTML = html;
    fb.hidden = false;
  }

  function basculerSelection(nom){
    var btn = document.querySelector('[data-nom="' + nom + '"]');
    if (!btn) return;
    selection[nom] = !selection[nom];
    btn.classList.remove("bonne-cochee","mauvaise-cochee","manquee");
    btn.classList.toggle("sel", !!selection[nom]);
  }

  function verifierExercice(){
    var vraisPositifs = 0, fauxPositifs = 0, manques = 0;

    for (var i = 0; i < TOUS_NOMS.length; i++){
      var nom = TOUS_NOMS[i];
      var btn = document.querySelector('[data-nom="' + nom + '"]');
      var estBon = BONS_NOMS.indexOf(nom) !== -1;
      var estCoche = !!selection[nom];
      btn.classList.remove("bonne-cochee","mauvaise-cochee","manquee");

      if (estBon && estCoche){ btn.classList.add("bonne-cochee"); vraisPositifs++; }
      else if (!estBon && estCoche){ btn.classList.add("mauvaise-cochee"); fauxPositifs++; }
      else if (estBon && !estCoche){ btn.classList.add("manquee"); manques++; }
    }

    if (vraisPositifs === 0 && fauxPositifs === 0){
      etatEx = "vide";
      afficherEx("warn", "\u26a0\ufe0f Aucun nom coch\u00e9. Clique sur les &eacute;l&egrave;ves qui ont bien plac&eacute; l&rsquo;&eacute;querre, puis clique sur <strong>V&eacute;rifier ce choix</strong>.");
      return;
    }

    if (vraisPositifs === 2 && fauxPositifs === 0){
      etatEx = "correct";
      afficherEx("ok", "\u2705 Bravo&nbsp;! <strong><u>Hawa</u></strong> et <strong><u>L&eacute;a</u></strong> ont bien plac&eacute; l&rsquo;&eacute;querre pour tracer la perpendiculaire.");
      return;
    }

    if (vraisPositifs > 0 && fauxPositifs === 0){
      etatEx = "partiel";
      afficherEx("warn", "\u26a0\ufe0f Tu as trouv&eacute; " + vraisPositifs + " bon nom sur 2, sans erreur. La case orange indique celui qu&rsquo;il te manque.");
      return;
    }

    if (vraisPositifs === 2 && fauxPositifs > 0){
      etatEx = "partiel";
      afficherEx("warn", "\u26a0\ufe0f Tu as bien trouv&eacute; les 2 bons noms, mais tu as aussi coch&eacute; " + fauxPositifs + " nom(s) qui ne convenai(en)t pas (en rouge).");
      return;
    }

    etatEx = "incorrect";
    afficherEx("ko", "\u274c Ce n&rsquo;est pas encore &ccedil;a. Les cases rouges sont coch&eacute;es &agrave; tort, les cases orange auraient d&ucirc; l&rsquo;&ecirc;tre. Observe bien l&rsquo;angle entre l&rsquo;&eacute;querre et la droite (d).");
  }

  function verifierTout(){
    if (occupe) return;
    occupe = true;
    window.setTimeout(function(){ occupe = false; }, 350);

    verifierExercice();

    var total = 1;
    var score = etatEx === "correct" ? 1 : 0;
    var pct = Math.round((score / total) * 100);
    var recap = etatEx === "correct" ? '<span style="color:#2e8b57;font-weight:700">\u2714 exercice</span>'
      : etatEx === "partiel" ? '<span style="color:#c9820a;font-weight:700">\u25d0 exercice</span>'
      : '<span style="color:#c0392b;font-weight:700">\u2718 exercice</span>';

    var bilan = document.getElementById("bilan");
    bilan.innerHTML =
      '<div class="score">Score&nbsp;: ' + score + '\u2009/\u20091 (' + pct + '&nbsp;%)</div>' +
      '<div class="palier">' + palier(pct) + '</div>' +
      '<div style="margin-top:10px">' + recap + '</div>' +
      '<div class="legende">L&rsquo;exercice de s&eacute;lection compte pour un seul item.</div>';
    bilan.hidden = false;
  }

  function basculerCorrection(){
    var box = document.getElementById("correction");
    var btn = document.getElementById("btn-corr");
    if (box.hidden){
      box.innerHTML =
        "<h2>Correction</h2>" +
        "<p><strong>Hawa</strong> et <strong>L&eacute;a</strong> ont plac&eacute; l&rsquo;&eacute;querre correctement&nbsp;: un des c&ocirc;t&eacute;s de l&rsquo;angle droit de l&rsquo;&eacute;querre est align&eacute; sur la droite (d), et l&rsquo;autre c&ocirc;t&eacute; passe exactement par le point A.</p>" +
        "<p>Chez <strong>Mariam</strong> et <strong>Julie</strong>, l&rsquo;&eacute;querre n&rsquo;est pas correctement align&eacute;e sur (d) ou ne passe pas par A&nbsp;: la droite trac&eacute;e ne serait pas perpendiculaire.</p>";
      box.hidden = false;
      btn.textContent = "Masquer la correction";
    } else {
      box.hidden = true;
      btn.textContent = "Voir la correction";
    }
  }

  function reinitialiser(){
    selection = {};
    for (var i = 0; i < TOUS_NOMS.length; i++){
      var btn = document.querySelector('[data-nom="' + TOUS_NOMS[i] + '"]');
      if (btn) btn.classList.remove("sel","bonne-cochee","mauvaise-cochee","manquee");
    }
    etatEx = "vide";
    var fb = document.getElementById("fb-ex");
    fb.hidden = true; fb.innerHTML = ""; fb.className = "feedback";
    var ai = document.getElementById("ai-ex");
    ai.hidden = true; ai.innerHTML = "";
    var bilan = document.getElementById("bilan");
    bilan.hidden = true; bilan.innerHTML = "";
    var corr = document.getElementById("correction");
    corr.hidden = true; corr.innerHTML = "";
    document.getElementById("btn-corr").textContent = "Voir la correction";
    occupe = false;
  }

  function init(){
    for (var i = 0; i < TOUS_NOMS.length; i++){
      (function(nom){
        var el = document.querySelector('[data-nom="' + nom + '"]');
        el.addEventListener("click", function(){ basculerSelection(nom); });
        el.addEventListener("keydown", function(ev){
          if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); basculerSelection(nom); }
        });
      })(TOUS_NOMS[i]);
    }
    document.getElementById("btn-verif-ex").addEventListener("click", verifierExercice);
    document.getElementById("btn-aide-ex").addEventListener("click", function(){
      var box = document.getElementById("ai-ex");
      if (box.hidden){
        box.innerHTML = "\ud83d\udca1 <strong>Indice&nbsp;:</strong> Une &eacute;querre bien plac&eacute;e a un c&ocirc;t&eacute; coll&eacute; sur (d) et l&rsquo;angle droit exactement sur le point A.";
        box.hidden = false;
      } else {
        box.hidden = true;
      }
    });
    document.getElementById("btn-tout").addEventListener("click", verifierTout);
    document.getElementById("btn-corr").addEventListener("click", basculerCorrection);
    document.getElementById("btn-reset").addEventListener("click", reinitialiser);
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
