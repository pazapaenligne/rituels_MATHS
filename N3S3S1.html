<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rituel &mdash; Semaine 3 S&eacute;ance 1 &mdash; Op&eacute;rations avec des relatifs</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#fffdf7;font-family:Arial,Helvetica,sans-serif;color:#243238;line-height:1.6;padding:14px;overflow-x:hidden}
.bulle{position:fixed;border-radius:50%;background:#3ba5b8;opacity:.12;pointer-events:none;z-index:0}
.b1{width:190px;height:190px;top:-70px;left:-70px}
.b2{width:130px;height:130px;top:-45px;right:-45px}
.b3{width:160px;height:160px;bottom:-60px;left:-55px}
.b4{width:110px;height:110px;bottom:-40px;right:-35px}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto}
.tete{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.etq{display:inline-block;padding:7px 16px;border-radius:8px;color:#fff;font-weight:700;font-size:.95rem}
.etq-sem{background:#8fd3e8;color:#123f4a}
.etq-sea{background:#3ba5b8}
.etq-rit{background:#1f7a8c;font-family:Georgia,"Times New Roman",serif;margin-left:auto}
h1{font-size:clamp(1.3rem,4.5vw,2rem);font-weight:900;color:#1f7a8c;margin:6px 0 18px;line-height:1.3}
.bloc{position:relative;border:2px solid #3ba5b8;border-radius:12px;background:#fff;padding:26px 18px 20px;margin-bottom:18px}
.onglet{position:absolute;top:-17px;left:18px;background:#8fd3e8;color:#123f4a;font-weight:700;font-size:.95rem;padding:5px 18px;border-radius:8px}
.consigne-intro{margin:4px 0 18px;font-weight:700;text-decoration:underline;color:#1f7a8c;font-size:clamp(.95rem,2.6vw,1.05rem);line-height:1.75}
.item{padding:12px 0 14px;border-bottom:1px dashed #dceff3}
.item:last-of-type{border-bottom:0}
.q{font-size:clamp(1.05rem,3vw,1.2rem);font-weight:700;margin:0 0 8px;color:#243238}
.ligne{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-width:0}
.champ{flex:0 0 auto}
input[type="text"]{
  width:150px;padding:9px 8px;font-family:Arial,Helvetica,sans-serif;font-size:1rem;font-weight:700;
  color:#1f7a8c;background:#f7fcfd;border:1px solid #b9dfe8;border-bottom:2px dotted #3ba5b8;
  border-radius:6px;text-align:center;min-height:44px;
}
input[type="text"]:focus{outline:2px solid #3ba5b8;outline-offset:1px}
.correct{border-color:#2e8b57;background:#effaf3;color:#1e6b40}
.incorrect{border-color:#c0392b;background:#fdefee;color:#96291d}
.actions{display:flex;flex-wrap:wrap;gap:8px}
button{font-family:inherit;font-size:.92rem;font-weight:700;min-height:44px;padding:10px 16px;border:0;border-radius:8px;cursor:pointer;background:#3ba5b8;color:#fff;line-height:1.2}
button:hover{background:#1f7a8c}
button.sec{background:#fff;color:#1f7a8c;border:2px solid #3ba5b8}
button.sec:hover{background:#eaf7fa}
.feedback{margin:10px 0 0;padding:12px 14px;border-left:5px solid #3ba5b8;border-radius:6px;background:#f4fafb;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.75;overflow-wrap:break-word}
.feedback.ok{border-left-color:#2e8b57;background:#effaf3;color:#1e6b40}
.feedback.ko{border-left-color:#c0392b;background:#fdefee;color:#96291d}
.feedback.warn{border-left-color:#c9820a;background:#fff8ea;color:#8a5b04}
.aide{margin:10px 0 0;padding:12px 14px;border-left:5px solid #8fd3e8;background:#f2fafd;border-radius:6px;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.75}
.barre{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.barre button{flex:1 1 190px}
.correction{border:2px dashed #3ba5b8;border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:18px;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.8}
.correction h2{margin:0 0 8px;font-size:1.05rem;color:#1f7a8c}
.correction ul{margin:6px 0;padding-left:20px}
.correction li{margin-bottom:6px}
.bilan{border:2px solid #1f7a8c;border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:18px;font-size:.92rem;line-height:1.8}
.bilan .score{font-size:clamp(1.05rem,3.2vw,1.25rem);font-weight:900;color:#1f7a8c}
.bilan .palier{font-weight:700;margin-top:4px}
.recap{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.recap span{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;background:#f4fafb;font-weight:700;font-size:.9rem;border:1px solid #dceff3}
.recap .r-ok{color:#2e8b57}
.recap .r-ko{color:#c0392b}
.legende{margin-top:10px;font-size:.85rem;color:#4d6169}
@media (max-width:480px){body{padding:10px}.bloc{padding:24px 12px 16px}.etq{font-size:.85rem;padding:6px 12px}.etq-rit{margin-left:0}input[type="text"]{width:100%}.recap span{font-size:.85rem}}
</style>
</head>
<body>
<div class="bulle b1"></div>
<div class="bulle b2"></div>
<div class="bulle b3"></div>
<div class="bulle b4"></div>

<main class="wrap">

  <div class="tete">
    <span class="etq etq-sem">Semaine 3</span>
    <span class="etq etq-sea">S&eacute;ance 1</span>
    <span class="etq etq-rit">Rituel</span>
  </div>

  <h1>Op&eacute;rations avec des nombres relatifs</h1>

  <section class="bloc">
    <span class="onglet">Calcul</span>

    <p class="consigne-intro">Pose les op&eacute;rations et calcule&nbsp;:</p>

    <div class="item">
      <p class="q">a.&nbsp;A&nbsp;=&nbsp;(&minus;7)&nbsp;+&nbsp;(&minus;18)&nbsp;=</p>
      <div class="ligne">
        <span class="champ"><input type="text" id="in-A" inputmode="decimal" autocomplete="off" aria-label="Valeur de A"></span>
        <span class="actions">
          <button type="button" data-ok="A">OK</button>
          <button type="button" class="sec" data-aide="A">Indice</button>
        </span>
      </div>
      <div class="feedback" id="fb-A" hidden></div>
      <div class="aide" id="ai-A" hidden></div>
    </div>

    <div class="item">
      <p class="q">b.&nbsp;B&nbsp;=&nbsp;&minus;12&nbsp;+&nbsp;(&minus;8)&nbsp;=</p>
      <div class="ligne">
        <span class="champ"><input type="text" id="in-B" inputmode="decimal" autocomplete="off" aria-label="Valeur de B"></span>
        <span class="actions">
          <button type="button" data-ok="B">OK</button>
          <button type="button" class="sec" data-aide="B">Indice</button>
        </span>
      </div>
      <div class="feedback" id="fb-B" hidden></div>
      <div class="aide" id="ai-B" hidden></div>
    </div>

    <div class="item">
      <p class="q">c.&nbsp;C&nbsp;=&nbsp;&minus;4&nbsp;&times;&nbsp;(&minus;8)&nbsp;=</p>
      <div class="ligne">
        <span class="champ"><input type="text" id="in-C" inputmode="decimal" autocomplete="off" aria-label="Valeur de C"></span>
        <span class="actions">
          <button type="button" data-ok="C">OK</button>
          <button type="button" class="sec" data-aide="C">Indice</button>
        </span>
      </div>
      <div class="feedback" id="fb-C" hidden></div>
      <div class="aide" id="ai-C" hidden></div>
    </div>

    <div class="item">
      <p class="q">d.&nbsp;D&nbsp;=&nbsp;12&nbsp;+&nbsp;5&nbsp;&times;&nbsp;(&minus;6)&nbsp;=</p>
      <div class="ligne">
        <span class="champ"><input type="text" id="in-D" inputmode="decimal" autocomplete="off" aria-label="Valeur de D"></span>
        <span class="actions">
          <button type="button" data-ok="D">OK</button>
          <button type="button" class="sec" data-aide="D">Indice</button>
        </span>
      </div>
      <div class="feedback" id="fb-D" hidden></div>
      <div class="aide" id="ai-D" hidden></div>
    </div>

  </section>

  <div class="barre">
    <button type="button" id="btn-tout">V&eacute;rifier tout</button>
    <button type="button" class="sec" id="btn-corr">Voir la correction</button>
    <button type="button" class="sec" id="btn-reset">R&eacute;initialiser</button>
  </div>

  <div class="correction" id="correction" hidden></div>
  <div class="bilan" id="bilan" hidden></div>

</main>

<script>
(function(){
  "use strict";

  function esc(txt){
    var d = document.createElement("div");
    d.textContent = String(txt);
    return d.innerHTML;
  }
  function normalise(brut){
    var s = String(brut).replace(/[\s\u00a0\u202f\u2009]/g, "");
    s = s.replace(/[\u2212\u2013\u2014]/g, "-").replace(/,/g, ".");
    if (s === "") return null;
    if (!/^-?(\d+(\.\d*)?|\.\d+)$/.test(s)) return null;
    return s;
  }

  var ITEMS = [
    { id:"A", val:-25,
       aide:"Deux nombres n\u00e9gatifs qui s\u2019additionnent&nbsp;: additionne leurs valeurs absolues et garde le signe n\u00e9gatif.",
       ref:"A&nbsp;=&nbsp;(&minus;7)&nbsp;+&nbsp;(&minus;18)&nbsp;=&nbsp;<strong>&minus;25</strong>." },
    { id:"B", val:-20,
       aide:"Deux nombres n\u00e9gatifs qui s\u2019additionnent&nbsp;: additionne leurs valeurs absolues et garde le signe n\u00e9gatif.",
       ref:"B&nbsp;=&nbsp;&minus;12&nbsp;+&nbsp;(&minus;8)&nbsp;=&nbsp;<strong>&minus;20</strong>." },
    { id:"C", val:32,
       aide:"Deux facteurs n\u00e9gatifs&nbsp;: le produit est positif. Calcule 4&nbsp;&times;&nbsp;8.",
       ref:"C&nbsp;=&nbsp;&minus;4&nbsp;&times;&nbsp;(&minus;8)&nbsp;=&nbsp;<strong>32</strong> (deux facteurs n\u00e9gatifs&nbsp;: produit positif)." },
    { id:"D", val:-18,
       aide:"Priorit\u00e9s op\u00e9ratoires&nbsp;: effectue d\u2019abord la multiplication (5&nbsp;&times;&nbsp;(&minus;6)), puis l\u2019addition avec 12.",
       ref:"D&nbsp;=&nbsp;12&nbsp;+&nbsp;5&nbsp;&times;&nbsp;(&minus;6)&nbsp;=&nbsp;12&nbsp;+&nbsp;(&minus;30)&nbsp;=&nbsp;<strong>&minus;18</strong> (on effectue la multiplication avant l&rsquo;addition)." }
  ];

  var etats = {};
  var occupe = false;

  function trouver(id){
    for (var i=0;i<ITEMS.length;i++){ if (ITEMS[i].id===id) return ITEMS[i]; }
    return null;
  }
  function afficher(id, type, html){
    var fb = document.getElementById("fb-" + id);
    fb.className = "feedback " + type;
    fb.innerHTML = html;
    fb.hidden = false;
  }
  function marquer(input, etat){
    if (!input) return;
    input.classList.remove("correct","incorrect");
    if (etat === "correct" || etat === "incorrect") input.classList.add(etat);
  }

  function verifier(id){
    var it = trouver(id);
    if (!it) return;
    var input = document.getElementById("in-" + id);
    var brut = input.value;

    if (String(brut).replace(/[\s\u00a0]/g,"") === ""){
      etats[id] = "vide"; marquer(input, "");
      afficher(id, "warn", "\u26a0\ufe0f Aucune r\u00e9ponse saisie. Calcule, puis clique sur <strong>OK</strong>.");
      return;
    }
    var norm = normalise(brut);
    if (norm === null){
      etats[id] = "incorrect"; marquer(input, "incorrect");
      afficher(id, "warn", "\u26a0\ufe0f Saisie non reconnue&nbsp;: &laquo;&nbsp;" + esc(brut) + "&nbsp;&raquo;. \u00c9cris un nombre seul.");
      return;
    }
    var val = Number(norm);
    if (val === it.val){
      etats[id] = "correct"; marquer(input, "correct");
      afficher(id, "ok", "\u2705 Bravo&nbsp;! " + it.ref);
      return;
    }
    etats[id] = "incorrect"; marquer(input, "incorrect");
    afficher(id, "ko", "\u274c Ce n\u2019est pas la bonne valeur.<br>R\u00e9ponse attendue&nbsp;: " + it.ref);
  }

  function basculerAide(id){
    var it = trouver(id);
    var box = document.getElementById("ai-" + id);
    if (!it || !box) return;
    if (box.hidden){
      box.innerHTML = "\ud83d\udca1 <strong>Indice&nbsp;:</strong> " + it.aide;
      box.hidden = false;
    } else {
      box.hidden = true;
    }
  }

  function palier(pct){
    if (pct >= 90) return "\ud83d\udfe2 Excellent";
    if (pct >= 75) return "\ud83d\udfe2 Tr\u00e8s bien";
    if (pct >= 60) return "\ud83d\udfe1 Ma\u00eetrise satisfaisante";
    if (pct >= 40) return "\ud83d\udfe0 Ma\u00eetrise fragile";
    return "\ud83d\udd34 Ma\u00eetrise insuffisante";
  }

  function verifierTout(){
    if (occupe) return;
    occupe = true;
    window.setTimeout(function(){ occupe = false; }, 350);

    var total = ITEMS.length;
    var score = 0;
    var recap = "";
    for (var i=0;i<ITEMS.length;i++){
      var id = ITEMS[i].id;
      verifier(id);
      var e = etats[id];
      if (e === "correct"){ score++; recap += '<span class="r-ok">\u2714 ' + id + '</span>'; }
      else { recap += '<span class="r-ko">\u2718 ' + id + '</span>'; }
    }

    var pct = Math.round((score / total) * 100);
    var bilan = document.getElementById("bilan");
    bilan.innerHTML =
      '<div class="score">Score&nbsp;: ' + score + '\u2009/\u2009' + total + ' (' + pct + '&nbsp;%)</div>' +
      '<div class="palier">' + palier(pct) + '</div>' +
      '<div class="recap">' + recap + '</div>' +
      '<div class="legende">\u2714 correct &nbsp;\u2022&nbsp; \u2718 incorrect ou non r\u00e9pondu.</div>';
    bilan.hidden = false;
  }

  function basculerCorrection(){
    var box = document.getElementById("correction");
    var btn = document.getElementById("btn-corr");
    if (box.hidden){
      var html = "<h2>Correction</h2><ul>";
      for (var i=0;i<ITEMS.length;i++){
        html += "<li><strong>" + ITEMS[i].id + "</strong>&nbsp;: " + ITEMS[i].ref + "</li>";
      }
      html += "</ul>";
      box.innerHTML = html;
      box.hidden = false;
      btn.textContent = "Masquer la correction";
    } else {
      box.hidden = true;
      btn.textContent = "Voir la correction";
    }
  }

  function reinitialiser(){
    for (var i=0;i<ITEMS.length;i++){
      var id = ITEMS[i].id;
      var input = document.getElementById("in-" + id);
      input.value = ""; input.disabled=false; input.readOnly=false;
      input.classList.remove("correct","incorrect");
      var fb = document.getElementById("fb-" + id);
      fb.hidden = true; fb.innerHTML = ""; fb.className = "feedback";
      var ai = document.getElementById("ai-" + id);
      ai.hidden = true; ai.innerHTML = "";
      etats[id] = "vide";
    }
    var bilan = document.getElementById("bilan");
    bilan.hidden = true; bilan.innerHTML = "";
    var corr = document.getElementById("correction");
    corr.hidden = true; corr.innerHTML = "";
    document.getElementById("btn-corr").textContent = "Voir la correction";
    occupe = false;
  }

  function init(){
    for (var i=0;i<ITEMS.length;i++){ etats[ITEMS[i].id] = "vide"; }

    var bOk = document.querySelectorAll("[data-ok]");
    for (var a=0;a<bOk.length;a++){
      bOk[a].addEventListener("click", function(){ verifier(this.getAttribute("data-ok")); });
    }
    var bAide = document.querySelectorAll("[data-aide]");
    for (var b=0;b<bAide.length;b++){
      bAide[b].addEventListener("click", function(){ basculerAide(this.getAttribute("data-aide")); });
    }
    var champs = document.querySelectorAll('input[type="text"]');
    for (var c=0;c<champs.length;c++){
      champs[c].addEventListener("keydown", function(ev){
        if (ev.key === "Enter"){ ev.preventDefault(); verifier(this.id.replace("in-","")); }
      });
    }

    document.getElementById("btn-tout").addEventListener("click", verifierTout);
    document.getElementById("btn-corr").addEventListener("click", basculerCorrection);
    document.getElementById("btn-reset").addEventListener("click", reinitialiser);
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
