<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rituel &mdash; Semaine 8 S&eacute;ance 1 &mdash; Proportionnalit&eacute;</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#fffdf7;font-family:Arial,Helvetica,sans-serif;color:#243238;line-height:1.6;padding:14px;overflow-x:hidden}
.bulle{position:fixed;border-radius:50%;background:#3ba5b8;opacity:.12;pointer-events:none;z-index:0}
.b1{width:190px;height:190px;top:-70px;left:-70px}
.b2{width:130px;height:130px;top:-45px;right:-45px}
.b3{width:160px;height:160px;bottom:-60px;left:-55px}
.b4{width:110px;height:110px;bottom:-40px;right:-35px}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto}
.tete{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.etq{display:inline-block;padding:7px 16px;border-radius:8px;color:#fff;font-weight:700;font-size:.95rem}
.etq-sem{background:#8fd3e8;color:#123f4a}
.etq-sea{background:#3ba5b8}
.etq-rit{background:#1f7a8c;font-family:Georgia,"Times New Roman",serif;margin-left:auto}
h1{font-size:clamp(1.3rem,4.5vw,2rem);font-weight:900;color:#1f7a8c;margin:6px 0 18px;line-height:1.3}
.bloc{position:relative;border:2px solid #3ba5b8;border-radius:12px;background:#fff;padding:26px 18px 20px;margin-bottom:18px}
.onglet{position:absolute;top:-17px;left:18px;background:#8fd3e8;color:#123f4a;font-weight:700;font-size:.95rem;padding:5px 18px;border-radius:8px}
.tete-ex{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px;min-width:0}
.pastille{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:#1f7a8c;color:#fff;font-weight:700;font-size:1rem;display:flex;align-items:center;justify-content:center}
.consigne{margin:4px 0 0;font-weight:700;text-decoration:underline;color:#1f7a8c;font-size:clamp(.95rem,2.6vw,1.05rem);min-width:0;overflow-wrap:break-word}
.tableau-scroll{overflow-x:auto;margin-bottom:10px}
.tableau-photos{border-collapse:collapse;width:100%;min-width:460px}
.tableau-photos th{background:#8fd3e8;color:#123f4a;font-weight:700;padding:10px 8px;border:1px solid #b9dfe8;font-size:.9rem;text-align:center;width:110px}
.tableau-photos td.lib{background:#8fd3e8;color:#123f4a;font-weight:700;padding:10px 8px;border:1px solid #b9dfe8;text-align:center}
.tableau-photos td.donnee{border:1px solid #dceff3;background:#f7fcfd;padding:10px 8px;text-align:center;font-weight:700}
.tableau-photos td.rep{border:1px solid #dceff3;background:#fff;padding:6px;text-align:center}
.tableau-photos input[type="text"]{width:90%;max-width:90px;min-width:0;padding:9px 6px;font-family:Arial,Helvetica,sans-serif;font-size:1rem;font-weight:700;text-align:center;color:#1f7a8c;background:#f7fcfd;border:1px solid #b9dfe8;border-bottom:2px dotted #3ba5b8;border-radius:6px}
.tableau-photos input[type="text"]:focus{outline:2px solid #3ba5b8;outline-offset:1px}
.tableau-photos input.correct{border-color:#2e8b57;background:#effaf3;color:#2e8b57}
.tableau-photos input.incorrect{border-color:#c0392b;background:#fdefee;color:#c0392b}
.actions{display:flex;flex-wrap:wrap;gap:8px}
button{font-family:inherit;font-size:.92rem;font-weight:700;min-height:44px;padding:10px 16px;border:0;border-radius:8px;cursor:pointer;background:#3ba5b8;color:#fff;line-height:1.2}
button:hover{background:#1f7a8c}
button.sec{background:#fff;color:#1f7a8c;border:2px solid #3ba5b8}
button.sec:hover{background:#eaf7fa}
.feedback{margin:12px 0 0;padding:12px 14px;border-left:5px solid #3ba5b8;border-radius:6px;background:#f4fafb;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.75;overflow-wrap:break-word}
.feedback.ok{border-left-color:#2e8b57;background:#effaf3;color:#1e6b40}
.feedback.ko{border-left-color:#c0392b;background:#fdefee;color:#96291d}
.feedback.warn{border-left-color:#c9820a;background:#fff8ea;color:#8a5b04}
.barre{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.barre button{flex:1 1 190px}
.correction{border:2px dashed #3ba5b8;border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:18px;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.8}
.correction h2{margin:0 0 8px;font-size:1.05rem;color:#1f7a8c}
.correction table{border-collapse:collapse;width:100%;margin:10px 0}
.correction table th,.correction table td{border:1px solid #dceff3;padding:6px 10px;text-align:center}
.correction table th{background:#f4fafb;color:#1f7a8c}
.bilan{border:2px solid #1f7a8c;border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:18px;font-size:.92rem;line-height:1.8}
.bilan .score{font-size:clamp(1.05rem,3.2vw,1.25rem);font-weight:900;color:#1f7a8c}
.bilan .palier{font-weight:700;margin-top:4px}
.recap{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.recap span{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;background:#f4fafb;font-weight:700;font-size:.9rem;border:1px solid #dceff3}
.recap .r-ok{color:#2e8b57}
.recap .r-ko{color:#c0392b}
.legende{margin-top:10px;font-size:.85rem;color:#4d6169}
@media (max-width:480px){
  body{padding:10px}
  .bloc{padding:24px 12px 16px}
  .etq{font-size:.85rem;padding:6px 12px}
  .etq-rit{margin-left:0}
  .tableau-photos th, .tableau-photos td{padding:7px 4px;font-size:.85rem}
  .tableau-photos input[type="text"]{max-width:70px}
}
</style>
</head>
<body>
<div class="bulle b1"></div><div class="bulle b2"></div><div class="bulle b3"></div><div class="bulle b4"></div>

<main class="wrap">
  <div class="tete">
    <span class="etq etq-sem">Semaine 8</span>
    <span class="etq etq-sea">S&eacute;ance 1</span>
    <span class="etq etq-rit">Rituel</span>
  </div>

  <h1>Compl&eacute;ter un tableau de proportionnalit&eacute;</h1>

  <section class="bloc">
    <span class="onglet">Calcul</span>

    <div class="tete-ex">
      <span class="pastille">1</span>
      <p class="consigne">Compl&egrave;te le tableau pour avoir le prix selon la quantit&eacute; de photos&nbsp;:</p>
    </div>

    <div class="tableau-scroll">
      <table class="tableau-photos">
        <tr><td class="lib">Nombre de photos</td><td class="donnee">1</td><td class="donnee">2</td><td class="donnee">3</td><td class="donnee">4</td><td class="donnee">5</td></tr>
        <tr><td class="lib">Prix en euros</td><td class="donnee">6</td><td class="rep"><input type="text" id="in-p2" inputmode="decimal" autocomplete="off" aria-label="Prix pour 2 photos"></td><td class="rep"><input type="text" id="in-p3" inputmode="decimal" autocomplete="off" aria-label="Prix pour 3 photos"></td><td class="rep"><input type="text" id="in-p4" inputmode="decimal" autocomplete="off" aria-label="Prix pour 4 photos"></td><td class="rep"><input type="text" id="in-p5" inputmode="decimal" autocomplete="off" aria-label="Prix pour 5 photos"></td></tr>
      </table>
    </div>

    <div class="actions" style="margin:10px 0 0"><button type="button" id="btn-verif-photos">V&eacute;rifier le tableau</button></div>
    <div class="feedback" id="fb-photos" hidden></div>

  </section>

  <div class="barre">
    <button type="button" id="btn-tout">V&eacute;rifier tout</button>
    <button type="button" class="sec" id="btn-corr">Voir la correction</button>
    <button type="button" class="sec" id="btn-reset">R&eacute;initialiser</button>
  </div>

  <div class="correction" id="correction" hidden></div>
  <div class="bilan" id="bilan" hidden></div>
</main>

<script>
(function(){
  "use strict";

  var ITEMS = [
    { id:"p2", nombre:"2", prix:"12" },
    { id:"p3", nombre:"3", prix:"18" },
    { id:"p4", nombre:"4", prix:"24" },
    { id:"p5", nombre:"5", prix:"30" }
  ];

  var etats = {};
  var occupe = false;

  function trouver(id){
    for (var i = 0; i < ITEMS.length; i++){ if (ITEMS[i].id === id) return ITEMS[i]; }
    return null;
  }

  function esc(txt){
    var d = document.createElement("div");
    d.textContent = String(txt);
    return d.innerHTML;
  }

  function normalise(brut){
    var s = String(brut).replace(/[\s\u00a0\u202f\u2009]/g, "");
    s = s.replace(/[\u2212\u2013\u2014]/g, "-").replace(/,/g, ".");
    if (s === "") return null;
    if (!/^-?(\d+(\.\d*)?|\.\d+)$/.test(s)) return null;
    return s;
  }

  function decompose(s){
    var neg = false;
    if (s.charAt(0) === "-"){ neg = true; s = s.slice(1); }
    var p = s.split(".");
    var ent = p[0] === "" ? "0" : p[0];
    var dec = p.length > 1 ? p[1] : "";
    ent = ent.replace(/^0+(?=\d)/,"");
    dec = dec.replace(/0+$/,"");
    if (ent === "0" && dec === "") neg = false;
    return { neg:neg, ent:ent, dec:dec };
  }

  function cmpAbs(a,b){
    if (a.ent.length !== b.ent.length) return a.ent.length > b.ent.length ? 1 : -1;
    if (a.ent !== b.ent) return a.ent > b.ent ? 1 : -1;
    var n = Math.max(a.dec.length, b.dec.length);
    var da = a.dec + new Array(n - a.dec.length + 1).join("0");
    var db = b.dec + new Array(n - b.dec.length + 1).join("0");
    if (da === db) return 0;
    return da > db ? 1 : -1;
  }

  function comparer(x,y){
    var A = decompose(x), B = decompose(y);
    if (A.neg !== B.neg) return A.neg ? -1 : 1;
    var r = cmpAbs(A,B);
    return A.neg ? -r : r;
  }

  function marquer(input, etat){
    if (!input) return;
    input.classList.remove("correct","incorrect");
    if (etat) input.classList.add(etat);
  }

  function afficher(type, html){
    var fb = document.getElementById("fb-photos");
    fb.className = "feedback " + type;
    fb.innerHTML = html;
    fb.hidden = false;
  }

  function verifierItem(it){
    var input = document.getElementById("in-" + it.id);
    var brut = input.value;
    if (String(brut).replace(/\s/g,"") === ""){
      etats[it.id] = "vide"; marquer(input,"");
      return;
    }
    var val = normalise(brut);
    if (val === null){
      etats[it.id] = "incorrect"; marquer(input,"incorrect");
      return;
    }
    if (comparer(val, normalise(it.prix)) === 0){
      etats[it.id] = "correct"; marquer(input,"correct");
    } else {
      etats[it.id] = "incorrect"; marquer(input,"incorrect");
    }
  }

  function palier(pct){
    if (pct >= 90) return "\ud83d\udfe2 Excellent";
    if (pct >= 75) return "\ud83d\udfe2 Tr\u00e8s bien";
    if (pct >= 60) return "\ud83d\udfe1 Ma\u00eetrise satisfaisante";
    if (pct >= 40) return "\ud83d\udfe0 Ma\u00eetrise fragile";
    return "\ud83d\udd34 Ma\u00eetrise insuffisante";
  }

  function verifierTableau(){
    var total = ITEMS.length, score = 0;
    ITEMS.forEach(function(it){
      verifierItem(it);
      if (etats[it.id] === "correct") score++;
    });
    var pct = Math.round((score/total)*100);
    if (score === total){
      afficher("ok", "\u2705 Bravo&nbsp;! Le tableau est enti\u00e8rement correct (1 photo co\u00fbte 6&nbsp;\u20ac, donc on multiplie le nombre de photos par 6).");
    } else if (score === 0) {
      afficher("warn", "\u26a0\ufe0f Aucune r\u00e9ponse correcte pour l\u2019instant. Indice&nbsp;: 1 photo co\u00fbte 6&nbsp;\u20ac ; multiplie le nombre de photos par 6 pour trouver le prix.");
    } else {
      afficher("warn", "\u26a0\ufe0f " + score + "&nbsp;/&nbsp;" + total + " r\u00e9ponses correctes (" + pct + "&nbsp;%). Les cases rouges sont \u00e0 corriger&nbsp;: pense \u00e0 multiplier par 6.");
    }
  }

  function verifierTout(){
    if (occupe) return;
    occupe = true;
    window.setTimeout(function(){ occupe = false; }, 350);

    var total = ITEMS.length, score = 0, recap = "";
    ITEMS.forEach(function(it){
      verifierItem(it);
      if (etats[it.id] === "correct"){ score++; recap += '<span class="r-ok">\u2714 ' + it.nombre + ' photos</span>'; }
      else { recap += '<span class="r-ko">\u2718 ' + it.nombre + ' photos</span>'; }
    });
    var pct = Math.round((score/total)*100);
    var bilan = document.getElementById("bilan");
    bilan.innerHTML =
      '<div class="score">Score&nbsp;: ' + score + '\u2009/\u2009' + total + ' (' + pct + '&nbsp;%)</div>' +
      '<div class="palier">' + palier(pct) + '</div>' +
      '<div class="recap">' + recap + '</div>' +
      '<div class="legende">\u2714 correct &nbsp;\u2022&nbsp; \u2718 incorrect ou non r\u00e9pondu.</div>';
    bilan.hidden = false;
    verifierTableau();
  }

  function basculerCorrection(){
    var box = document.getElementById("correction");
    var btn = document.getElementById("btn-corr");
    if (box.hidden){
      var cellules = "";
      ITEMS.forEach(function(it){
        cellules += "<td><strong><u>" + it.prix + "</u></strong></td>";
      });
      box.innerHTML =
        "<h2>Correction</h2>" +
        "<table><tr><th>Nombre de photos</th><td>1</td>" +
          ITEMS.map(function(it){ return "<td>" + it.nombre + "</td>"; }).join("") +
        "</tr><tr><th>Prix en euros</th><td>6</td>" + cellules + "</tr></table>" +
        "<p><strong>M\u00e9thode&nbsp;:</strong> 1 photo co\u00fbte 6&nbsp;\u20ac. Pour trouver le prix de plusieurs photos, on multiplie le nombre de photos par <strong>6</strong>.</p>";
      box.hidden = false;
      btn.textContent = "Masquer la correction";
    } else {
      box.hidden = true;
      btn.textContent = "Voir la correction";
    }
  }

  function reinitialiser(){
    ITEMS.forEach(function(it){
      var input = document.getElementById("in-" + it.id);
      input.value = ""; input.disabled = false; input.readOnly = false;
      input.classList.remove("correct","incorrect");
      etats[it.id] = "vide";
    });
    var fb = document.getElementById("fb-photos");
    fb.hidden = true; fb.innerHTML = ""; fb.className = "feedback";
    var bilan = document.getElementById("bilan");
    bilan.hidden = true; bilan.innerHTML = "";
    var corr = document.getElementById("correction");
    corr.hidden = true; corr.innerHTML = "";
    document.getElementById("btn-corr").textContent = "Voir la correction";
    occupe = false;
  }

  function init(){
    ITEMS.forEach(function(it){ etats[it.id] = "vide"; });
    var champs = document.querySelectorAll('input[type="text"]');
    for (var i = 0; i < champs.length; i++){
      champs[i].addEventListener("keydown", function(ev){
        if (ev.key === "Enter"){ ev.preventDefault(); verifierTableau(); }
      });
    }
    document.getElementById("btn-verif-photos").addEventListener("click", verifierTableau);
    document.getElementById("btn-tout").addEventListener("click", verifierTout);
    document.getElementById("btn-corr").addEventListener("click", basculerCorrection);
    document.getElementById("btn-reset").addEventListener("click", reinitialiser);
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
