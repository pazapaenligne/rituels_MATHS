<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rituel &mdash; Semaine 10 S&eacute;ance 2 &mdash; Vrai ou faux&nbsp;? (calcul litt&eacute;ral)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#fffdf7;font-family:Arial,Helvetica,sans-serif;color:#243238;line-height:1.6;padding:14px;overflow-x:hidden}
.bulle{position:fixed;border-radius:50%;background:#3ba5b8;opacity:.12;pointer-events:none;z-index:0}
.b1{width:190px;height:190px;top:-70px;left:-70px}
.b2{width:130px;height:130px;top:-45px;right:-45px}
.b3{width:160px;height:160px;bottom:-60px;left:-55px}
.b4{width:110px;height:110px;bottom:-40px;right:-35px}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto}
.tete{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.etq{display:inline-block;padding:7px 16px;border-radius:8px;color:#fff;font-weight:700;font-size:.95rem}
.etq-sem{background:#8fd3e8;color:#123f4a}
.etq-sea{background:#3ba5b8}
.etq-rit{background:#1f7a8c;font-family:Georgia,"Times New Roman",serif;margin-left:auto}
h1{font-size:clamp(1.3rem,4.5vw,2rem);font-weight:900;color:#1f7a8c;margin:6px 0 18px;line-height:1.3}
.bloc{position:relative;border:2px solid #3ba5b8;border-radius:12px;background:#fff;padding:28px 18px 20px;margin-bottom:18px}
.onglet{position:absolute;top:-17px;left:18px;background:#8fd3e8;color:#123f4a;font-weight:700;font-size:.95rem;padding:5px 18px;border-radius:8px}
.tete-ex{display:flex;align-items:flex-start;gap:12px;margin:0 0 16px;min-width:0}
.pastille{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:#1f7a8c;color:#fff;font-weight:700;font-size:1rem;display:flex;align-items:center;justify-content:center}
.consigne{margin:4px 0 0;font-weight:700;text-decoration:underline;color:#1f7a8c;font-size:clamp(.95rem,2.6vw,1.05rem);min-width:0;overflow-wrap:break-word}
.item{padding:14px 0;border-bottom:1px dashed #dceff3}
.item:last-of-type{border-bottom:0}
.q{font-size:clamp(1rem,3vw,1.15rem);font-weight:700;margin:0 0 10px;color:#243238;overflow-wrap:break-word}
.vf-ligne{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.vf-btns{display:flex;gap:8px;flex:0 0 auto}
.vf-btn{
  font-family:inherit;font-size:.92rem;font-weight:700;
  min-height:44px;min-width:88px;padding:10px 18px;
  border:2px solid #dceff3;border-radius:8px;cursor:pointer;
  background:#f7fcfd;color:#243238;
}
.vf-btn:hover{background:#eaf7fa}
.vf-btn.sel{border-color:#3ba5b8;background:#eaf7fa;color:#1f7a8c}
.vf-btn.bonne{border-color:#2e8b57;background:#effaf3;color:#1e6b40;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
button{font-family:inherit;font-size:.92rem;font-weight:700;min-height:44px;padding:10px 16px;border:0;border-radius:8px;cursor:pointer;background:#3ba5b8;color:#fff;line-height:1.2}
button:hover{background:#1f7a8c}
button.sec{background:#fff;color:#1f7a8c;border:2px solid #3ba5b8}
button.sec:hover{background:#eaf7fa;color:#1f7a8c}
.feedback{margin:10px 0 0;padding:12px 14px;border-left:5px solid #3ba5b8;border-radius:6px;background:#f4fafb;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.75;overflow-wrap:break-word}
.feedback.info{border-left-color:#3ba5b8;background:#f4fafb;color:#17505c}
.feedback.warn{border-left-color:#c9820a;background:#fff8ea;color:#8a5b04}
.aide{margin:10px 0 0;padding:12px 14px;border-left:5px solid #8fd3e8;background:#f2fafd;border-radius:6px;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.75}
.barre{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.barre button{flex:1 1 190px}
.correction{border:2px dashed #3ba5b8;border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:18px;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.8}
.correction h2{margin:0 0 10px;font-size:1.05rem;color:#1f7a8c}
.correction ul{margin:6px 0 0;padding-left:20px}
.correction li{margin-bottom:8px}
.bilan{border:2px solid #1f7a8c;border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:18px;font-size:.92rem;line-height:1.8}
.bilan .score{font-size:clamp(1.05rem,3.2vw,1.25rem);font-weight:900;color:#1f7a8c}
.bilan .palier{font-weight:700;margin-top:4px}
.recap{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.recap span{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;background:#f4fafb;font-weight:700;font-size:.9rem;border:1px solid #dceff3}
.recap .r-ok{color:#2e8b57}
.recap .r-ko{color:#c0392b}
.legende{margin-top:10px;font-size:.85rem;color:#4d6169}
@media (max-width:768px){.actions{margin-left:0;width:100%}.actions button{flex:1 1 auto}.vf-ligne{width:100%}}
@media (max-width:480px){body{padding:10px}.bloc{padding:26px 12px 16px}.etq{font-size:.85rem;padding:6px 12px}.etq-rit{margin-left:0}.vf-btn{flex:1 1 0;min-width:0}.recap span{font-size:.85rem}}
</style>
</head>
<body>
<div class="bulle b1"></div><div class="bulle b2"></div><div class="bulle b3"></div><div class="bulle b4"></div>

<main class="wrap">

  <div class="tete">
    <span class="etq etq-sem">Semaine 10</span>
    <span class="etq etq-sea">S&eacute;ance 2</span>
    <span class="etq etq-rit">Rituel</span>
  </div>

  <h1>Vrai ou faux&nbsp;? (calcul litt&eacute;ral)</h1>

  <section class="bloc">
    <span class="onglet">Alg&egrave;bre</span>

    <div class="tete-ex">
      <span class="pastille">1</span>
      <p class="consigne">Indique si chaque affirmation est vraie ou fausse, quelle que soit la valeur choisie pour la lettre.</p>
    </div>

    <div class="item">
      <p class="q">a. X&nbsp;&times;&nbsp;0 = 0.</p>
      <div class="vf-ligne">
        <div class="vf-btns">
          <button type="button" class="vf-btn" data-vf="a" data-val="vrai">Vrai</button>
          <button type="button" class="vf-btn" data-vf="a" data-val="faux">Faux</button>
        </div>
        <div class="actions"><button type="button" data-vfok="a">V&eacute;rifier</button><button type="button" class="sec" data-aide="a">Indice</button></div>
      </div>
      <div class="feedback" id="fb-a" hidden></div>
      <div class="aide" id="ai-a" hidden></div>
    </div>

    <div class="item">
      <p class="q">b. X&nbsp;&times;&nbsp;X = 2X.</p>
      <div class="vf-ligne">
        <div class="vf-btns">
          <button type="button" class="vf-btn" data-vf="b" data-val="vrai">Vrai</button>
          <button type="button" class="vf-btn" data-vf="b" data-val="faux">Faux</button>
        </div>
        <div class="actions"><button type="button" data-vfok="b">V&eacute;rifier</button><button type="button" class="sec" data-aide="b">Indice</button></div>
      </div>
      <div class="feedback" id="fb-b" hidden></div>
      <div class="aide" id="ai-b" hidden></div>
    </div>

    <div class="item">
      <p class="q">c. 2&nbsp;+&nbsp;2X = 4X.</p>
      <div class="vf-ligne">
        <div class="vf-btns">
          <button type="button" class="vf-btn" data-vf="c" data-val="vrai">Vrai</button>
          <button type="button" class="vf-btn" data-vf="c" data-val="faux">Faux</button>
        </div>
        <div class="actions"><button type="button" data-vfok="c">V&eacute;rifier</button><button type="button" class="sec" data-aide="c">Indice</button></div>
      </div>
      <div class="feedback" id="fb-c" hidden></div>
      <div class="aide" id="ai-c" hidden></div>
    </div>

    <div class="item">
      <p class="q">d. X&nbsp;+&nbsp;X = X&sup2;.</p>
      <div class="vf-ligne">
        <div class="vf-btns">
          <button type="button" class="vf-btn" data-vf="d" data-val="vrai">Vrai</button>
          <button type="button" class="vf-btn" data-vf="d" data-val="faux">Faux</button>
        </div>
        <div class="actions"><button type="button" data-vfok="d">V&eacute;rifier</button><button type="button" class="sec" data-aide="d">Indice</button></div>
      </div>
      <div class="feedback" id="fb-d" hidden></div>
      <div class="aide" id="ai-d" hidden></div>
    </div>

    <div class="item">
      <p class="q">e. t&nbsp;&times;&nbsp;4 = 4t.</p>
      <div class="vf-ligne">
        <div class="vf-btns">
          <button type="button" class="vf-btn" data-vf="e" data-val="vrai">Vrai</button>
          <button type="button" class="vf-btn" data-vf="e" data-val="faux">Faux</button>
        </div>
        <div class="actions"><button type="button" data-vfok="e">V&eacute;rifier</button><button type="button" class="sec" data-aide="e">Indice</button></div>
      </div>
      <div class="feedback" id="fb-e" hidden></div>
      <div class="aide" id="ai-e" hidden></div>
    </div>

  </section>

  <div class="barre">
    <button type="button" id="btn-tout">V&eacute;rifier tout</button>
    <button type="button" class="sec" id="btn-corr">Voir la correction</button>
    <button type="button" class="sec" id="btn-reset">R&eacute;initialiser</button>
  </div>

  <div class="correction" id="correction" hidden></div>
  <div class="bilan" id="bilan" hidden></div>

</main>

<script>
(function(){
  "use strict";

  var ITEMS = [
    { id:"a", reponse:"vrai",
      expl:"X&nbsp;&times;&nbsp;0 = 0 est <strong>toujours vrai</strong>&nbsp;: multiplier n\u2019importe quel nombre par 0 donne toujours 0.",
      aide:"Que donne n\u2019importe quel nombre multipli\u00e9 par 0&nbsp;?" },
    { id:"b", reponse:"faux",
      expl:"X&nbsp;&times;&nbsp;X = X&sup2;, qui n\u2019est \u00e9gal \u00e0 2X que pour certaines valeurs de X (X = 0 ou X = 2), pas pour <strong>toute</strong> valeur de X.",
      aide:"Remplace X par une valeur simple, par exemple 3, et compare les deux membres." },
    { id:"c", reponse:"faux",
      expl:"2&nbsp;+&nbsp;2X n\u2019est \u00e9gal \u00e0 4X que pour X&nbsp;=&nbsp;1, pas pour <strong>toute</strong> valeur de X.",
      aide:"Remplace X par une valeur simple, par exemple 3, et compare les deux membres." },
    { id:"d", reponse:"faux",
      expl:"X&nbsp;+&nbsp;X = 2X, qui n\u2019est \u00e9gal \u00e0 X&sup2; que pour certaines valeurs de X (X = 0 ou X = 2), pas pour <strong>toute</strong> valeur de X.",
      aide:"Remplace X par une valeur simple, par exemple 3, et compare les deux membres." },
    { id:"e", reponse:"vrai",
      expl:"t&nbsp;&times;&nbsp;4 = 4t est <strong>toujours vrai</strong>&nbsp;: la multiplication est commutative, l\u2019ordre des facteurs ne change pas le r\u00e9sultat.",
      aide:"La multiplication est-elle commutative&nbsp;: l\u2019ordre des facteurs change-t-il le r\u00e9sultat&nbsp;?" }
  ];

  var choix = {};
  var etats = {};
  var occupe = false;

  function trouver(id){
    for (var i = 0; i < ITEMS.length; i++){ if (ITEMS[i].id === id) return ITEMS[i]; }
    return null;
  }

  function afficher(id, type, html){
    var fb = document.getElementById("fb-" + id);
    fb.className = "feedback " + type;
    fb.innerHTML = html;
    fb.hidden = false;
  }

  function choisir(id, val){
    choix[id] = val;
    var btns = document.querySelectorAll('[data-vf="' + id + '"]');
    for (var i = 0; i < btns.length; i++){
      btns[i].classList.remove("sel");
      if (btns[i].getAttribute("data-val") === val) btns[i].classList.add("sel");
    }
  }

  function verifier(id){
    var it = trouver(id);
    if (!it) return;
    var btns = document.querySelectorAll('[data-vf="' + id + '"]');
    for (var i = 0; i < btns.length; i++){
      btns[i].classList.remove("bonne");
      if (btns[i].getAttribute("data-val") === it.reponse) btns[i].classList.add("bonne");
    }
    if (!choix[id]){
      etats[id] = "incorrect";
      afficher(id, "warn", "\u26a0\ufe0f Aucune r\u00e9ponse choisie. " + it.expl);
      return;
    }
    etats[id] = (choix[id] === it.reponse) ? "correct" : "incorrect";
    afficher(id, "info", "\ud83d\udc40 " + it.expl);
  }

  function basculerAide(id){
    var it = trouver(id);
    var box = document.getElementById("ai-" + id);
    if (!it || !box) return;
    if (box.hidden){
      box.innerHTML = "\ud83d\udca1 <strong>Indice&nbsp;:</strong> " + it.aide;
      box.hidden = false;
    } else {
      box.hidden = true;
    }
  }

  function palier(pct){
    if (pct >= 90) return "\ud83d\udfe2 Excellent";
    if (pct >= 75) return "\ud83d\udfe2 Tr\u00e8s bien";
    if (pct >= 60) return "\ud83d\udfe1 Ma\u00eetrise satisfaisante";
    if (pct >= 40) return "\ud83d\udfe0 Ma\u00eetrise fragile";
    return "\ud83d\udd34 Ma\u00eetrise insuffisante";
  }

  function verifierTout(){
    if (occupe) return;
    occupe = true;
    window.setTimeout(function(){ occupe = false; }, 350);

    var total = ITEMS.length, score = 0, recap = "";
    for (var i = 0; i < ITEMS.length; i++){
      var id = ITEMS[i].id;
      verifier(id);
      if (etats[id] === "correct"){ score++; recap += '<span class="r-ok">\u2714 ' + id + '</span>'; }
      else { recap += '<span class="r-ko">\u2718 ' + id + '</span>'; }
    }
    if (score < 0) score = 0;
    if (score > total) score = total;
    var pct = Math.round((score/total)*100);

    var bilan = document.getElementById("bilan");
    bilan.innerHTML =
      '<div class="score">Score&nbsp;: ' + score + '\u2009/\u2009' + total + ' (' + pct + '&nbsp;%)</div>' +
      '<div class="palier">' + palier(pct) + '</div>' +
      '<div class="recap">' + recap + '</div>' +
      '<div class="legende">\u2714 correct &nbsp;\u2022&nbsp; \u2718 incorrect ou non r\u00e9pondu. La r\u00e9ponse choisie n\u2019est jamais signal\u00e9e en rouge&nbsp;: seule la bonne r\u00e9ponse est indiqu\u00e9e en vert.</div>';
    bilan.hidden = false;
  }

  function basculerCorrection(){
    var box = document.getElementById("correction");
    var btn = document.getElementById("btn-corr");
    if (box.hidden){
      var lignes = "";
      for (var i = 0; i < ITEMS.length; i++){
        var it = ITEMS[i];
        lignes += "<li><strong>" + it.id + ".</strong> " + (it.reponse === "vrai" ? "Vrai" : "Faux") + "&nbsp;: " + it.expl + "</li>";
      }
      box.innerHTML = "<h2>Correction</h2><ul>" + lignes + "</ul>";
      box.hidden = false;
      btn.textContent = "Masquer la correction";
    } else {
      box.hidden = true;
      btn.textContent = "Voir la correction";
    }
  }

  function reinitialiser(){
    for (var i = 0; i < ITEMS.length; i++){
      var id = ITEMS[i].id;
      choix[id] = null;
      etats[id] = "vide";
      var btns = document.querySelectorAll('[data-vf="' + id + '"]');
      for (var b = 0; b < btns.length; b++){ btns[b].classList.remove("sel","bonne"); }
      var fb = document.getElementById("fb-" + id);
      fb.hidden = true; fb.innerHTML = ""; fb.className = "feedback";
      var ai = document.getElementById("ai-" + id);
      ai.hidden = true; ai.innerHTML = "";
    }
    var bilan = document.getElementById("bilan");
    bilan.hidden = true; bilan.innerHTML = "";
    var corr = document.getElementById("correction");
    corr.hidden = true; corr.innerHTML = "";
    document.getElementById("btn-corr").textContent = "Voir la correction";
    occupe = false;
  }

  function init(){
    for (var i = 0; i < ITEMS.length; i++){ choix[ITEMS[i].id] = null; etats[ITEMS[i].id] = "vide"; }

    var bVf = document.querySelectorAll("[data-vf]");
    for (var a = 0; a < bVf.length; a++){
      bVf[a].addEventListener("click", function(){
        choisir(this.getAttribute("data-vf"), this.getAttribute("data-val"));
      });
    }
    var bOk = document.querySelectorAll("[data-vfok]");
    for (var b = 0; b < bOk.length; b++){
      bOk[b].addEventListener("click", function(){ verifier(this.getAttribute("data-vfok")); });
    }
    var bAide = document.querySelectorAll("[data-aide]");
    for (var c = 0; c < bAide.length; c++){
      bAide[c].addEventListener("click", function(){ basculerAide(this.getAttribute("data-aide")); });
    }
    document.getElementById("btn-tout").addEventListener("click", verifierTout);
    document.getElementById("btn-corr").addEventListener("click", basculerCorrection);
    document.getElementById("btn-reset").addEventListener("click", reinitialiser);
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
