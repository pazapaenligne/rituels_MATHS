<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rituel &mdash; Semaine 5 S&eacute;ance 3 &mdash; Vocabulaire du triangle</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#fffdf7;font-family:Arial,Helvetica,sans-serif;color:#243238;line-height:1.6;padding:14px;overflow-x:hidden}
.bulle{position:fixed;border-radius:50%;background:#3ba5b8;opacity:.12;pointer-events:none;z-index:0}
.b1{width:190px;height:190px;top:-70px;left:-70px}
.b2{width:130px;height:130px;top:-45px;right:-45px}
.b3{width:160px;height:160px;bottom:-60px;left:-55px}
.b4{width:110px;height:110px;bottom:-40px;right:-35px}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto}
.tete{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.etq{display:inline-block;padding:7px 16px;border-radius:8px;color:#fff;font-weight:700;font-size:.95rem}
.etq-sem{background:#8fd3e8;color:#123f4a}
.etq-sea{background:#3ba5b8}
.etq-rit{background:#1f7a8c;font-family:Georgia,"Times New Roman",serif;margin-left:auto}
h1{font-size:clamp(1.3rem,4.5vw,2rem);font-weight:900;color:#1f7a8c;margin:6px 0 18px;line-height:1.3}
.bloc{position:relative;border:2px solid #3ba5b8;border-radius:12px;background:#fff;padding:28px 18px 20px;margin-bottom:18px}
.onglet{position:absolute;top:-17px;left:18px;background:#8fd3e8;color:#123f4a;font-weight:700;font-size:.95rem;padding:5px 18px;border-radius:8px}
.consigne{margin:4px 0 6px;font-weight:700;text-decoration:underline;color:#1f7a8c;font-size:clamp(.95rem,2.6vw,1.05rem);min-width:0;overflow-wrap:break-word}
.banque{margin:0 0 18px;font-size:clamp(.9rem,2.4vw,1rem)}
.banque .mot{display:inline-block;padding:4px 12px;margin:3px 4px 0 0;border-radius:16px;background:#eaf7fa;border:1px solid #8fd3e8;color:#17505c;font-weight:700}
.figure-triangle{max-width:230px;margin:6px auto 20px}
.figure-triangle img{width:100%;height:auto;border:1px solid #dceff3;border-radius:8px;background:#fff}
.item{padding:12px 0;border-bottom:1px dashed #dceff3}
.item:last-of-type{border-bottom:0}
.q{font-size:clamp(1rem,3vw,1.1rem);font-weight:700;margin:0 0 10px;color:#243238;overflow-wrap:break-word;line-height:1.9}
.q .lettre{color:#1f7a8c;font-weight:700;margin-right:4px}
input.champ-inline{display:inline-block;width:auto;min-width:130px;max-width:220px;vertical-align:middle;margin:2px 3px;padding:7px 8px;font-family:Arial,Helvetica,sans-serif;font-size:1rem;font-weight:700;text-align:center;color:#1f7a8c;background:#f7fcfd;border:1px solid #b9dfe8;border-bottom:2px dotted #3ba5b8;border-radius:6px}
input.champ-inline:focus{outline:2px solid #3ba5b8;outline-offset:1px}
input.correct{border-color:#2e8b57;background:#effaf3;color:#2e8b57}
input.incorrect{border-color:#c0392b;background:#fdefee;color:#c0392b}
.ligne-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
button{font-family:inherit;font-size:.92rem;font-weight:700;min-height:44px;padding:10px 16px;border:0;border-radius:8px;cursor:pointer;background:#3ba5b8;color:#fff;line-height:1.2}
button:hover{background:#1f7a8c}
button.sec{background:#fff;color:#1f7a8c;border:2px solid #3ba5b8}
button.sec:hover{background:#eaf7fa}
.feedback{margin:10px 0 0;padding:12px 14px;border-left:5px solid #3ba5b8;border-radius:6px;background:#f4fafb;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.75;overflow-wrap:break-word}
.feedback.ok{border-left-color:#2e8b57;background:#effaf3;color:#1e6b40}
.feedback.ko{border-left-color:#c0392b;background:#fdefee;color:#96291d}
.feedback.warn{border-left-color:#c9820a;background:#fff8ea;color:#8a5b04}
.aide{margin:10px 0 0;padding:12px 14px;border-left:5px solid #8fd3e8;background:#f2fafd;border-radius:6px;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.75}
.barre{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.barre button{flex:1 1 190px}
.correction{border:2px dashed #3ba5b8;border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:18px;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.8}
.correction h2{margin:0 0 10px;font-size:1.05rem;color:#1f7a8c}
.correction ul{margin:6px 0 0;padding-left:20px}
.correction li{margin-bottom:6px}
.bilan{border:2px solid #1f7a8c;border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:18px;font-size:.92rem;line-height:1.8}
.bilan .score{font-size:clamp(1.05rem,3.2vw,1.25rem);font-weight:900;color:#1f7a8c}
.bilan .palier{font-weight:700;margin-top:4px}
.recap{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.recap span{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;background:#f4fafb;font-weight:700;font-size:.9rem;border:1px solid #dceff3}
.recap .r-ok{color:#2e8b57}
.recap .r-mid{color:#c9820a}
.recap .r-ko{color:#c0392b}
.legende{margin-top:10px;font-size:.85rem;color:#4d6169}
@media (max-width:480px){
  body{padding:10px}
  .bloc{padding:26px 12px 16px}
  .etq{font-size:.85rem;padding:6px 12px}
  .etq-rit{margin-left:0}
  input.champ-inline{min-width:110px}
  .recap span{font-size:.85rem}
}
</style>
</head>

<script>
(function(){
  "use strict";

  function esc(txt){
    var d = document.createElement("div");
    d.textContent = String(txt);
    return d.innerHTML;
  }

  function sansAccents(s){
    return s
      .replace(/[\u00e0\u00e2\u00e4\u00e1\u00e3]/g,"a")
      .replace(/[\u00e9\u00e8\u00ea\u00eb]/g,"e")
      .replace(/[\u00ee\u00ef\u00ec\u00ed]/g,"i")
      .replace(/[\u00f4\u00f6\u00f2\u00f3\u00f5]/g,"o")
      .replace(/[\u00fb\u00fc\u00f9\u00fa]/g,"u")
      .replace(/[\u00e7]/g,"c")
      .replace(/[\u2019\u2018\u02bc\u0060]/g,"'");
  }

  function normTexte(s){
    var t = sansAccents(String(s).toLowerCase());
    t = t.replace(/[\u00a0\u202f\u2009]/g," ").replace(/\s+/g," ");
    return t.trim();
  }

  function contient(texte, mots){
    for (var i = 0; i < mots.length; i++){
      if (texte.indexOf(mots[i]) !== -1) return true;
    }
    return false;
  }

  function afficher(id, type, html){
    var fb = document.getElementById("fb-" + id);
    if (!fb) return;
    fb.className = "feedback " + type;
    fb.innerHTML = html;
    fb.hidden = false;
  }

  function marquer(input, etat){
    if (!input) return;
    input.classList.remove("correct","incorrect");
    if (etat) input.classList.add(etat);
  }

  function basculerAide(id, texte){
    var box = document.getElementById("ai-" + id);
    if (!box) return;
    if (box.hidden){
      box.innerHTML = "\ud83d\udca1 <strong>Indice&nbsp;:</strong> " + texte;
      box.hidden = false;
    } else {
      box.hidden = true;
    }
  }

  function palier(pct){
    if (pct >= 90) return "\ud83d\udfe2 Excellent";
    if (pct >= 75) return "\ud83d\udfe2 Tr\u00e8s bien";
    if (pct >= 60) return "\ud83d\udfe1 Ma\u00eetrise satisfaisante";
    if (pct >= 40) return "\ud83d\udfe0 Ma\u00eetrise fragile";
    return "\ud83d\udd34 Ma\u00eetrise insuffisante";
  }

  var etats = {};
  var occupe = false;

  // ---------- Items a et b (un seul mot) ----------
  var SIMPLE = {
    a: { cle:["sommet"], ref:"sommets", aide:"Un sommet est un point o\u00f9 se rejoignent deux c\u00f4t\u00e9s du triangle." },
    b: { cle:["cote"],   ref:"c\u00f4t\u00e9s",  aide:"Un c\u00f4t\u00e9 est un segment qui relie deux sommets du triangle." }
  };

  function verifierSimple(id){
    var it = SIMPLE[id];
    var input = document.getElementById("in-" + id);
    var brut = input.value;
    if (String(brut).replace(/[\s\u00a0]/g,"") === ""){
      etats[id] = "vide";
      marquer(input, "");
      afficher(id, "warn", "\u26a0\ufe0f Aucune r\u00e9ponse saisie. Choisis un mot dans la banque, puis clique sur <strong>OK</strong>.");
      return;
    }
    var texte = normTexte(brut);
    if (contient(texte, it.cle)){
      etats[id] = "correct";
      marquer(input, "correct");
      afficher(id, "ok", "\u2705 Bravo&nbsp;! Le mot attendu est bien <strong><u>" + esc(it.ref) + "</u></strong>.");
      return;
    }
    etats[id] = "incorrect";
    marquer(input, "incorrect");
    afficher(id, "ko", "\u274c Ce n\u2019est pas le mot attendu.<br>R\u00e9ponse attendue&nbsp;: <strong><u>" + esc(it.ref) + "</u></strong>.");
  }

  // ---------- Items c et d (deux mots) ----------
  var DOUBLE = {
    c: { cle1:["sommet"], cle2:["oppose"], ref:"sommet oppos\u00e9",
         aide:"O ne touche pas le c\u00f4t\u00e9 [IJ]&nbsp;: c\u2019est donc un sommet, et il lui est oppos\u00e9." },
    d: { cle1:["cote"], cle2:["oppose"], ref:"c\u00f4t\u00e9 oppos\u00e9",
         aide:"[OI] ne touche pas le sommet J&nbsp;: c\u2019est donc un c\u00f4t\u00e9, et il lui est oppos\u00e9." }
  };

  function verifierDouble(id){
    var it = DOUBLE[id];
    var input1 = document.getElementById("in-" + id + "1");
    var input2 = document.getElementById("in-" + id + "2");
    var brut1 = input1.value, brut2 = input2.value;

    if (String(brut1).replace(/[\s\u00a0]/g,"") === "" && String(brut2).replace(/[\s\u00a0]/g,"") === ""){
      etats[id] = "vide";
      marquer(input1, ""); marquer(input2, "");
      afficher(id, "warn", "\u26a0\ufe0f Aucune r\u00e9ponse saisie. Compl\u00e8te les deux mots, puis clique sur <strong>OK</strong>.");
      return;
    }

    var t1 = normTexte(brut1), t2 = normTexte(brut2);
    var ok1 = contient(t1, it.cle1) || contient(t2, it.cle1);
    var ok2 = contient(t1, it.cle2) || contient(t2, it.cle2);
    marquer(input1, ok1 ? "correct" : (t1 === "" ? "" : "incorrect"));
    marquer(input2, ok2 ? "correct" : (t2 === "" ? "" : "incorrect"));

    if (ok1 && ok2){
      etats[id] = "correct";
      afficher(id, "ok", "\u2705 Bravo&nbsp;! La r\u00e9ponse attendue est bien <strong><u>" + esc(it.ref) + "</u></strong>.");
      return;
    }
    if (ok1 || ok2){
      etats[id] = "partiel";
      afficher(id, "warn", "\u26a0\ufe0f Un des deux mots est correct, mais pas l\u2019autre.<br>R\u00e9ponse attendue&nbsp;: <strong><u>" + esc(it.ref) + "</u></strong>.");
      return;
    }
    etats[id] = "incorrect";
    afficher(id, "ko", "\u274c Ce n\u2019est pas la r\u00e9ponse attendue.<br>R\u00e9ponse attendue&nbsp;: <strong><u>" + esc(it.ref) + "</u></strong>.");
  }

  var ORDRE_ITEMS = ["a","b","c","d"];

  function verifierTout(){
    if (occupe) return;
    occupe = true;
    window.setTimeout(function(){ occupe = false; }, 350);

    verifierSimple("a");
    verifierSimple("b");
    verifierDouble("c");
    verifierDouble("d");

    var total = ORDRE_ITEMS.length;
    var score = 0;
    var recap = "";
    for (var i = 0; i < ORDRE_ITEMS.length; i++){
      var id = ORDRE_ITEMS[i];
      var e = etats[id];
      if (e === "correct"){
        score++;
        recap += '<span class="r-ok">\u2714 ' + id + '</span>';
      } else if (e === "partiel"){
        recap += '<span class="r-mid">\u25d0 ' + id + '</span>';
      } else {
        recap += '<span class="r-ko">\u2718 ' + id + '</span>';
      }
    }
    if (score < 0) score = 0;
    if (score > total) score = total;
    var pct = Math.round((score / total) * 100);

    var bilan = document.getElementById("bilan");
    bilan.innerHTML =
      '<div class="score">Score&nbsp;: ' + score + '\u2009/\u2009' + total + ' (' + pct + '&nbsp;%)</div>' +
      '<div class="palier">' + palier(pct) + '</div>' +
      '<div class="recap">' + recap + '</div>' +
      '<div class="legende">\u2714 correct &nbsp;\u2022&nbsp; \u25d0 partiel (un seul des deux mots trouv\u00e9, questions c et d) &nbsp;\u2022&nbsp; \u2718 incorrect ou non r\u00e9pondu.</div>';
    bilan.hidden = false;
  }

  function basculerCorrection(){
    var box = document.getElementById("correction");
    var btn = document.getElementById("btn-corr");
    if (box.hidden){
      box.innerHTML =
        "<h2>Correction</h2>" +
        "<ul>" +
        "<li><strong>a.</strong> I, O et J sont les trois <strong>sommets</strong> du triangle OIJ.</li>" +
        "<li><strong>b.</strong> [IO], [OJ] et [IJ] sont les trois <strong>c\u00f4t\u00e9s</strong> du triangle OIJ.</li>" +
        "<li><strong>c.</strong> O est le <strong>sommet oppos\u00e9</strong> au c\u00f4t\u00e9 [IJ].</li>" +
        "<li><strong>d.</strong> [OI] est le <strong>c\u00f4t\u00e9 oppos\u00e9</strong> au sommet J.</li>" +
        "</ul>" +
        "<p>Rappel&nbsp;: dans un triangle, chaque sommet est <strong>oppos\u00e9</strong> au c\u00f4t\u00e9 qu\u2019il ne touche pas, et chaque c\u00f4t\u00e9 est <strong>oppos\u00e9</strong> au sommet qu\u2019il ne touche pas.</p>";
      box.hidden = false;
      btn.textContent = "Masquer la correction";
    } else {
      box.hidden = true;
      btn.textContent = "Voir la correction";
    }
  }

  function reinitialiser(){
    var champs = ["in-a","in-b","in-c1","in-c2","in-d1","in-d2"];
    for (var i = 0; i < champs.length; i++){
      var input = document.getElementById(champs[i]);
      if (input){
        input.value = "";
        input.disabled = false;
        input.readOnly = false;
        input.classList.remove("correct","incorrect");
      }
    }
    for (var j = 0; j < ORDRE_ITEMS.length; j++){
      var fb = document.getElementById("fb-" + ORDRE_ITEMS[j]);
      if (fb){ fb.hidden = true; fb.innerHTML = ""; fb.className = "feedback"; }
      var ai = document.getElementById("ai-" + ORDRE_ITEMS[j]);
      if (ai){ ai.hidden = true; ai.innerHTML = ""; }
    }
    etats = {};
    var bilan = document.getElementById("bilan");
    bilan.hidden = true; bilan.innerHTML = "";
    var corr = document.getElementById("correction");
    corr.hidden = true; corr.innerHTML = "";
    document.getElementById("btn-corr").textContent = "Voir la correction";
    occupe = false;
  }

  function init(){
    document.querySelector('[data-ok="a"]').addEventListener("click", function(){ verifierSimple("a"); });
    document.querySelector('[data-ok="b"]').addEventListener("click", function(){ verifierSimple("b"); });
    document.querySelector('[data-ok="c"]').addEventListener("click", function(){ verifierDouble("c"); });
    document.querySelector('[data-ok="d"]').addEventListener("click", function(){ verifierDouble("d"); });

    document.querySelector('[data-aide="a"]').addEventListener("click", function(){ basculerAide("a", SIMPLE.a.aide); });
    document.querySelector('[data-aide="b"]').addEventListener("click", function(){ basculerAide("b", SIMPLE.b.aide); });
    document.querySelector('[data-aide="c"]').addEventListener("click", function(){ basculerAide("c", DOUBLE.c.aide); });
    document.querySelector('[data-aide="d"]').addEventListener("click", function(){ basculerAide("d", DOUBLE.d.aide); });

    var champsTexte = document.querySelectorAll('input[type="text"]');
    for (var i = 0; i < champsTexte.length; i++){
      champsTexte[i].addEventListener("keydown", function(ev){
        if (ev.key !== "Enter") return;
        ev.preventDefault();
        var id = this.id.replace("in-", "");
        if (id === "a" || id === "b") verifierSimple(id);
        else if (id === "c1" || id === "c2") verifierDouble("c");
        else if (id === "d1" || id === "d2") verifierDouble("d");
      });
    }

    document.getElementById("btn-tout").addEventListener("click", verifierTout);
    document.getElementById("btn-corr").addEventListener("click", basculerCorrection);
    document.getElementById("btn-reset").addEventListener("click", reinitialiser);
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
