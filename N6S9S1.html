<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rituel &mdash; Semaine 9 S&eacute;ance 1 &mdash; Multiplier par 10, 100, 1 000</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#fffdf7;font-family:Arial,Helvetica,sans-serif;color:#243238;line-height:1.6;padding:14px;overflow-x:hidden}
.bulle{position:fixed;border-radius:50%;background:#3ba5b8;opacity:.12;pointer-events:none;z-index:0}
.b1{width:190px;height:190px;top:-70px;left:-70px}
.b2{width:130px;height:130px;top:-45px;right:-45px}
.b3{width:160px;height:160px;bottom:-60px;left:-55px}
.b4{width:110px;height:110px;bottom:-40px;right:-35px}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto}
.tete{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.etq{display:inline-block;padding:7px 16px;border-radius:8px;color:#fff;font-weight:700;font-size:.95rem}
.etq-sem{background:#8fd3e8;color:#123f4a}
.etq-sea{background:#3ba5b8}
.etq-rit{background:#1f7a8c;font-family:Georgia,"Times New Roman",serif;margin-left:auto}
h1{font-size:clamp(1.3rem,4.5vw,2rem);font-weight:900;color:#1f7a8c;margin:6px 0 18px;line-height:1.3}
.bloc{position:relative;border:2px solid #3ba5b8;border-radius:12px;background:#fff;padding:26px 18px 20px;margin-bottom:18px}
.onglet{position:absolute;top:-17px;left:18px;background:#8fd3e8;color:#123f4a;font-weight:700;font-size:.95rem;padding:5px 18px;border-radius:8px}
.tete-ex{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;min-width:0}
.pastille{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:#1f7a8c;color:#fff;font-weight:700;font-size:1rem;display:flex;align-items:center;justify-content:center}
.consigne{margin:4px 0 0;font-weight:700;text-decoration:underline;color:#1f7a8c;font-size:clamp(.95rem,2.6vw,1.05rem);min-width:0;overflow-wrap:break-word}
.item{padding:10px 0;border-bottom:1px dashed #dceff3}
.item:last-of-type{border-bottom:0}
.ligne{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-width:0}
.lettre{flex:0 0 auto;font-weight:700;color:#1f7a8c;width:22px}
.expr{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-width:0;font-size:clamp(1rem,3vw,1.15rem);font-weight:700}
input[type="text"]{width:clamp(100px,26vw,150px);min-width:0;padding:9px 8px;font-family:Arial,Helvetica,sans-serif;font-size:1rem;font-weight:700;text-align:center;color:#1f7a8c;background:#f7fcfd;border:1px solid #b9dfe8;border-bottom:2px dotted #3ba5b8;border-radius:6px}
input[type="text"]:focus{outline:2px solid #3ba5b8;outline-offset:1px}
input.correct{border-color:#2e8b57;background:#effaf3;color:#2e8b57}
input.incorrect{border-color:#c0392b;background:#fdefee;color:#c0392b}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
button{font-family:inherit;font-size:.92rem;font-weight:700;min-height:44px;padding:10px 16px;border:0;border-radius:8px;cursor:pointer;background:#3ba5b8;color:#fff;line-height:1.2}
button:hover{background:#1f7a8c}
button.sec{background:#fff;color:#1f7a8c;border:2px solid #3ba5b8}
button.sec:hover{background:#eaf7fa}
.feedback{margin:10px 0 0;padding:12px 14px;border-left:5px solid #3ba5b8;border-radius:6px;background:#f4fafb;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.75;overflow-wrap:break-word}
.feedback.ok{border-left-color:#2e8b57;background:#effaf3;color:#1e6b40}
.feedback.ko{border-left-color:#c0392b;background:#fdefee;color:#96291d}
.feedback.warn{border-left-color:#c9820a;background:#fff8ea;color:#8a5b04}
.barre{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.barre button{flex:1 1 190px}
.correction{border:2px dashed #3ba5b8;border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:18px;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.8}
.correction h2{margin:0 0 8px;font-size:1.05rem;color:#1f7a8c}
.correction ul{margin:6px 0 0;padding-left:20px}
.correction li{margin-bottom:6px}
.bilan{border:2px solid #1f7a8c;border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:18px;font-size:.92rem;line-height:1.8}
.bilan .score{font-size:clamp(1.05rem,3.2vw,1.25rem);font-weight:900;color:#1f7a8c}
.bilan .palier{font-weight:700;margin-top:4px}
.recap{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.recap span{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;background:#f4fafb;font-weight:700;font-size:.9rem;border:1px solid #dceff3}
.recap .r-ok{color:#2e8b57}
.recap .r-ko{color:#c0392b}
.legende{margin-top:10px;font-size:.85rem;color:#4d6169}
@media (max-width:768px){.actions{margin-left:0;width:100%}.actions button{flex:1 1 auto}}
@media (max-width:480px){body{padding:10px}.bloc{padding:24px 12px 16px}.etq{font-size:.85rem;padding:6px 12px}.etq-rit{margin-left:0}.expr{width:100%}.recap span{font-size:.85rem}}
</style>
</head>
<body>
<div class="bulle b1"></div><div class="bulle b2"></div><div class="bulle b3"></div><div class="bulle b4"></div>

<main class="wrap">
  <div class="tete">
    <span class="etq etq-sem">Semaine 9</span>
    <span class="etq etq-sea">S&eacute;ance 1</span>
    <span class="etq etq-rit">Rituel</span>
  </div>

  <h1>Multiplier par 10, 100 ou 1 000</h1>

  <section class="bloc">
    <span class="onglet">Calcul</span>

    <div class="tete-ex">
      <span class="pastille">1</span>
      <p class="consigne">Compl&egrave;te&nbsp;:</p>
    </div>

    <div class="item">
      <div class="ligne">
        <span class="lettre">A.</span>
        <span class="expr">
          <span>85 &times; 10 =</span>
          <input type="text" id="in-a" inputmode="numeric" autocomplete="off" aria-label="Résultat de 85 fois 10">
        </span>
        <span class="actions">
          <button type="button" data-ok="a">OK</button>
        </span>
      </div>
      <div class="feedback" id="fb-a" hidden></div>
    </div>
    <div class="item">
      <div class="ligne">
        <span class="lettre">B.</span>
        <span class="expr">
          <span>125 &times; 10 =</span>
          <input type="text" id="in-b" inputmode="numeric" autocomplete="off" aria-label="Résultat de 125 fois 10">
        </span>
        <span class="actions">
          <button type="button" data-ok="b">OK</button>
        </span>
      </div>
      <div class="feedback" id="fb-b" hidden></div>
    </div>
    <div class="item">
      <div class="ligne">
        <span class="lettre">C.</span>
        <span class="expr">
          <span>607 &times; 100 =</span>
          <input type="text" id="in-c" inputmode="numeric" autocomplete="off" aria-label="Résultat de 607 fois 100">
        </span>
        <span class="actions">
          <button type="button" data-ok="c">OK</button>
        </span>
      </div>
      <div class="feedback" id="fb-c" hidden></div>
    </div>
    <div class="item">
      <div class="ligne">
        <span class="lettre">D.</span>
        <span class="expr">
          <span>324 &times; 1 000 =</span>
          <input type="text" id="in-d" inputmode="numeric" autocomplete="off" aria-label="Résultat de 324 fois 1 000">
        </span>
        <span class="actions">
          <button type="button" data-ok="d">OK</button>
        </span>
      </div>
      <div class="feedback" id="fb-d" hidden></div>
    </div>
    <div class="item">
      <div class="ligne">
        <span class="lettre">E.</span>
        <span class="expr">
          <span>123 &times; 1 000 =</span>
          <input type="text" id="in-e" inputmode="numeric" autocomplete="off" aria-label="Résultat de 123 fois 1 000">
        </span>
        <span class="actions">
          <button type="button" data-ok="e">OK</button>
        </span>
      </div>
      <div class="feedback" id="fb-e" hidden></div>
    </div>
    <div class="item">
      <div class="ligne">
        <span class="lettre">F.</span>
        <span class="expr">
          <span>631 &times; 100 =</span>
          <input type="text" id="in-f" inputmode="numeric" autocomplete="off" aria-label="Résultat de 631 fois 100">
        </span>
        <span class="actions">
          <button type="button" data-ok="f">OK</button>
        </span>
      </div>
      <div class="feedback" id="fb-f" hidden></div>
    </div>

  </section>

  <div class="barre">
    <button type="button" id="btn-tout">V&eacute;rifier tout</button>
    <button type="button" class="sec" id="btn-corr">Voir la correction</button>
    <button type="button" class="sec" id="btn-reset">R&eacute;initialiser</button>
  </div>

  <div class="correction" id="correction" hidden></div>
  <div class="bilan" id="bilan" hidden></div>
</main>

<script>
(function(){
  "use strict";

  var ITEMS = [
    { id:"a", a:"85",  b:"10",    res:"850" },
    { id:"b", a:"125", b:"10",    res:"1250" },
    { id:"c", a:"607", b:"100",   res:"60700" },
    { id:"d", a:"324", b:"1000",  res:"324000" },
    { id:"e", a:"123", b:"1000",  res:"123000" },
    { id:"f", a:"631", b:"100",   res:"63100" }
  ];

  var etats = {};
  var occupe = false;

  function trouver(id){
    for (var i = 0; i < ITEMS.length; i++){ if (ITEMS[i].id === id) return ITEMS[i]; }
    return null;
  }

  function esc(txt){
    var d = document.createElement("div");
    d.textContent = String(txt);
    return d.innerHTML;
  }

  function normalise(brut){
    var s = String(brut).replace(/[\s\u00a0\u202f\u2009]/g, "");
    s = s.replace(/[\u2212\u2013\u2014]/g, "-");
    if (s === "") return null;
    if (!/^-?\d+$/.test(s)) return null;
    return s.replace(/^(-?)0+(?=\d)/, "$1");
  }

  function afficher(id, type, html){
    var fb = document.getElementById("fb-" + id);
    fb.className = "feedback " + type;
    fb.innerHTML = html;
    fb.hidden = false;
  }

  function marquer(input, etat){
    if (!input) return;
    input.classList.remove("correct","incorrect");
    if (etat) input.classList.add(etat);
  }

  function verifier(id){
    var it = trouver(id);
    if (!it) return;
    var input = document.getElementById("in-" + id);
    var brut = input.value;

    if (String(brut).replace(/\s/g,"") === ""){
      etats[id] = "vide"; marquer(input,"");
      afficher(id, "warn", "\u26a0\ufe0f Aucune r\u00e9ponse saisie.");
      return;
    }
    var val = normalise(brut);
    if (val === null){
      etats[id] = "incorrect"; marquer(input, "incorrect");
      afficher(id, "warn", "\u26a0\ufe0f Saisie non reconnue&nbsp;: &laquo;&nbsp;" + esc(brut) + "&nbsp;&raquo;. \u00c9cris un nombre entier.");
      return;
    }
    if (val === it.res){
      etats[id] = "correct"; marquer(input, "correct");
      afficher(id, "ok", "\u2705 Bravo&nbsp;! " + it.a + " \u00d7 " + it.b + " = " + it.res + ".");
      return;
    }
    etats[id] = "incorrect"; marquer(input, "incorrect");
    afficher(id, "ko", "\u274c Ce n\u2019est pas le r\u00e9sultat attendu. Multiplier par " + it.b + ", c\u2019est ajouter " + (it.b.length - 1) + " z\u00e9ro" + (it.b.length - 1 > 1 ? "s" : "") + " \u00e0 droite de " + it.a + ".<br>R\u00e9ponse attendue&nbsp;: <strong><u>" + it.res + "</u></strong>.");
  }

  function palier(pct){
    if (pct >= 90) return "\ud83d\udfe2 Excellent";
    if (pct >= 75) return "\ud83d\udfe2 Tr\u00e8s bien";
    if (pct >= 60) return "\ud83d\udfe1 Ma\u00eetrise satisfaisante";
    if (pct >= 40) return "\ud83d\udfe0 Ma\u00eetrise fragile";
    return "\ud83d\udd34 Ma\u00eetrise insuffisante";
  }

  function verifierTout(){
    if (occupe) return;
    occupe = true;
    window.setTimeout(function(){ occupe = false; }, 350);

    var total = ITEMS.length, score = 0, recap = "";
    for (var i = 0; i < ITEMS.length; i++){
      var id = ITEMS[i].id;
      verifier(id);
      var e = etats[id];
      if (e === "correct"){ score++; recap += '<span class="r-ok">\u2714 ' + id + '</span>'; }
      else { recap += '<span class="r-ko">\u2718 ' + id + '</span>'; }
    }
    if (score < 0) score = 0;
    if (score > total) score = total;
    var pct = Math.round((score/total)*100);
    var bilan = document.getElementById("bilan");
    bilan.innerHTML =
      '<div class="score">Score&nbsp;: ' + score + '\u2009/\u2009' + total + ' (' + pct + '&nbsp;%)</div>' +
      '<div class="palier">' + palier(pct) + '</div>' +
      '<div class="recap">' + recap + '</div>' +
      '<div class="legende">\u2714 correct &nbsp;\u2022&nbsp; \u2718 incorrect ou non r\u00e9pondu.</div>';
    bilan.hidden = false;
  }

  function basculerCorrection(){
    var box = document.getElementById("correction");
    var btn = document.getElementById("btn-corr");
    if (box.hidden){
      var lignes = "";
      for (var i = 0; i < ITEMS.length; i++){
        var it = ITEMS[i];
        lignes += "<li>" + it.a + " \u00d7 " + it.b + " = <strong><u>" + it.res + "</u></strong></li>";
      }
      box.innerHTML =
        "<h2>Correction</h2>" +
        "<ul>" + lignes + "</ul>" +
        "<p><strong>M\u00e9thode&nbsp;:</strong> multiplier un nombre entier par 10, 100 ou 1 000 revient \u00e0 ajouter respectivement 1, 2 ou 3 z\u00e9ros \u00e0 sa droite.</p>";
      box.hidden = false;
      btn.textContent = "Masquer la correction";
    } else {
      box.hidden = true;
      btn.textContent = "Voir la correction";
    }
  }

  function reinitialiser(){
    for (var i = 0; i < ITEMS.length; i++){
      var id = ITEMS[i].id;
      var input = document.getElementById("in-" + id);
      input.value = "";
      input.disabled = false;
      input.readOnly = false;
      input.classList.remove("correct","incorrect");
      var fb = document.getElementById("fb-" + id);
      fb.hidden = true;
      fb.innerHTML = "";
      fb.className = "feedback";
      etats[id] = "vide";
    }
    var bilan = document.getElementById("bilan");
    bilan.hidden = true; bilan.innerHTML = "";
    var corr = document.getElementById("correction");
    corr.hidden = true; corr.innerHTML = "";
    document.getElementById("btn-corr").textContent = "Voir la correction";
    occupe = false;
  }

  function init(){
    for (var i = 0; i < ITEMS.length; i++){ etats[ITEMS[i].id] = "vide"; }

    var boutonsOk = document.querySelectorAll("[data-ok]");
    for (var j = 0; j < boutonsOk.length; j++){
      boutonsOk[j].addEventListener("click", function(){
        verifier(this.getAttribute("data-ok"));
      });
    }

    var champs = document.querySelectorAll('input[type="text"]');
    for (var m = 0; m < champs.length; m++){
      champs[m].addEventListener("keydown", function(ev){
        if (ev.key === "Enter"){
          ev.preventDefault();
          verifier(this.id.replace("in-", ""));
        }
      });
    }

    document.getElementById("btn-tout").addEventListener("click", verifierTout);
    document.getElementById("btn-corr").addEventListener("click", basculerCorrection);
    document.getElementById("btn-reset").addEventListener("click", reinitialiser);
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
