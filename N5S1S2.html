<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rituel &mdash; 5e &mdash; Semaine 1 S&eacute;ance 2 &mdash; Valeurs de position</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#fffdf7;font-family:Arial,Helvetica,sans-serif;color:#243238;line-height:1.6;padding:14px;overflow-x:hidden}
.bulle{position:fixed;border-radius:50%;background:#3ba5b8;opacity:.12;pointer-events:none;z-index:0}
.b1{width:190px;height:190px;top:-70px;left:-70px}
.b2{width:130px;height:130px;top:-45px;right:-45px}
.b3{width:160px;height:160px;bottom:-60px;left:-55px}
.b4{width:110px;height:110px;bottom:-40px;right:-35px}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto}
.tete{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.etq{display:inline-block;padding:7px 16px;border-radius:8px;color:#fff;font-weight:700;font-size:.95rem}
.etq-sem{background:#8fd3e8;color:#123f4a}
.etq-sea{background:#3ba5b8}
.etq-rit{background:#1f7a8c;font-family:Georgia,"Times New Roman",serif;margin-left:auto}
h1{font-size:clamp(1.3rem,4.5vw,2rem);font-weight:900;color:#1f7a8c;margin:6px 0 18px;line-height:1.3}
.bloc{position:relative;border:2px solid #3ba5b8;border-radius:12px;background:#fff;padding:28px 18px 20px;margin-bottom:18px}
.onglet{position:absolute;top:-17px;left:18px;background:#8fd3e8;color:#123f4a;font-weight:700;font-size:.95rem;padding:5px 18px;border-radius:8px}
.enonce{background:#fdf6f6;border-left:5px solid #7a3e3e;border-radius:6px;padding:14px 16px;margin-bottom:20px;color:#7a3e3e;font-weight:700;font-size:clamp(.95rem,2.6vw,1.05rem);line-height:1.85;overflow-wrap:break-word}
.item{padding:12px 0;border-bottom:1px dashed #dceff3}
.item:last-of-type{border-bottom:0}
.q{font-size:clamp(1rem,3vw,1.15rem);font-weight:700;margin:0 0 8px;color:#243238;overflow-wrap:break-word}
.ligne{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-width:0}
.champ{flex:1 1 200px;min-width:0}
input[type="text"]{width:100%;min-width:0;padding:10px;font-family:Arial,Helvetica,sans-serif;font-size:1rem;font-weight:700;color:#1f7a8c;background:#f7fcfd;border:1px solid #b9dfe8;border-bottom:2px dotted #3ba5b8;border-radius:6px;min-height:44px;text-align:center;max-width:200px}
.correct{border-color:#2e8b57;background:#effaf3;color:#2e8b57}
.incorrect{border-color:#c0392b;background:#fdefee;color:#c0392b}
.actions{display:flex;flex-wrap:wrap;gap:8px}
button{font-family:inherit;font-size:.92rem;font-weight:700;min-height:44px;padding:10px 16px;border:0;border-radius:8px;cursor:pointer;background:#3ba5b8;color:#fff;line-height:1.2}
button:hover{background:#1f7a8c}
button.sec{background:#fff;color:#1f7a8c;border:2px solid #3ba5b8}
button.sec:hover{background:#eaf7fa}
.feedback{margin:10px 0 0;padding:12px 14px;border-left:5px solid #3ba5b8;border-radius:6px;background:#f4fafb;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.75;overflow-wrap:break-word}
.feedback.ok{border-left-color:#2e8b57;background:#effaf3;color:#1e6b40}
.feedback.ko{border-left-color:#c0392b;background:#fdefee;color:#96291d}
.feedback.warn{border-left-color:#c9820a;background:#fff8ea;color:#8a5b04}
.barre{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.barre button{flex:1 1 190px}
.correction{border:2px dashed #3ba5b8;border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:18px;font-size:clamp(.9rem,2.5vw,1rem);line-height:1.8}
.correction h2{margin:0 0 8px;font-size:1.05rem;color:#1f7a8c}
.correction ul{margin:6px 0 0;padding-left:20px}
.correction li{margin-bottom:6px}
.bilan{border:2px solid #1f7a8c;border-radius:12px;background:#fff;padding:16px 18px;margin-bottom:18px;font-size:.92rem;line-height:1.8}
.bilan .score{font-size:clamp(1.05rem,3.2vw,1.25rem);font-weight:900;color:#1f7a8c}
.bilan .palier{font-weight:700;margin-top:4px}
.recap{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.recap span{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;background:#f4fafb;font-weight:700;font-size:.9rem;border:1px solid #dceff3}
.recap .r-ok{color:#2e8b57}
.recap .r-ko{color:#c0392b}
.legende{margin-top:10px;font-size:.85rem;color:#4d6169}
@media (max-width:768px){.champ{flex:1 1 100%}.actions{width:100%}.actions button{flex:1 1 auto}}
@media (max-width:480px){body{padding:10px}.bloc{padding:26px 12px 16px}.etq{font-size:.85rem;padding:6px 12px}.etq-rit{margin-left:0}input[type="text"]{max-width:100%}.recap span{font-size:.85rem}}
</style>
</head>
<body>
<div class="bulle b1"></div><div class="bulle b2"></div><div class="bulle b3"></div><div class="bulle b4"></div>

<main class="wrap">
  <div class="tete">
    <span class="etq etq-sem">Semaine 1</span>
    <span class="etq etq-sea">S&eacute;ance 2</span>
    <span class="etq etq-rit">Rituel</span>
  </div>

  <h1>Valeurs de position d&rsquo;un grand nombre</h1>

  <section class="bloc">
    <span class="onglet">Alg&egrave;bre</span>

    <p class="enonce">Dans le nombre 6&nbsp;083&nbsp;472,</p>

    <div class="item">
      <p class="q">a. Le chiffre des unit&eacute;s est&nbsp;:</p>
      <div class="ligne">
        <span class="champ"><input type="text" id="in-a" inputmode="numeric" autocomplete="off" aria-label="Le chiffre des unit&eacute;s est&nbsp;:"></span>
        <span class="actions"><button type="button" data-ok="a">OK</button></span>
      </div>
      <div class="feedback" id="fb-a" hidden></div>
    </div>
    <div class="item">
      <p class="q">b. Le chiffre des dizaines de mille est&nbsp;:</p>
      <div class="ligne">
        <span class="champ"><input type="text" id="in-b" inputmode="numeric" autocomplete="off" aria-label="Le chiffre des dizaines de mille est&nbsp;:"></span>
        <span class="actions"><button type="button" data-ok="b">OK</button></span>
      </div>
      <div class="feedback" id="fb-b" hidden></div>
    </div>
    <div class="item">
      <p class="q">c. Le chiffre des unit&eacute;s de millions est&nbsp;:</p>
      <div class="ligne">
        <span class="champ"><input type="text" id="in-c" inputmode="numeric" autocomplete="off" aria-label="Le chiffre des unit&eacute;s de millions est&nbsp;:"></span>
        <span class="actions"><button type="button" data-ok="c">OK</button></span>
      </div>
      <div class="feedback" id="fb-c" hidden></div>
    </div>
    <div class="item">
      <p class="q">d. Le nombre de centaines est&nbsp;:</p>
      <div class="ligne">
        <span class="champ"><input type="text" id="in-d" inputmode="numeric" autocomplete="off" aria-label="Le nombre de centaines est&nbsp;:"></span>
        <span class="actions"><button type="button" data-ok="d">OK</button></span>
      </div>
      <div class="feedback" id="fb-d" hidden></div>
    </div>
    <div class="item">
      <p class="q">e. Le nombre de centaines de mille est&nbsp;:</p>
      <div class="ligne">
        <span class="champ"><input type="text" id="in-e" inputmode="numeric" autocomplete="off" aria-label="Le nombre de centaines de mille est&nbsp;:"></span>
        <span class="actions"><button type="button" data-ok="e">OK</button></span>
      </div>
      <div class="feedback" id="fb-e" hidden></div>
    </div>

  </section>

  <div class="barre">
    <button type="button" id="btn-tout">V&eacute;rifier tout</button>
    <button type="button" class="sec" id="btn-corr">Voir la correction</button>
    <button type="button" class="sec" id="btn-reset">R&eacute;initialiser</button>
  </div>

  <div class="correction" id="correction" hidden></div>
  <div class="bilan" id="bilan" hidden></div>
</main>

<script>
(function(){
  "use strict";

  var ITEMS = [
    { id:"a", attendu:"2",
      ref:"Le chiffre des unit\u00e9s de 6\u2009083\u2009472 est <strong><u>2</u></strong>." },
    { id:"b", attendu:"8",
      ref:"Le chiffre des dizaines de mille de 6\u2009083\u2009472 est <strong><u>8</u></strong> (dans 083, le 8 est \u00e0 la position des dizaines de mille)." },
    { id:"c", attendu:"6",
      ref:"Le chiffre des unit\u00e9s de millions de 6\u2009083\u2009472 est <strong><u>6</u></strong> (c\u2019est le seul chiffre de la p\u00e9riode des millions)." },
    { id:"d", attendu:"60834",
      ref:"Le nombre de centaines de 6\u2009083\u2009472 est <strong><u>60\u2009834</u></strong> (6\u2009083\u2009472&nbsp;\u00f7&nbsp;100, partie enti\u00e8re)." },
    { id:"e", attendu:"60",
      ref:"Le nombre de centaines de mille de 6\u2009083\u2009472 est <strong><u>60</u></strong> (6\u2009083\u2009472&nbsp;\u00f7&nbsp;100\u2009000, partie enti\u00e8re)." }
  ];

  var etats = {};
  var occupe = false;

  function trouver(id){
    for (var i = 0; i < ITEMS.length; i++){ if (ITEMS[i].id === id) return ITEMS[i]; }
    return null;
  }

  function esc(txt){
    var d = document.createElement("div");
    d.textContent = String(txt);
    return d.innerHTML;
  }

  function normalise(brut){
    var s = String(brut).replace(/[\s\u00a0\u202f\u2009]/g, "");
    s = s.replace(/[\u2212\u2013\u2014]/g, "-");
    if (s === "") return null;
    if (!/^-?\d+$/.test(s)) return null;
    return s.replace(/^(-?)0+(?=\d)/, "$1");
  }

  function afficher(id, type, html){
    var fb = document.getElementById("fb-" + id);
    fb.className = "feedback " + type;
    fb.innerHTML = html;
    fb.hidden = false;
  }

  function marquer(input, etat){
    if (!input) return;
    input.classList.remove("correct","incorrect");
    if (etat) input.classList.add(etat);
  }

  function verifier(id){
    var it = trouver(id);
    if (!it) return;
    var input = document.getElementById("in-" + id);
    var brut = input.value;
    if (String(brut).replace(/\s/g,"") === ""){
      etats[id] = "vide"; marquer(input,"");
      afficher(id, "warn", "\u26a0\ufe0f Aucune r\u00e9ponse saisie.");
      return;
    }
    var val = normalise(brut);
    if (val === null){
      etats[id] = "incorrect"; marquer(input, "incorrect");
      afficher(id, "warn", "\u26a0\ufe0f Saisie non reconnue&nbsp;: &laquo;&nbsp;" + esc(brut) + "&nbsp;&raquo;.");
      return;
    }
    if (val === it.attendu){
      etats[id] = "correct"; marquer(input, "correct");
      afficher(id, "ok", "\u2705 Bravo&nbsp;! " + it.ref);
      return;
    }
    etats[id] = "incorrect"; marquer(input, "incorrect");
    afficher(id, "ko", "\u274c Ce n\u2019est pas la bonne r\u00e9ponse.<br>" + it.ref);
  }

  function palier(pct){
    if (pct >= 90) return "\ud83d\udfe2 Excellent";
    if (pct >= 75) return "\ud83d\udfe2 Tr\u00e8s bien";
    if (pct >= 60) return "\ud83d\udfe1 Ma\u00eetrise satisfaisante";
    if (pct >= 40) return "\ud83d\udfe0 Ma\u00eetrise fragile";
    return "\ud83d\udd34 Ma\u00eetrise insuffisante";
  }

  function verifierTout(){
    if (occupe) return;
    occupe = true;
    window.setTimeout(function(){ occupe = false; }, 350);

    var total = ITEMS.length, score = 0, recap = "";
    ITEMS.forEach(function(it){
      verifier(it.id);
      if (etats[it.id] === "correct"){ score++; recap += '<span class="r-ok">\u2714 ' + it.id + '</span>'; }
      else { recap += '<span class="r-ko">\u2718 ' + it.id + '</span>'; }
    });
    var pct = Math.round((score/total)*100);
    var bilan = document.getElementById("bilan");
    bilan.innerHTML =
      '<div class="score">Score&nbsp;: ' + score + '\u2009/\u2009' + total + ' (' + pct + '&nbsp;%)</div>' +
      '<div class="palier">' + palier(pct) + '</div>' +
      '<div class="recap">' + recap + '</div>' +
      '<div class="legende">\u2714 correct &nbsp;\u2022&nbsp; \u2718 incorrect ou non r\u00e9pondu.</div>';
    bilan.hidden = false;
  }

  function basculerCorrection(){
    var box = document.getElementById("correction");
    var btn = document.getElementById("btn-corr");
    if (box.hidden){
      var lignes = "";
      ITEMS.forEach(function(it){ lignes += "<li>" + it.ref + "</li>"; });
      box.innerHTML = "<h2>Correction</h2><ul>" + lignes + "</ul>";
      box.hidden = false;
      btn.textContent = "Masquer la correction";
    } else {
      box.hidden = true;
      btn.textContent = "Voir la correction";
    }
  }

  function reinitialiser(){
    ITEMS.forEach(function(it){
      var input = document.getElementById("in-" + it.id);
      input.value = ""; input.classList.remove("correct","incorrect");
      var fb = document.getElementById("fb-" + it.id);
      fb.hidden = true; fb.innerHTML = ""; fb.className = "feedback";
      etats[it.id] = "vide";
    });
    var bilan = document.getElementById("bilan");
    bilan.hidden = true; bilan.innerHTML = "";
    var corr = document.getElementById("correction");
    corr.hidden = true; corr.innerHTML = "";
    document.getElementById("btn-corr").textContent = "Voir la correction";
    occupe = false;
  }

  function init(){
    ITEMS.forEach(function(it){ etats[it.id] = "vide"; });
    var bOk = document.querySelectorAll("[data-ok]");
    for (var a = 0; a < bOk.length; a++){
      bOk[a].addEventListener("click", function(){ verifier(this.getAttribute("data-ok")); });
    }
    var champs = document.querySelectorAll('input[type="text"]');
    for (var e = 0; e < champs.length; e++){
      champs[e].addEventListener("keydown", function(ev){
        if (ev.key === "Enter"){ ev.preventDefault(); verifier(this.id.replace("in-","")); }
      });
    }
    document.getElementById("btn-tout").addEventListener("click", verifierTout);
    document.getElementById("btn-corr").addEventListener("click", basculerCorrection);
    document.getElementById("btn-reset").addEventListener("click", reinitialiser);
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
